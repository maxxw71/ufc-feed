name: MLS Salary Enrichment

on:
  push:
    branches: [main]
    paths:
      - 'scripts/mls_salary_enrich.py'
      - '.github/workflows/mls-salary-enrich.yml'
  workflow_dispatch:

concurrency:
  group: mls-research
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  enrich:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Build salary features
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          SSH="ssh -i $KEY -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new $HOST"
          D=/home/anestishkurti92/mls-predictor-v1
          cat scripts/mls_salary_enrich.py | $SSH "cat > $D/mls_salary_enrich.py"
          $SSH "cd $D && venv/bin/python -m py_compile mls_salary_enrich.py && OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 nice -n 12 timeout 28m venv/bin/python mls_salary_enrich.py"
      - name: Pull salary audit
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          mkdir -p mls/features
          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" 'cat /home/anestishkurti92/mls-predictor-v1/reports/salary_feature_meta.json' > mls/features/salary_feature_meta.json
      - name: Persist salary audit
        shell: bash
        run: |
          set -Eeuo pipefail
          cp mls/features/salary_feature_meta.json "$RUNNER_TEMP/salary_feature_meta.json"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p mls/features
          cp "$RUNNER_TEMP/salary_feature_meta.json" mls/features/salary_feature_meta.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add mls/features/salary_feature_meta.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish MLS salary feature audit'
            git push origin HEAD:main
          fi
