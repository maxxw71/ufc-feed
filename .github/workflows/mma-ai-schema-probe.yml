name: MMA AI Schema Probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'mma_ai_schema_probe.py'
      - '.github/workflows/mma-ai-schema-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas
      - run: python mma_ai_schema_probe.py
