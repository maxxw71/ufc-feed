name: NBA Injury Rotation Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/research/discover_injury_rotation.py'
      - 'nba/features/historical_injury_teams.csv.gz'
      - 'nba/features/historical_injury_players.csv.gz'
      - '.github/workflows/nba-injury-rotation-research.yml'

permissions:
  contents: write

concurrency:
  group: nba-injury-rotation-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Discover point-in-time injury and rotation interactions
        run: python nba/research/discover_injury_rotation.py
      - name: Publish research-only findings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name appwiza-nba-bot
          git config user.email actions@users.noreply.github.com
          cp nba/research/injury_rotation/injury_rotation_report.json /tmp/nba_injury_rotation_report.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            mkdir -p nba/research/injury_rotation
            cp /tmp/nba_injury_rotation_report.json nba/research/injury_rotation/injury_rotation_report.json
            git add nba/research/injury_rotation/injury_rotation_report.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "nba: publish injury rotation research results"
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
