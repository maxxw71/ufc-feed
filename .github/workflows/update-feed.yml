name: Update UFC Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "fetch_ufc_feed.py"
      - ".github/workflows/update-feed.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Probe UFC proxy
        run: |
          python - <<'PY'
          import requests
          u='https://r.jina.ai/https://www.ufc.com/events?language_content_entity=en'
          r=requests.get(u,timeout=30,headers={'User-Agent':'ufc-feed/1.0'})
          print('JINA_STATUS',r.status_code,'BYTES',len(r.text))
          print(r.text[:5000])
          PY

      - name: Build feed
        run: python fetch_ufc_feed.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upcoming.json
          if git diff --cached --quiet; then
            echo "Feed unchanged"
            exit 0
          fi
          git commit -m "Update upcoming UFC feed"
          git push
