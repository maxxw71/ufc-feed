name: Update UFC Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "fetch_ufc_feed.py"
      - "filter_feed.py"
      - "enrich_odds.py"
      - ".github/workflows/update-feed.yml"

permissions:
  contents: write

concurrency:
  group: ufc-feed-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Provision existing odds credential for appwiza research
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          key = os.environ.get('THE_ODDS_API_KEY', '').strip()
          if not key:
              raise SystemExit('Configured THE_ODDS_API_KEY secret is unavailable')
          destination = Path('/srv/appwiza-sports/credentials/ufc/the_odds_api_key')
          temporary = destination.with_suffix('.tmp')
          fd = os.open(temporary, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o640)
          with os.fdopen(fd, 'w') as handle:
              handle.write(key)
          os.chmod(temporary, 0o640)
          os.replace(temporary, destination)
          print('Existing odds credential provisioned privately on appwiza')
          PY

      - name: Build feed
        run: python fetch_ufc_feed.py

      - name: Filter feed
        run: python filter_feed.py

      - name: Enrich with sportsbook odds
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python enrich_odds.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upcoming.json
          if git diff --cached --quiet; then
            echo "Feed unchanged"
            exit 0
          fi
          git commit -m "Update upcoming UFC feed"
          git pull --rebase origin main
          git push origin HEAD:main
