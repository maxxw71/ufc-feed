name: Method Key Source Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/method-key-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official live method definitions
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" 'bash -s' <<'EOF'
          set -Eeuo pipefail
          echo '=== UFC EMAIL DESIGN METHODS ==='
          sed -n '1,220p' /home/anestishkurti92/ufc-predictor-v1/ufc_email_design.py
          echo '=== UFC LIVE METHOD IDS/TITLES ==='
          grep -nE "['\"]id['\"]:[[:space:]]*['\"]U[0-9]+|U[0-9]+ ·|Official method U[0-9]+|METHOD.*U[0-9]+" /home/anestishkurti92/ufc-predictor-v1/ufc_email_watcher.py | tail -260
          echo '=== NFL EMAIL DESIGN METHODS ==='
          sed -n '1,180p' /home/anestishkurti92/nfl-predictor-v1/research_v2/nfl_email_design.py
          echo '=== NFL H LIVE STAGE ==='
          cat /home/appwiza-runner/nfl-context-data/live_stage/approved_h_methods.json 2>/dev/null || true
          EOF
