name: UFC Method Combinations V2
on:
  push:
    paths:
      - '.github/workflows/ufc-method-combos-v2.yml'
  workflow_dispatch:
jobs:
  analyze:
    runs-on: [self-hosted, appwiza]
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          K=/home/appwiza-runner/.ssh/appwiza_vps
          ssh -i "$K" -o StrictHostKeyChecking=no anestishkurti92@127.0.0.1 'cd /home/anestishkurti92/ufc-predictor-v1 && curl -fsSL https://raw.githubusercontent.com/maxxw71/ufc-feed/main/scripts/ufc_method_combos.py -o ufc_method_combos.py && venv/bin/python ufc_method_combos.py && systemctl is-active ufc-model-watcher.timer'
