name: UFC Recent Daily Odds Backfill V2

on:
  workflow_dispatch:
  push:
    paths:
      - 'ufc_recent_daily_backfill_v2.py'
      - '.github/workflows/ufc-recent-daily-backfill-v2.yml'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy duckdb
      - name: Download MMA results database
        run: |
          curl -L --fail --retry 10 --retry-delay 3 --retry-all-errors \
            'https://www.kaggle.com/api/v1/datasets/download/leandroiber/mmastats' \
            -o /tmp/mma.zip
          mkdir -p /tmp/mma_extract
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/mma.zip') as z:
              z.extractall('/tmp/mma_extract')
          PY
      - name: Download daily UFC odds dataset
        run: |
          curl -L --fail --retry 10 --retry-delay 3 --retry-all-errors \
            'https://www.kaggle.com/api/v1/datasets/download/jerzyszocik/ufc-betting-odds-daily-dataset' \
            -o /tmp/odds.zip
          mkdir -p /tmp/odds_extract
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/odds.zip') as z:
              z.extractall('/tmp/odds_extract')
          PY
      - name: Run V2 backfill
        run: python ufc_recent_daily_backfill_v2.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ufc_recent_daily_backfill_v2/
          git commit -m "Add cleaned UFC 2024-current daily odds backfill" || exit 0
          git push
