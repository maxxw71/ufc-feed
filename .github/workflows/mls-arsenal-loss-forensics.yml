name: MLS Arsenal Loss Forensics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/mls_arsenal_loss_forensics.py'
      - '.github/workflows/mls-arsenal-loss-forensics.yml'

concurrency:
  group: mls-arsenal-loss-forensics
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  forensics:
    if: github.repository == 'maxxw71/ufc-feed'
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Deploy and run MLS arsenal loss forensics
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          SSH="ssh -i $KEY -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new $HOST"
          D=/home/anestishkurti92/mls-predictor-v1
          cat scripts/mls_arsenal_research.py | $SSH 'set -e; D=/home/anestishkurti92/mls-predictor-v1; cat > "$D/mls_arsenal_research.py.new"; chmod 0644 "$D/mls_arsenal_research.py.new"; mv -f "$D/mls_arsenal_research.py.new" "$D/mls_arsenal_research.py"'
          cat scripts/mls_arsenal_loss_forensics.py | $SSH 'set -e; D=/home/anestishkurti92/mls-predictor-v1; cat > "$D/mls_arsenal_loss_forensics.py.new"; chmod 0644 "$D/mls_arsenal_loss_forensics.py.new"; mv -f "$D/mls_arsenal_loss_forensics.py.new" "$D/mls_arsenal_loss_forensics.py"'
          $SSH 'set -Eeuo pipefail; cd /home/anestishkurti92/mls-predictor-v1; venv/bin/python -m py_compile mls_arsenal_research.py mls_arsenal_loss_forensics.py; OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 nice -n 12 timeout 18m venv/bin/python mls_arsenal_loss_forensics.py'

      - name: Pull non-secret loss forensics audit
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          mkdir -p mls/research
          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" 'cat /home/anestishkurti92/mls-predictor-v1/research/arsenal_loss_forensics/latest.json' > mls/research/arsenal_loss_forensics_latest.json

      - name: Persist loss forensics audit
        shell: bash
        run: |
          set -Eeuo pipefail
          cp mls/research/arsenal_loss_forensics_latest.json "$RUNNER_TEMP/loss_forensics.json"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p mls/research
          cp "$RUNNER_TEMP/loss_forensics.json" mls/research/arsenal_loss_forensics_latest.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add mls/research/arsenal_loss_forensics_latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish MLS arsenal loss forensics audit'
            git push origin HEAD:main
          fi
