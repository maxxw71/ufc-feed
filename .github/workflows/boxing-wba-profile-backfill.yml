name: Boxing WBA Profile Backfill

on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/backfill_wba_profiles.py'
      - '.github/workflows/boxing-wba-profile-backfill.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Boxing WBA Profile Identity Index
    types: [completed]
    branches: [main]

concurrency:
  group: boxing-wba-profile-backfill
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  enrich:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4 lxml
      - name: Download current public boxing research DB for ambiguity checks
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/wba-profile-db
          mkdir -p /tmp/wba-profile-db
          python - <<'PY'
          import io,zipfile,urllib.request,os,shutil
          url='https://appwiza.com/sports/downloads/boxing/research-database.zip'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 AppwizaWBAProfile/1.1'})
          with urllib.request.urlopen(req,timeout=180) as r:data=r.read()
          with zipfile.ZipFile(io.BytesIO(data)) as z:z.extractall('/tmp/wba-profile-db')
          db=next(os.path.join(root,f) for root,_,files in os.walk('/tmp/wba-profile-db') for f in files if f.endswith('.sqlite3'))
          shutil.copy2(db,'boxing/research/boxing.sqlite3')
          PY
      - name: Crawl explicitly linked official WBA profiles
        run: python boxing/research/backfill_wba_profiles.py --limit 500 --sleep 0.08
      - name: Remove temporary profile database
        if: always()
        run: rm -f boxing/research/boxing.sqlite3
      - name: Persist verified WBA profile supplements on latest main
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/wba-profile-enrichment
          cp boxing/profile_supplements/verified_profiles.jsonl /tmp/wba-profile-enrichment/verified_profiles.jsonl
          cp boxing/profile_supplements/wba_profile_backfill_report.json /tmp/wba-profile-enrichment/wba_profile_backfill_report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/wba-profile-enrichment/verified_profiles.jsonl boxing/profile_supplements/verified_profiles.jsonl
          cp /tmp/wba-profile-enrichment/wba_profile_backfill_report.json boxing/profile_supplements/wba_profile_backfill_report.json
          git add boxing/profile_supplements/verified_profiles.jsonl boxing/profile_supplements/wba_profile_backfill_report.json
          if git diff --cached --quiet; then
            echo 'No new WBA profile supplements.'
          else
            git commit -m 'Expand verified boxer profiles from official WBA graph'
            git push origin HEAD:main
          fi
