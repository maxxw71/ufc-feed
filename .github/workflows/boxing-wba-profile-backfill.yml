name: Boxing WBA Profile Backfill

on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/backfill_wba_profiles.py'
      - '.github/workflows/boxing-wba-profile-backfill.yml'
  workflow_dispatch:

concurrency:
  group: boxing-wba-profile-backfill
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4 lxml
      - name: Crawl explicitly linked official WBA profiles
        run: python boxing/research/backfill_wba_profiles.py --limit 900 --sleep 0.18
      - name: Persist verified WBA profile supplements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add boxing/profile_supplements/verified_profiles.jsonl boxing/profile_supplements/wba_profile_backfill_report.json
          if git diff --cached --quiet; then
            echo 'No new WBA profile supplements.'
          else
            git commit -m 'Expand verified boxer profiles from official WBA graph'
            git pull --rebase origin main
            git push
          fi
