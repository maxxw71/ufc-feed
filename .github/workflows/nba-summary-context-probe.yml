name: NBA summary context probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/probe_summary_context.py'
      - '.github/workflows/nba-summary-context-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nba/probe_summary_context.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/research/gap_audit/espn_summary_context_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: add summary context probe results"
          git pull --rebase origin main
          git push
