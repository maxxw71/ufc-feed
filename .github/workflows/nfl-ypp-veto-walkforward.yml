name: NFL YPP veto walk-forward

on:
  push:
    paths:
      - '.github/workflows/nfl-ypp-veto-walkforward.yml'
      - 'scripts/nfl_ypp_veto_walkforward.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  ROOT: /home/runner/nfl-predictor-v1

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare environment
        run: |
          python -m venv "$ROOT/venv"
          source "$ROOT/venv/bin/activate"
          pip install -q --upgrade pip
          pip install -q pandas numpy pyarrow scipy scikit-learn
          mkdir -p "$ROOT/data/raw"
          cp relay/nfl/schedules_2006_2026.parquet "$ROOT/data/raw/"
          cp relay/nfl/team_weekly_2006_2026.parquet "$ROOT/data/raw/"
      - name: Build strict pregame feature table
        run: bash scripts/run_nfl_rolling_roi_discovery.sh
      - name: Run strict veto walk-forward
        run: |
          source "$ROOT/venv/bin/activate"
          python -u scripts/nfl_ypp_veto_walkforward.py
      - name: Upload validation results
        uses: actions/upload-artifact@v4
        with:
          name: nfl-ypp-veto-walkforward
          path: /home/runner/nfl-predictor-v1/nfl_ypp_veto_walkforward/*.csv
          if-no-files-found: error
