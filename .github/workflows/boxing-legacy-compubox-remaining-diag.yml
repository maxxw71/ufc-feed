name: Boxing Legacy CompuBox Remaining Diagnostics
on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/diagnose_remaining_legacy_compubox.py'
      - '.github/workflows/boxing-legacy-compubox-remaining-diag.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download boxing research database
        run: |
          python - <<'PY'
          import io,zipfile,urllib.request
          u='https://appwiza.com/sports/downloads/boxing/research-database.zip'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 AppwizaCompuBoxDiag/1.0'})
          with urllib.request.urlopen(req,timeout=180) as r:data=r.read()
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              name=next(n for n in z.namelist() if n.endswith('.sqlite3'))
              open('/tmp/boxing_research.sqlite3','wb').write(z.read(name))
          PY
      - run: python boxing/research/diagnose_remaining_legacy_compubox.py --db /tmp/boxing_research.sqlite3
      - name: Persist diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail
          cp boxing/public_punch_audit/legacy_compubox_remaining_identity_diag.json /tmp/legacy_compubox_remaining_identity_diag.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/legacy_compubox_remaining_identity_diag.json boxing/public_punch_audit/
            git add boxing/public_punch_audit/legacy_compubox_remaining_identity_diag.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish remaining legacy CompuBox diagnostics'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
