name: DWCS Full UFC Directory Enrichment v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dwcs-full-ufc-directory-v2.yml'
      - 'dwcs/research/build_ufc_com_full_directory_enrichment.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 50
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas requests rapidfuzz
      - name: Enumerate official UFC athlete directory and match DWCS fighters
        run: python dwcs/research/build_ufc_com_full_directory_enrichment.py
      - name: Commit
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add dwcs/research/ufc_com_directory_full
          git diff --cached --quiet && exit 0
          git commit -m 'Expand DWCS coverage from full official UFC directory'
          git pull --rebase origin main
          git push
