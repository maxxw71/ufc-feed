name: Deploy Appwiza NFL production approval guard

on:
  push:
    branches: [main]
    paths:
      - 'nfl/production_approval_guard.py'
      - 'nfl/test_production_approval_guard.py'
      - '.github/workflows/appwiza-nfl-production-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    if: github.repository == 'maxxw71/ufc-feed' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Test approval guard
        shell: bash
        run: |
          set -euo pipefail
          cd nfl
          python3 test_production_approval_guard.py

      - name: Patch confirmed live site/email scanner
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/home/anestishkurti92/nfl-predictor-v1
          R2="$ROOT/research_v2"
          SCANNER="$R2/nfl_home_opener_scanner.py"
          REPORT=nfl/live_production_guard_deploy_report.txt
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          BACKUP="$ROOT/backups/production_guard_$TS"
          LOCAL=/tmp/nfl_home_opener_scanner.guarded.py
          STAGE=initialize
          SUDO=''

          mkdir -p nfl
          {
            echo "attempted_at=$TS"
            echo "production_scanner=$SCANNER"
          } > "$REPORT"

          fail_report() {
            rc=$?
            echo "deployment_status=FAILED" >> "$REPORT"
            echo "failed_stage=$STAGE" >> "$REPORT"
            echo "exit_code=$rc" >> "$REPORT"
          }
          trap fail_report ERR

          STAGE=access_check
          test -r "$SCANNER"
          if [ ! -w "$SCANNER" ] || [ ! -w "$R2" ]; then
            if sudo -n true >/dev/null 2>&1; then
              SUDO=sudo
              echo 'install_mode=passwordless_sudo' >> "$REPORT"
            else
              echo 'install_mode=unwritable_no_sudo' >> "$REPORT"
              false
            fi
          else
            echo 'install_mode=direct_write' >> "$REPORT"
          fi

          STAGE=prepare_local_patch
          cp "$SCANNER" "$LOCAL"
          python3 - "$LOCAL" <<'PY'
          from pathlib import Path
          import sys
          path=Path(sys.argv[1])
          text=path.read_text()
          if 'import production_approval_guard as production_gate' not in text:
              anchor='import nfl_email_design\n'
              if anchor not in text:
                  raise RuntimeError('production scanner import anchor missing')
              text=text.replace(anchor,anchor+'import production_approval_guard as production_gate\n',1)
          marker="late_records,late_status=late.scan(G,R,now,current_odds);records.extend(late_records)"
          if 'production_gate.approve(records,now)' not in text:
              if marker not in text:
                  raise RuntimeError('production scanner records-finalization anchor missing')
              gate=("\n records,production_rejections=production_gate.approve(records,now)"
                    "\n atomic(S/'production_rejections.json',{'scanned_at':now.isoformat(),'rejections':production_rejections})")
              text=text.replace(marker,marker+gate,1)
          path.write_text(text)
          PY

          STAGE=validate_local_patch
          python3 -m py_compile nfl/production_approval_guard.py "$LOCAL"
          python3 - "$LOCAL" <<'PY'
          from pathlib import Path
          import sys
          text=Path(sys.argv[1]).read_text()
          gate=text.index('production_gate.approve(records,now)')
          publish=text.index('sports_publish.safe_call(sports_publish.publish_nfl,records,now,nfl_email_design)')
          render=text.index('nfl_email_design.render(records,now)',publish)
          assert gate < publish < render
          print('site/email same guarded records source check: PASS')
          PY

          STAGE=backup_live
          $SUDO mkdir -p "$BACKUP"
          $SUDO cp -a "$SCANNER" "$BACKUP/nfl_home_opener_scanner.py"
          if [ -f "$R2/production_approval_guard.py" ]; then
            $SUDO cp -a "$R2/production_approval_guard.py" "$BACKUP/production_approval_guard.py.previous"
          fi
          echo "backup=$BACKUP" >> "$REPORT"

          rollback_live() {
            $SUDO install -m 0644 "$BACKUP/nfl_home_opener_scanner.py" "$SCANNER" || true
            if [ -f "$BACKUP/production_approval_guard.py.previous" ]; then
              $SUDO install -m 0644 "$BACKUP/production_approval_guard.py.previous" "$R2/production_approval_guard.py" || true
            else
              $SUDO rm -f "$R2/production_approval_guard.py" || true
            fi
          }

          STAGE=install_live
          $SUDO install -m 0644 nfl/production_approval_guard.py "$R2/production_approval_guard.py"
          $SUDO install -m 0644 "$LOCAL" "$SCANNER"

          STAGE=validate_live
          if ! python3 -m py_compile "$R2/production_approval_guard.py" "$SCANNER"; then
            rollback_live
            false
          fi
          if ! cmp -s nfl/production_approval_guard.py "$R2/production_approval_guard.py"; then
            rollback_live
            false
          fi

          PYTHONPATH="$R2" python3 - <<'PY'
          from datetime import datetime,timedelta,timezone
          import production_approval_guard as g
          now=datetime(2026,9,14,5,15,tzinfo=timezone.utc)
          base={
            'game_id':'2026_04_TEST','week':4,'method':'base_ypp_v1',
            'selection_side':'away','prior_games':3,'opponent_prior_games':3,
            'pre_off_ypp':6.3,'opp_pre_def_ypp_allowed':6.0,
            'kickoff':(now+timedelta(days=1)).isoformat(),
            'odds':{'moneyline':-150,'retrieved_at':now.isoformat()}}
          ok,bad=g.approve([base],now)
          assert len(ok)==1 and not bad
          wk1={**base,'game_id':'2026_01_LAC_ARI','week':1,
               'odds':{**base['odds'],'moneyline':-500}}
          ok,bad=g.approve([wk1],now)
          assert not ok and 'insufficient_history' in bad[0]['reasons']
          research={**base,'game_id':'research','method':'pass_defense_offense24'}
          ok,bad=g.approve([research],now)
          assert not ok and 'unsupported_method' in bad[0]['reasons']
          print('live approval guard regression: PASS')
          PY

          STAGE=complete
          echo 'deployment_status=PASS' >> "$REPORT"
          echo 'approved_methods=base_ypp_v1' >> "$REPORT"
          echo 'min_week=4' >> "$REPORT"
          echo 'min_prior_games=3' >> "$REPORT"
          echo 'week1_LAC_ARI_regression=PASS' >> "$REPORT"
          echo 'unapproved_research_method_regression=PASS' >> "$REPORT"
          echo 'site_email_same_guarded_records=PASS' >> "$REPORT"
          trap - ERR

      - name: Refresh public NFL page without sending email
        if: success()
        shell: bash
        run: |
          set -u
          ROOT=/home/anestishkurti92/nfl-predictor-v1
          R2="$ROOT/research_v2"
          REPORT=nfl/live_production_guard_deploy_report.txt
          PY=''
          for p in "$ROOT/venv/bin/python" "$ROOT/.venv/bin/python" "$ROOT/venv.google-original/bin/python" "$(command -v python3 2>/dev/null || true)"; do
            if [ -n "$p" ] && [ -x "$p" ] && "$p" -c 'import pandas,polars,requests' >/dev/null 2>&1; then PY="$p"; break; fi
          done
          if [ -n "$PY" ]; then
            if (cd "$R2" && timeout 150s "$PY" nfl_home_opener_scanner.py) > /tmp/nfl_guard_refresh.log 2>&1; then
              echo 'public_refresh=PASS' >> "$REPORT"
            else
              echo 'public_refresh=WARNING_failed_no_email_sent' >> "$REPORT"
            fi
          else
            echo 'public_refresh=WARNING_no_compatible_python_found' >> "$REPORT"
          fi

      - name: Commit sanitized deployment report
        if: always()
        shell: bash
        run: |
          set -u
          REPORT=nfl/live_production_guard_deploy_report.txt
          if [ ! -f "$REPORT" ]; then echo 'deployment_status=FAILED_NO_REPORT' > "$REPORT"; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REPORT"
          if ! git diff --cached --quiet; then
            git commit -m 'Record live NFL production guard deployment'
            git push || true
          fi
