name: Deploy Appwiza NFL production matchup guard

on:
  push:
    branches: [main]
    paths:
      - 'nfl/production_match_guard.py'
      - 'nfl/test_production_match_guard.py'
      - 'nfl/patch_live_scanner_match_guard.py'
      - '.github/workflows/appwiza-nfl-production-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    if: github.repository == 'maxxw71/ufc-feed' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Test matchup identity guard
        shell: bash
        run: |
          set -euo pipefail
          cd nfl
          python3 test_production_match_guard.py
          python3 -m py_compile production_match_guard.py patch_live_scanner_match_guard.py

      - name: Build and validate production patch on a copy
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/home/anestishkurti92/nfl-predictor-v1
          R2="$ROOT/research_v2"
          SCANNER="$R2/nfl_home_opener_scanner.py"
          EMAIL="$R2/nfl_email_design.py"
          cp "$SCANNER" /tmp/nfl_home_opener_scanner.integrity.py
          cp "$EMAIL" /tmp/nfl_email_design.integrity.py
          python3 nfl/patch_live_scanner_match_guard.py /tmp/nfl_home_opener_scanner.integrity.py
          python3 - /tmp/nfl_email_design.integrity.py <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);text=p.read_text()
          old="  selected=r['away'] if r.get('selection_side')=='away' else r['home'];opp=r['home'] if selected==r['away'] else r['away']"
          new="  side=r.get('selection_side')\n  if side not in ('home','away') or r.get('selected_team')!=r.get(side):raise ValueError('Unvalidated NFL selection identity')\n  selected=r['selected_team'];opp=r['away'] if side=='home' else r['home']"
          if old in text:text=text.replace(old,new,1)
          elif "raise ValueError('Unvalidated NFL selection identity')" not in text:raise RuntimeError('email identity anchor missing')
          p.write_text(text)
          PY
          python3 -m py_compile /tmp/nfl_home_opener_scanner.integrity.py /tmp/nfl_email_design.integrity.py nfl/production_match_guard.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/nfl_home_opener_scanner.integrity.py').read_text()
          gate=s.index('match_guard.filter_records(raw_production_records,G,now)')
          assert s.index("atomic(S/(stamp+'.json')",gate)>gate
          assert s.index('sports_publish.safe_call(sports_publish.publish_nfl,records,now,nfl_email_design)',gate)>gate
          assert s.index('nfl_email_design.render(records,now)',gate)>gate
          assert s.index('bet_tracker.nfl_picks(records)',gate)>gate
          assert "selection_side='home',selected_team=x.home_team" in s
          assert "market_side':side,'market_team':selected" in s
          e=Path('/tmp/nfl_email_design.integrity.py').read_text()
          assert "raise ValueError('Unvalidated NFL selection identity')" in e
          print('NFL site/email/bet-ledger common guarded boundary: PASS')
          PY

      - name: Install on confirmed production path
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/home/anestishkurti92/nfl-predictor-v1
          R2="$ROOT/research_v2"
          SCANNER="$R2/nfl_home_opener_scanner.py"
          EMAIL="$R2/nfl_email_design.py"
          REPORT=nfl/live_production_guard_deploy_report.txt
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          BACKUP="$ROOT/backups/match_integrity_$TS"
          mkdir -p nfl
          {
            echo "attempted_at=$TS"
            echo "production_scanner=$SCANNER"
            echo "guard=production_match_guard.py"
            echo "repo_tests=PASS"
            echo "local_patch_validation=PASS"
          } > "$REPORT"

          if [ ! -w "$SCANNER" ] || [ ! -w "$EMAIL" ] || [ ! -w "$R2" ]; then
            echo 'deployment_status=BLOCKED_PERMISSIONS' >> "$REPORT"
            echo 'live_code_changed=no' >> "$REPORT"
            echo 'required_owner=anestishkurti92' >> "$REPORT"
            echo 'reason=appwiza-runner cannot write the owner-controlled production scanner directory' >> "$REPORT"
            exit 73
          fi

          mkdir -p "$BACKUP"
          cp -a "$SCANNER" "$EMAIL" "$BACKUP/"
          [ ! -f "$R2/production_match_guard.py" ] || cp -a "$R2/production_match_guard.py" "$BACKUP/production_match_guard.py.previous"
          install -m 0644 nfl/production_match_guard.py "$R2/production_match_guard.py"
          install -m 0644 /tmp/nfl_home_opener_scanner.integrity.py "$SCANNER"
          install -m 0644 /tmp/nfl_email_design.integrity.py "$EMAIL"

          python3 -m py_compile "$R2/production_match_guard.py" "$SCANNER" "$EMAIL"
          cmp -s nfl/production_match_guard.py "$R2/production_match_guard.py"
          grep -q 'match_guard.filter_records(raw_production_records,G,now)' "$SCANNER"
          grep -q "selection_side='home',selected_team=x.home_team" "$SCANNER"
          grep -q "raise ValueError('Unvalidated NFL selection identity')" "$EMAIL"
          echo 'deployment_status=PASS' >> "$REPORT"
          echo 'live_code_changed=yes' >> "$REPORT"
          echo "backup=$BACKUP" >> "$REPORT"
          echo 'missing_selection_side=REJECT' >> "$REPORT"
          echo 'selected_team_mismatch=REJECT' >> "$REPORT"
          echo 'schedule_identity_mismatch=REJECT' >> "$REPORT"
          echo 'espn_odds_event_mismatch=REJECT' >> "$REPORT"
          echo 'odds_side_or_team_mismatch=REJECT' >> "$REPORT"
          echo 'duplicate_game_id=REJECT_ALL' >> "$REPORT"
          echo 'stale_or_missing_odds=REJECT' >> "$REPORT"
          echo 'guard_exception=EMPTY_OUTPUT_FAIL_CLOSED' >> "$REPORT"

      - name: Commit sanitized deployment report
        if: always()
        shell: bash
        run: |
          set -u
          REPORT=nfl/live_production_guard_deploy_report.txt
          if [ ! -f "$REPORT" ]; then echo 'deployment_status=FAILED_NO_REPORT' > "$REPORT"; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REPORT"
          if ! git diff --cached --quiet; then
            git commit -m 'Record NFL matchup guard deployment status'
            git push || true
          fi
