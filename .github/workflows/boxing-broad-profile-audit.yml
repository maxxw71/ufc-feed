name: Boxing BROAD Profile Agreement Audit

on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/audit_boxing_data_public_profiles.py'
      - 'boxing/profile_supplements/boxing_data_public_profile_candidates.csv'
      - '.github/workflows/boxing-broad-profile-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 5
    steps:
      - name: Prepare isolated boxing scratch space
        run: mkdir -p "${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}"
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python boxing/research/audit_boxing_data_public_profiles.py
      - name: Publish agreement audit
        shell: bash
        run: |
          set -Eeuo pipefail
          cp boxing/profile_supplements/boxing_data_public_profile_agreement.json /tmp/report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/report.json boxing/profile_supplements/boxing_data_public_profile_agreement.json
            git add boxing/profile_supplements/boxing_data_public_profile_agreement.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Refresh Boxing Data BROAD profile agreement audit'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

# cleaned-profile-rerun: 2026-10-04T08:12Z

      - name: Remove this run temporary boxing files
        if: always()
        run: rm -rf -- "${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}"
