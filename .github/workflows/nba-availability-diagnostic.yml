name: NBA Availability Diagnostic
on:
  push:
    branches: [main]
    paths:
      - "nba/availability/diagnose_availability.py"
      - ".github/workflows/nba-availability-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nba/availability/diagnose_availability.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/availability/diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: record availability join diagnostic"
          git pull --rebase origin main
          git push
