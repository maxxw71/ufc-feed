name: Capacity-aware bankroll backtest

on:
  push:
    branches: [main]
    paths:
      - 'crypto/research/capacity_bankroll_backtest.py'
      - '.github/workflows/capacity-bankroll-backtest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy requests
      - run: python crypto/research/capacity_bankroll_backtest.py
      - name: Commit outputs
        run: |
          git config user.name "appwiza-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crypto/research/results_capacity_bankroll
          if ! git diff --cached --quiet; then
            git commit -m "Update capacity-aware bankroll backtest"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
