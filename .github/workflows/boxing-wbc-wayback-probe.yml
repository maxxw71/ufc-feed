name: Boxing WBC Wayback Probe
on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/probe_wbc_wayback.py'
      - '.github/workflows/boxing-wbc-wayback-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python boxing/research/probe_wbc_wayback.py
      - name: Persist probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add boxing/rankings/wbc_wayback_probe.json
          if git diff --cached --quiet; then
            echo 'No WBC Wayback probe changes.'
          else
            git commit -m 'Run WBC Wayback probe'
            git pull --rebase origin main
            git push
          fi
