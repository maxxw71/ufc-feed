name: Boxing Legacy CompuBox Strict Parse
on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/parse_legacy_compubox_candidates.py'
      - 'boxing/research/import_archived_compubox_rounds.py'
      - 'boxing/public_punch_audit/legacy_compubox_fetched_candidates.json'
      - '.github/workflows/boxing-legacy-compubox-parse.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download boxing research database
        run: |
          python - <<'PY'
          import io,zipfile,urllib.request,os
          u='https://appwiza.com/sports/downloads/boxing/research-database.zip'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 AppwizaLegacyCompuBoxParse/1.0'})
          with urllib.request.urlopen(req,timeout=180) as r:data=r.read()
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              name=next(n for n in z.namelist() if n.endswith('.sqlite3'))
              open('/tmp/boxing_research.sqlite3','wb').write(z.read(name))
          print(os.path.getsize('/tmp/boxing_research.sqlite3'))
          PY
      - name: Strict parse legacy punch tables
        run: |
          python boxing/research/parse_legacy_compubox_candidates.py --db /tmp/boxing_research.sqlite3
          python boxing/research/export_legacy_compubox_final_totals.py --db /tmp/boxing_research.sqlite3
          python boxing/research/audit_legacy_compubox_identity.py --db /tmp/boxing_research.sqlite3
      - name: Persist strict legacy reports
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/legacy-parse
          cp boxing/punch_supplements/legacy_compubox_round_reports.jsonl /tmp/legacy-parse/
          cp boxing/punch_supplements/legacy_compubox_round_report.json /tmp/legacy-parse/
          cp boxing/punch_supplements/legacy_compubox_final_totals.jsonl /tmp/legacy-parse/
          cp boxing/punch_supplements/legacy_compubox_final_totals_report.json /tmp/legacy-parse/
          cp boxing/public_punch_audit/legacy_compubox_identity_audit.json /tmp/legacy-parse/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/legacy-parse/legacy_compubox_round_reports.jsonl boxing/punch_supplements/
            cp /tmp/legacy-parse/legacy_compubox_round_report.json boxing/punch_supplements/
            cp /tmp/legacy-parse/legacy_compubox_final_totals.jsonl boxing/punch_supplements/
            cp /tmp/legacy-parse/legacy_compubox_final_totals_report.json boxing/punch_supplements/
            cp /tmp/legacy-parse/legacy_compubox_identity_audit.json boxing/public_punch_audit/
            git add boxing/punch_supplements/legacy_compubox_round_reports.jsonl boxing/punch_supplements/legacy_compubox_round_report.json boxing/punch_supplements/legacy_compubox_final_totals.jsonl boxing/punch_supplements/legacy_compubox_final_totals_report.json boxing/public_punch_audit/legacy_compubox_identity_audit.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Add strict legacy CompuBox round reports'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

