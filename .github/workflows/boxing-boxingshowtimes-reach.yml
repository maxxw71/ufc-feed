name: Boxing Showtimes Reach Probe
on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/probe_boxingshowtimes_reach.py'
      - '.github/workflows/boxing-boxingshowtimes-reach.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q beautifulsoup4 lxml
      - run: python boxing/research/probe_boxingshowtimes_reach.py
      - name: Persist Boxing Showtimes reach probe
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/boxingshowtimes-reach
          cp boxing/profile_supplements/boxingshowtimes_reach_probe.json /tmp/boxingshowtimes-reach/
          cp boxing/profile_supplements/boxingshowtimes_reach_additions.jsonl /tmp/boxingshowtimes-reach/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/boxingshowtimes-reach/boxingshowtimes_reach_probe.json boxing/profile_supplements/
            cp /tmp/boxingshowtimes-reach/boxingshowtimes_reach_additions.jsonl boxing/profile_supplements/
            git add boxing/profile_supplements/boxingshowtimes_reach_probe.json boxing/profile_supplements/boxingshowtimes_reach_additions.jsonl
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish Boxing Showtimes reach probe'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

