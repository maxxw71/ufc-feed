name: UFC Recent Exact-ID Backfill

on:
  workflow_dispatch:
  push:
    paths:
      - 'ufc_recent_exactid_backfill.py'
      - '.github/workflows/ufc-recent-exactid-backfill.yml'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pandas numpy
      - name: Download latest odds notebook output
        run: |
          set -e
          URL='https://www.kaggle.com/api/v1/kernels/output/download/jerzyszocik/ufc-betting-odds-daily'
          if ! curl -L --fail --retry 6 --retry-delay 3 --retry-all-errors "$URL" -o /tmp/odds.zip; then
            echo 'Notebook output endpoint failed; trying dataset endpoint...'
            curl -L --fail --retry 10 --retry-delay 3 --retry-all-errors \
              'https://www.kaggle.com/api/v1/datasets/download/binduvr/ufc-betting-odds' \
              -o /tmp/odds.zip
          fi
          python - <<'PY'
          import zipfile
          z=zipfile.ZipFile('/tmp/odds.zip')
          print('ODDS ZIP FILES',z.namelist()[:20])
          PY
      - name: Run exact-ID recent UFC backfill
        run: |
          python -m http.server 8000 --directory /tmp >/tmp/http.log 2>&1 &
          python - <<'PY'
          import ufc_recent_exactid_backfill as m
          m.ODDS_URL='http://127.0.0.1:8000/odds.zip'
          m.main()
          PY
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ufc_recent_exactid_backfill/
          git commit -m "Add exact-ID UFC recent backfill results" || exit 0
          git pull --rebase origin main || true
          git push
