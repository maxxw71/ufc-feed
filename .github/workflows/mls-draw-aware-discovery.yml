name: MLS Draw-Aware Discovery

on:
  schedule:
    - cron: '20 11 * * 1'
  push:
    branches: [main]
    paths:
      - 'scripts/mls_draw_aware_discovery.py'
      - '.github/workflows/mls-draw-aware-discovery.yml'
  workflow_dispatch:

concurrency:
  group: mls-heavy-research
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  research:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Deploy draw-aware research
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          D=/home/anestishkurti92/mls-predictor-v1
          cat scripts/mls_draw_aware_discovery.py | ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" "cat > $D/mls_draw_aware_discovery.py"

      - name: Run draw-aware discovery
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          D=/home/anestishkurti92/mls-predictor-v1
          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" 'bash -s' <<'EOF'
          set -Eeuo pipefail
          cd /home/anestishkurti92/mls-predictor-v1
          venv/bin/python -m py_compile mls_draw_aware_discovery.py
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 nice -n 12 timeout 52m venv/bin/python mls_draw_aware_discovery.py
          EOF

      - name: Pull results
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          mkdir -p mls/research
          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" 'cat /home/anestishkurti92/mls-predictor-v1/research/draw_aware/latest.json' > mls/research/draw_aware_latest.json
          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" 'cat /home/anestishkurti92/mls-predictor-v1/research/draw_aware/latest.txt' > mls/research/draw_aware_latest.txt
          cat mls/research/draw_aware_latest.txt

      - name: Persist results
        shell: bash
        run: |
          set -Eeuo pipefail
          cp mls/research/draw_aware_latest.json "$RUNNER_TEMP/draw_aware_latest.json"
          cp mls/research/draw_aware_latest.txt "$RUNNER_TEMP/draw_aware_latest.txt"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p mls/research
          cp "$RUNNER_TEMP/draw_aware_latest.json" mls/research/draw_aware_latest.json
          cp "$RUNNER_TEMP/draw_aware_latest.txt" mls/research/draw_aware_latest.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add mls/research/draw_aware_latest.json mls/research/draw_aware_latest.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Publish MLS draw-aware discovery'
            git push origin HEAD:main
          fi
