name: NBA historical officials backfill
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/officials/backfill_officials.py'
      - '.github/workflows/nba-historical-officials.yml'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nba/officials/backfill_officials.py --workers 6
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/officials/historical_game_context.csv.gz nba/officials/historical_game_officials.csv.gz nba/officials/historical_officials_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: backfill historical officials and venue context"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 4
          done
          exit 1
