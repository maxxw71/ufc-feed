name: Boxing priced career backfill

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum missing fighters to attempt this run'
        required: false
        default: '60'
  push:
    paths:
      - '.github/workflows/boxing-priced-career-backfill.yml'
      - 'boxing/research/backfill_priced_careers.py'
      - 'boxing/research/test_priced_career_backfill.py'

concurrency:
  group: boxing-priced-career-backfill
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -q beautifulsoup4 lxml python-dateutil
      - name: Test evidence gate
        working-directory: boxing/research
        run: python -m unittest test_priced_career_backfill
      - name: Download public boxing research database
        run: |
          python - <<'PY'
          import io,zipfile,urllib.request,os,shutil
          url='https://appwiza.com/sports/downloads/boxing/research-database.zip'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 AppwizaCareerBackfill/1.0'})
          with urllib.request.urlopen(req,timeout=180) as r:data=r.read()
          z=zipfile.ZipFile(io.BytesIO(data));z.extractall('/tmp/boxing-careers')
          db=next(os.path.join(root,f) for root,_,files in os.walk('/tmp/boxing-careers') for f in files if f.endswith('.sqlite3'))
          shutil.copy2(db,'boxing/research/boxing.sqlite3')
          PY
      - name: Backfill highest-value missing priced fighters
        env:
          LIMIT: ${{ inputs.limit || '60' }}
        run: |
          python boxing/research/backfill_priced_careers.py --limit "$LIMIT"
          rm -f boxing/research/boxing.sqlite3
      - name: Commit verified supplemental careers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add boxing/supplemental_careers
          if git diff --cached --quiet; then
            echo 'No new verified careers.'
          else
            git commit -m 'Add verified priced boxing career supplements'
            git pull --rebase origin main
            git push
          fi
