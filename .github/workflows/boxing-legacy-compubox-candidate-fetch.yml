name: Boxing Legacy CompuBox Candidate Fetch
on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/fetch_legacy_compubox_candidates.py'
      - 'boxing/public_punch_audit/legacy_compubox_cdx_index.json'
      - '.github/workflows/boxing-legacy-compubox-candidate-fetch.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 20
    steps:
      - name: Prepare isolated boxing scratch space
        run: mkdir -p "${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q beautifulsoup4 lxml pypdf
      - run: python boxing/research/fetch_legacy_compubox_candidates.py
      - name: Persist staged candidates
        shell: bash
        run: |
          set -Eeuo pipefail
          cp boxing/public_punch_audit/legacy_compubox_fetched_candidates.json /tmp/legacy_compubox_fetched_candidates.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/legacy_compubox_fetched_candidates.json boxing/public_punch_audit/legacy_compubox_fetched_candidates.json
            git add boxing/public_punch_audit/legacy_compubox_fetched_candidates.json
            if git diff --cached --quiet; then
              echo 'No staged candidate changes.'
              exit 0
            fi
            git commit -m 'Stage legacy CompuBox archive candidates'
            if git push origin HEAD:main; then exit 0; fi
            echo "Push race on attempt $attempt; retrying."
            sleep $((attempt * 2))
          done
          exit 1

      - name: Remove this run temporary boxing files
        if: always()
        run: rm -rf -- "${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}"
