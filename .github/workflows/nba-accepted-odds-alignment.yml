name: NBA Accepted Odds Alignment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nba/data/**/regular_season/games.csv.gz"
      - "nba/market/historical/**/odds.csv.gz"
      - "nba/market/filter_odds_to_accepted_games.py"

permissions:
  contents: write

concurrency:
  group: nba-accepted-odds-alignment
  cancel-in-progress: true

jobs:
  align:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nba/market/filter_odds_to_accepted_games.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/market/historical
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: align historical odds to accepted games"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push
