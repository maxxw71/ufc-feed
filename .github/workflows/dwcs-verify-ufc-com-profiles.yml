name: DWCS Verify UFC.com Profiles
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dwcs-verify-ufc-com-profiles.yml'
      - 'dwcs/research/verify_ufc_com_profiles.py'
      - 'dwcs/research/ufc_com_search_resolved/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas requests rapidfuzz
      - name: Verify resolved official UFC.com profiles
        run: python dwcs/research/verify_ufc_com_profiles.py
      - name: Commit verification
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add dwcs/research/ufc_com_verified
          git diff --cached --quiet && exit 0
          git commit -m 'Verify official UFC.com profiles for DWCS'
          git pull --rebase origin main
          git push
