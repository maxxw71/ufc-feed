name: BoxingScene Historical Full Stats Probe

on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/probe_boxingscene_full_stats.py'
      - 'boxing/research/probe_boxingscene_full_stats_wayback.py'
      - '.github/workflows/boxing-boxingscene-full-stats-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4 lxml
      - name: Probe exact Wayback snapshots for BoxingScene full-stat targets
        run: python boxing/research/probe_boxingscene_full_stats_wayback.py

