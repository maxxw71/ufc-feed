name: BoxingScene Historical Full Stats Probe

on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/probe_boxingscene_full_stats.py'
      - 'boxing/research/probe_boxingscene_full_stats_wayback.py'
      - '.github/workflows/boxing-boxingscene-full-stats-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 15
    steps:
      - name: Prepare isolated boxing scratch space
        run: mkdir -p "${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4 lxml
      - name: Probe exact Wayback snapshots for BoxingScene full-stat targets
        run: python boxing/research/probe_boxingscene_full_stats_wayback.py

# audit-run: 2026-09-23

      - name: Remove this run temporary boxing files
        if: always()
        run: rm -rf -- "${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}"
