name: NBA official injury direct-host probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nba-official-injury-direct-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe known official NBA PDFs directly
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p nba/research/gap_audit
          OUT=nba/research/gap_audit/official_injury_direct_probe.txt
          : > "$OUT"
          for URL in             'https://ak-static.cms.nba.com/referee/injury/Injury-Report_2019-01-15_05PM.pdf'             'https://ak-static.cms.nba.com/referee/injury/Injury-Report_2021-02-15_08PM.pdf'
          do
            echo "URL=$URL" >> "$OUT"
            curl -L --connect-timeout 8 --max-time 25 -sS -D /tmp/hdr -o /tmp/injury.pdf "$URL" || true
            awk 'BEGIN{IGNORECASE=1} /^HTTP\// || /^content-type:/ || /^content-length:/' /tmp/hdr >> "$OUT" || true
            if [ -f /tmp/injury.pdf ]; then
              echo "bytes=$(wc -c < /tmp/injury.pdf)" >> "$OUT"
              printf 'magic=' >> "$OUT"; head -c 5 /tmp/injury.pdf >> "$OUT" || true; echo >> "$OUT"
            fi
            echo '---' >> "$OUT"
          done
      - name: Commit probe
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name appwiza-nba-bot
          git config user.email actions@users.noreply.github.com
          git add nba/research/gap_audit/official_injury_direct_probe.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: add direct official injury host probe"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
