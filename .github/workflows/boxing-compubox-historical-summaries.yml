name: Boxing CompuBox Historical Summary Archive

on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/collect_boxingscene_compubox_summaries.py'
      - '.github/workflows/boxing-compubox-historical-summaries.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4 lxml
      - name: Download current public boxing research DB
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/boxing-compubox-summary
          mkdir -p /tmp/boxing-compubox-summary
          python - <<'PY'
          import io,zipfile,urllib.request,os,shutil
          url='https://appwiza.com/sports/downloads/boxing/research-database.zip'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 AppwizaCompuBoxSummary/1.0'})
          with urllib.request.urlopen(req,timeout=180) as r:data=r.read()
          with zipfile.ZipFile(io.BytesIO(data)) as z:z.extractall('/tmp/boxing-compubox-summary')
          db=next(os.path.join(root,f) for root,_,files in os.walk('/tmp/boxing-compubox-summary') for f in files if f.endswith('.sqlite3'))
          shutil.copy2(db,'boxing/research/boxing.sqlite3')
          PY
      - name: Collect CompuBox-authored historical summaries
        run: python boxing/research/collect_boxingscene_compubox_summaries.py --articles 450
      - name: Remove temporary DB
        if: always()
        run: rm -f boxing/research/boxing.sqlite3
      - name: Persist summary archive on latest main
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/compubox-summary-out
          cp boxing/punch_supplements/boxingscene_compubox_summaries.jsonl /tmp/compubox-summary-out/summaries.jsonl
          cp boxing/punch_supplements/boxingscene_compubox_summary_report.json /tmp/compubox-summary-out/report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p boxing/punch_supplements
          cp /tmp/compubox-summary-out/summaries.jsonl boxing/punch_supplements/boxingscene_compubox_summaries.jsonl
          cp /tmp/compubox-summary-out/report.json boxing/punch_supplements/boxingscene_compubox_summary_report.json
          git add boxing/punch_supplements/boxingscene_compubox_summaries.jsonl boxing/punch_supplements/boxingscene_compubox_summary_report.json
          if git diff --cached --quiet; then
            echo 'No CompuBox summary changes.'
          else
            git commit -m 'Expand historical CompuBox summary archive'
            git push origin HEAD:main
          fi
