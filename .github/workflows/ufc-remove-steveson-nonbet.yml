name: Remove Steveson Non-Bet From UFC Record

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ufc-remove-steveson-nonbet.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Remove confirmed non-wager from UFC ledger
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" 'bash -s' <<'EOF'
          set -Eeuo pipefail
          export HOME=/home/anestishkurti92
          ROOT=/home/anestishkurti92/ufc-predictor-v1
          PY="$ROOT/venv/bin/python"
          DB=/home/anestishkurti92/betting-ledger/assumed_bets.sqlite3
          OUT="$ROOT/research/steveson_nonbet_removal.json"
          mkdir -p "$ROOT/research"

          "$PY" - <<'PY'
          import json, shutil, sqlite3
          from datetime import datetime, timezone
          from pathlib import Path

          dbp=Path('/home/anestishkurti92/betting-ledger/assumed_bets.sqlite3')
          out=Path('/home/anestishkurti92/ufc-predictor-v1/research/steveson_nonbet_removal.json')
          stamp=datetime.now(timezone.utc).strftime('%Y%m%d-%H%M%S')
          backup=dbp.with_name(dbp.name+'.pre-steveson-removal.'+stamp+'.bak')
          shutil.copy2(dbp,backup)

          db=sqlite3.connect(dbp)
          db.row_factory=sqlite3.Row
          tables=[r[0] for r in db.execute("select name from sqlite_master where type='table'").fetchall()]
          if 'bets' not in tables:
              raise RuntimeError('bets table missing from ledger')

          cols=[r[1] for r in db.execute('pragma table_info(bets)').fetchall()]
          rows=[dict(r) for r in db.execute("select * from bets where lower(coalesce(sport,''))='ufc'").fetchall()]
          matches=[]
          for r in rows:
              blob=json.dumps(r,default=str).lower()
              if 'steveson' in blob and 'sharaf' in blob:
                  matches.append(r)

          if not matches:
              payload={'status':'ALREADY_ABSENT','backup':str(backup),'matched_rows':0,'removed_rows':0}
              out.write_text(json.dumps(payload,indent=2,default=str))
              print(json.dumps(payload,indent=2))
              db.close()
              raise SystemExit(0)

          if len(matches)!=1:
              raise RuntimeError('Expected exactly one Steveson-Sharaf UFC wager row, found '+str(len(matches)))

          r=matches[0]
          key=r.get('key')
          if not key:
              raise RuntimeError('Matched wager has no key')
          blob=json.dumps(r,default=str).lower()
          if 'loss' not in blob:
              raise RuntimeError('Matched Steveson row is not a settled loss; refusing deletion: '+json.dumps(r,default=str))

          # Preserve a complete audit record outside the deleted bet row.
          details={
              'reason':'USER_CONFIRMED_NOT_WAGERED',
              'policy':'EXTREME_FAVORITE_PRICE_NO_BET',
              'threshold':-2000,
              'removed_bet':r,
              'removed_at':datetime.now(timezone.utc).isoformat(),
          }
          if 'audit' in tables:
              acols=[x[1] for x in db.execute('pragma table_info(audit)').fetchall()]
              vals={}
              if 'at' in acols: vals['at']=datetime.now(timezone.utc).isoformat()
              if 'bet_key' in acols: vals['bet_key']=key
              if 'action' in acols: vals['action']='user_confirmed_not_wagered_removed'
              if 'details' in acols: vals['details']=json.dumps(details,default=str)
              if vals:
                  cs=','.join(vals); qs=','.join('?' for _ in vals)
                  db.execute(f"insert into audit({cs}) values ({qs})",tuple(vals.values()))

          # Delete dependent rows only where they explicitly reference this bet key.
          dependent=[]
          for t in tables:
              if t in {'bets','audit','sqlite_sequence'}: continue
              tcols=[x[1] for x in db.execute(f'pragma table_info("{t}")').fetchall()]
              for c in ('bet_key','key'):
                  if c in tcols:
                      try:
                          n=db.execute(f'delete from "{t}" where "{c}"=?',(key,)).rowcount
                          if n: dependent.append({'table':t,'column':c,'rows':n})
                      except sqlite3.DatabaseError:
                          pass

          deleted=db.execute('delete from bets where key=?',(key,)).rowcount
          if deleted!=1:
              db.rollback()
              raise RuntimeError('Expected to delete one bet row; deleted '+str(deleted))
          db.commit()

          left=[dict(x) for x in db.execute("select * from bets where lower(coalesce(sport,''))='ufc'").fetchall()]
          if any('steveson' in json.dumps(x,default=str).lower() and 'sharaf' in json.dumps(x,default=str).lower() for x in left):
              raise RuntimeError('Steveson-Sharaf row still present after delete')

          payload={
              'status':'REMOVED',
              'removed_rows':deleted,
              'bet_key':key,
              'reason':'USER_CONFIRMED_NOT_WAGERED',
              'policy':'EXTREME_FAVORITE_PRICE_NO_BET',
              'threshold':-2000,
              'backup':str(backup),
              'dependent_rows_removed':dependent,
              'removed_bet_snapshot':r,
          }
          out.write_text(json.dumps(payload,indent=2,default=str))
          print(json.dumps(payload,indent=2,default=str))
          db.close()
          PY

          cd "$ROOT"
          "$PY" - <<'PY'
          import importlib.util,json
          from pathlib import Path
          from datetime import datetime,timezone

          spec=importlib.util.spec_from_file_location('w','ufc_email_watcher.py')
          w=importlib.util.module_from_spec(spec);spec.loader.exec_module(w)
          feed=w.fetch_feed()
          events=w.ufc_lifecycle.future_events(feed.get('events') or [])
          bundle=w.joblib.load(w.BUNDLE_PATH)
          reach=w.load_reach_index();skills=w.load_skill_index()
          preds={}
          for e in events:
              try: ed=w.pd.Timestamp(e['date']).date()
              except Exception: continue
              preds[w.event_key(e)]=[w.predict_bout(b,ed,bundle,reach,skills) for b in e.get('bouts') or []]
          w.sports_publish.publish_ufc(events,preds,w.__dict__)
          try:
              import ufc_public_page
              ufc_public_page.safe_enhance(w.sports_publish)
          except Exception as exc:
              raise RuntimeError('UFC public refresh failed: '+repr(exc))

          p=Path('/srv/appwiza-sports/state/ufc.json')
          data=json.loads(p.read_text())
          cards=data.get('cards',[])
          bad=[c for c in cards if 'steveson' in json.dumps(c).lower() and 'sharaf' in json.dumps(c).lower()]
          if bad:
              raise RuntimeError('Steveson-Sharaf still present in public UFC state: '+repr(bad))

          # Verify Sept 19 completed tracked picks are now 7-0 if present in state.
          sep=[]
          for c in cards:
              start=str(c.get('start') or '')
              if start.startswith('2026-09-19') or start.startswith('2026-09-20'):
                  if c.get('result') in {'win','loss'}:
                      sep.append(c)
          wcount=sum(c.get('result')=='win' for c in sep)
          lcount=sum(c.get('result')=='loss' for c in sep)
          print('SEP19_TRACKED_RECORD',wcount,lcount,'rows',len(sep))
          if sep and (wcount,lcount)!=(7,0):
              raise RuntimeError(f'Expected refreshed Sept 19 tracked record 7-0, got {wcount}-{lcount}')

          result=json.loads(Path('research/steveson_nonbet_removal.json').read_text())
          result['public_refresh']='PASS'
          result['sep19_tracked_wins']=wcount
          result['sep19_tracked_losses']=lcount
          Path('research/steveson_nonbet_removal.json').write_text(json.dumps(result,indent=2,default=str))
          print(json.dumps(result,indent=2,default=str))
          PY
          EOF

      - name: Publish removal audit
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          mkdir -p ufc_record_adjustments
          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST"             'cat /home/anestishkurti92/ufc-predictor-v1/research/steveson_nonbet_removal.json'             > ufc_record_adjustments/steveson_nonbet_removal.json
          cp ufc_record_adjustments/steveson_nonbet_removal.json "$RUNNER_TEMP/steveson_nonbet_removal.json"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p ufc_record_adjustments
          cp "$RUNNER_TEMP/steveson_nonbet_removal.json" ufc_record_adjustments/steveson_nonbet_removal.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ufc_record_adjustments/steveson_nonbet_removal.json
          if ! git diff --cached --quiet; then
            git commit -m 'Remove Steveson non-wager from UFC tracked record'
            git push origin HEAD:main
          fi
