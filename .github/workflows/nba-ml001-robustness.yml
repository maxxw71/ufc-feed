name: NBA ML001 Robustness Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nba/research/audit_ml001.py"
      - ".github/workflows/nba-ml001-robustness.yml"

permissions:
  contents: write

concurrency:
  group: nba-ml001-robustness
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild executable sportsbook market features
        run: python nba/build_market_features.py
      - name: Run ML001 robustness audit
        run: python nba/research/audit_ml001.py
      - name: Commit ML001 audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/research/ml001
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: add ML001 robustness audit"
          git fetch origin main
          git rebase origin/main
          git push
