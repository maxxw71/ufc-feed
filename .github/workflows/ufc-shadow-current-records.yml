name: UFC Shadow Current Records
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ufc-shadow-current-records.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: [self-hosted, appwiza]
    timeout-minutes: 10
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          K=/home/appwiza-runner/.ssh/appwiza_vps
          ssh -i "$K" -o StrictHostKeyChecking=no anestishkurti92@127.0.0.1 'python3 -' <<'PY'
#!/usr/bin/env python3
import sqlite3,json
from pathlib import Path
p=Path('/home/anestishkurti92/ufc-predictor-v1/auto_research/state/shadow_tracker.sqlite3')
c=sqlite3.connect(p);c.row_factory=sqlite3.Row
rules=[dict(r) for r in c.execute('select * from shadow_rules order by rule_id')]
picks=[dict(r) for r in c.execute('select * from shadow_picks order by event_date,first_recorded_at')]
def stats(rows):
    rows=[r for r in rows if not str(r.get('status') or '').startswith('void_')]
    d=[r for r in rows if r['status'] in ('win','loss')]
    w=sum(r['status']=='win' for r in d);l=sum(r['status']=='loss' for r in d)
    u=sum(float(r['profit_units']) for r in d if r.get('profit_units') is not None)
    n=sum(r.get('profit_units') is not None for r in d)
    return {'picks':len(rows),'settled':len(d),'wins':w,'losses':l,'win_rate':w/(w+l) if w+l else None,'roi':u/n if n else None}
out=[]
for rr in rules:
    rid=rr['rule_id']
    rows=[p for p in picks if rid in json.loads(p.get('rule_ids_json') or '[]')]
    out.append({'id':rid,'name':rr['name'],'historical':json.loads(rr['historical_json']),'prospective':stats(rows),
                'rows':[{'date':x['event_date'],'selection':x['selection'],'opponent':x['opponent'],'status':x['status']} for x in rows]})
print(json.dumps(out,indent=2))

PY
