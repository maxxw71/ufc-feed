name: Hyperliquid all-pairs RSI research

on:
  push:
    branches: [main]
    paths:
      - 'crypto/research/hyperliquid_all_pairs_rsi.py'
      - '.github/workflows/hyperliquid-all-pairs-rsi.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hyperliquid-all-pairs-rsi
  cancel-in-progress: true

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy requests
      - name: Scan Hyperliquid shard
        run: |
          python crypto/research/hyperliquid_all_pairs_rsi.py             --mode scan             --days 600             --shard-index ${{ matrix.shard }}             --shard-count 8             --sleep-seconds 4.2             --out hyperliquid_shard
      - uses: actions/upload-artifact@v4
        with:
          name: hl-shard-${{ matrix.shard }}
          path: hyperliquid_shard/
          retention-days: 2

  aggregate:
    needs: scan
    if: always() && needs.scan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy requests
      - uses: actions/download-artifact@v4
        with:
          pattern: hl-shard-*
          path: hyperliquid_shards
          merge-multiple: true
      - name: Aggregate all-pair findings
        run: |
          python crypto/research/hyperliquid_all_pairs_rsi.py             --mode aggregate             --input-dir hyperliquid_shards             --out crypto/research/results_hyperliquid_all_pairs
      - name: Commit research outputs
        run: |
          git config user.name "appwiza-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crypto/research/results_hyperliquid_all_pairs
          if ! git diff --cached --quiet; then
            git commit -m "Update Hyperliquid all-pair RSI research"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
