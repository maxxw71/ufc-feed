name: Hyperliquid deep validation

on:
  push:
    branches: [main]
    paths:
      - 'crypto/research/hyperliquid_deep_validation.py'
      - '.github/workflows/hyperliquid-deep-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy
      - run: python crypto/research/hyperliquid_deep_validation.py
      - name: Commit outputs
        run: |
          git config user.name "appwiza-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crypto/research/results_hyperliquid_deep_validation
          if ! git diff --cached --quiet; then
            git commit -m "Update Hyperliquid deep validation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
