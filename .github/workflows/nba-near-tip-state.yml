name: NBA Near Tip State
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/prospective/capture_game_state.py'
      - '.github/workflows/nba-near-tip-state.yml'
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: write

concurrency:
  group: nba-prospective-game-state
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade requests
      - run: python nba/prospective/capture_game_state.py --near-tip-only --near-tip-hours 2
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name appwiza-nba-bot
          git config user.email actions@users.noreply.github.com
          git add nba/prospective
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: capture near-tip state"
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
