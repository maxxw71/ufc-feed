name: Boxing data gap audit

on:
  push:
    paths:
      - '.github/workflows/boxing-data-gap-audit.yml'
      - 'boxing/research/data_gap_audit.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boxing-data-gap-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download public boxing research database
        run: |
          python - <<'PY'
          import io,zipfile,urllib.request,os,shutil
          url='https://appwiza.com/sports/downloads/boxing/research-database.zip'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 AppwizaDataGap/1.0'})
          with urllib.request.urlopen(req,timeout=180) as r:data=r.read()
          z=zipfile.ZipFile(io.BytesIO(data));z.extractall('/tmp/boxing-gap')
          db=next(os.path.join(root,f) for root,_,files in os.walk('/tmp/boxing-gap') for f in files if f.endswith('.sqlite3'))
          shutil.copy2(db,'boxing/research/boxing.sqlite3')
          PY
      - name: Run data gap audit
        run: |
          cd boxing/research
          python data_gap_audit.py
          mv DATA_GAP_AUDIT.json ../public_reports/DATA_GAP_AUDIT.json
          rm -f boxing.sqlite3
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add boxing/public_reports/DATA_GAP_AUDIT.json
          if git diff --cached --quiet; then
            echo 'No data-gap changes.'
          else
            git commit -m 'Update boxing data gap audit'
            git pull --rebase origin main
            git push
          fi
