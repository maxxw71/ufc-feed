name: NBA ML001 Descendant Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nba/research/audit_ml001_descendants.py"
      - ".github/workflows/nba-ml001-descendants.yml"

permissions:
  contents: write

concurrency:
  group: nba-ml001-descendants
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nba/build_market_features.py
      - run: python nba/research/audit_ml001_descendants.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/research/ml001/ml001_descendant_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: audit ML001 descendant filters"
          git fetch origin main
          git rebase origin/main
          git push
