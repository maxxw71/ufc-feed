name: NBA coach shock discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/build_coach_event_pregame.py'
      - 'nba/research/discover_coach_shock.py'
      - '.github/workflows/nba-coach-shock-discovery.yml'
permissions:
  contents: write
jobs:
  discover:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python nba/build_coach_event_pregame.py
      - run: python nba/research/discover_coach_shock.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name appwiza-nba-bot
          git config user.email actions@users.noreply.github.com
          git add nba/features/coach_event_pregame.csv.gz nba/features/coach_event_pregame_summary.json nba/research/coach_shock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: add coach shock discovery results"
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
