name: NBA Elite Method Search

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nba/research/discover_elite.py"
      - ".github/workflows/nba-elite-method-search.yml"

permissions:
  contents: write

concurrency:
  group: nba-elite-method-search
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nba/build_market_features.py
      - run: python nba/research/discover_elite.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/research/elite
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: add high-probability high-ROI elite method search"
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
