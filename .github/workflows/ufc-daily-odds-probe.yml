name: UFC Daily Odds Probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'ufc_daily_odds_probe.py'
      - '.github/workflows/ufc-daily-odds-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pandas
      - run: python ufc_daily_odds_probe.py
