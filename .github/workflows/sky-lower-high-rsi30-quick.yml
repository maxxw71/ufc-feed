name: SKY lower-high RSI30 quick case

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sky-lower-high-rsi30-quick.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy requests
      - run: |
          python crypto/research/lower_high_rsi30_binance.py             --symbols 1             --days 900
      - name: Commit outputs
        run: |
          git config user.name "appwiza-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crypto/research/results_lower_high_rsi30_binance
          if ! git diff --cached --quiet; then
            git commit -m "Update SKY lower-high RSI30 quick case"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
