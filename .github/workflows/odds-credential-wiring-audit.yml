name: Odds Credential Wiring Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/odds-credential-wiring-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect variable names only
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" 'bash -s' <<'EOF'
          set -Eeuo pipefail
          echo '=== UFC WATCHER ODDS REFERENCES ==='
          grep -nEi 'odds.?api|api.?key|the-odds|api.the-odds|ipv6-api' /home/anestishkurti92/ufc-predictor-v1/ufc_email_watcher.py | head -120 || true
          echo '=== NFL ODDS REFERENCES ==='
          grep -RniEi 'odds.?api|api.?key|the-odds|api.the-odds|ipv6-api' /home/anestishkurti92/nfl-predictor-v1/research_v2 /home/anestishkurti92/nfl-predictor-v1/*.py 2>/dev/null | head -160 || true
          echo '=== ENV NAMES ONLY ==='
          for p in /home/anestishkurti92/.config/ufc-watcher.env /home/anestishkurti92/.config/*nfl*.env /home/anestishkurti92/.env; do
            [ -f "$p" ] || continue
            echo FILE="$p"
            sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' "$p"
          done
          EOF
