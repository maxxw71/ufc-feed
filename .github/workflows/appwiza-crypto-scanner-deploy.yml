name: Appwiza crypto scanner deploy

on:
  push:
    branches: [main]
    paths:
      - 'crypto/crypto_press_scanner.py'
      - '.github/workflows/appwiza-crypto-scanner-deploy.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Deploy scanner over existing Appwiza SSH path
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          REMOTE=/home/anestishkurti92/crypto-press-scanner

          scp -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new             crypto/crypto_press_scanner.py "$HOST:/home/anestishkurti92/crypto_press_scanner.deploy.py"

          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" 'bash -s' <<'EOF' | tee crypto/press_scanner_deploy_report.txt
          set -Eeuo pipefail
          ROOT=/home/anestishkurti92/crypto-press-scanner
          PY=/home/anestishkurti92/ufc-predictor-v1/venv/bin/python
          mkdir -p "$ROOT"
          install -m 755 /home/anestishkurti92/crypto_press_scanner.deploy.py "$ROOT/crypto_press_scanner.py"
          rm -f /home/anestishkurti92/crypto_press_scanner.deploy.py
          "$PY" -m py_compile "$ROOT/crypto_press_scanner.py"

          # Prime current archive links without sending a backlog.
          "$PY" "$ROOT/crypto_press_scanner.py" prime

          # Use the live UFC/Appwiza send_email(subject, body) interface for one end-to-end test.
          "$PY" "$ROOT/crypto_press_scanner.py" test-quant

          # Install an isolated hourly user cron. Keep sports jobs untouched.
          TMP=$(mktemp)
          crontab -l 2>/dev/null | grep -v '/crypto-press-scanner/crypto_press_scanner.py' > "$TMP" || true
          echo 'CRON_TZ=America/New_York' >> "$TMP"
          echo '7 9,21 * * * cd /home/anestishkurti92/crypto-press-scanner && /home/anestishkurti92/ufc-predictor-v1/venv/bin/python /home/anestishkurti92/crypto-press-scanner/crypto_press_scanner.py run >> /home/anestishkurti92/crypto-press-scanner/scanner.log 2>&1' >> "$TMP"
          crontab "$TMP"
          rm -f "$TMP"

          echo 'APPWIZA CRYPTO PRESS SCANNER DEPLOY'
          date -u
          echo 'compile=ok'
          echo 'prime=ok'
          echo 'test_email=attempted_via_live_appwiza_send_email'
          echo '--- cron ---'
          crontab -l | grep -E 'CRON_TZ|crypto-press-scanner/crypto_press_scanner.py'
          echo '--- files ---'
          ls -l "$ROOT/crypto_press_scanner.py" "$ROOT/seen.json"
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crypto/press_scanner_deploy_report.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record live crypto scanner deployment'
            git push
          fi
