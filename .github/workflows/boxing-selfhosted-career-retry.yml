name: Boxing self-hosted career retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boxing-selfhosted-career-retry.yml'
      - 'boxing/research/retry_failed_secondary_careers.py'
      - 'boxing/research/backfill_secondary_careers.py'
  workflow_dispatch:

concurrency:
  group: boxing-selfhosted-career-retry
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  retry:
    if: github.repository == 'maxxw71/ufc-feed' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retry only failed strict career supplements
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 boxing/research/retry_failed_secondary_careers.py --limit 50
      - name: Persist recovered careers
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add boxing/supplemental_careers/verified_priced_careers.jsonl boxing/supplemental_careers/selfhosted_retry_report.json
          if git diff --cached --quiet; then
            echo 'No secondary career recovery changes.'
          else
            git commit -m 'Recover failed boxing careers via self-hosted network'
            git pull --rebase origin main
            git push
          fi
