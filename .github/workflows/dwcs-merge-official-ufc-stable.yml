name: DWCS Merge Official UFC Stable Features
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dwcs-merge-official-ufc-stable.yml'
      - 'dwcs/research/merge_official_ufc_stable_features.py'
      - 'dwcs/research/ufc_com_search_resolved/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas numpy
      - name: Merge historical-safe official UFC fields
        run: python dwcs/research/merge_official_ufc_stable_features.py
      - name: Commit results
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add dwcs/research/official_ufc_merged
          git diff --cached --quiet && exit 0
          git commit -m 'Merge historical-safe official UFC features into DWCS'
          git pull --rebase origin main
          git push
