name: DWCS UFC.com Search Resolver
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dwcs-ufc-com-search-resolver.yml'
      - 'dwcs/research/resolve_ufc_com_profiles_via_search.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas requests rapidfuzz
      - name: Resolve DWCS fighters via official UFC.com search
        run: python dwcs/research/resolve_ufc_com_profiles_via_search.py
      - name: Commit results
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add dwcs/research/ufc_com_search_resolved
          git diff --cached --quiet && exit 0
          git commit -m 'Expand UFC.com profile coverage via official athlete search'
          git pull --rebase origin main
          git push
