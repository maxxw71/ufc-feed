name: Appwiza live inspect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/appwiza-live-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'maxxw71/ufc-feed' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect UFC publisher
        shell: bash
        run: |
          set -u
          echo '=== initial_ufc.py ==='
          sed -n '1,260p' /opt/sports-publisher/initial_ufc.py 2>/dev/null || true
          echo '=== sports_publish.py relevant symbols ==='
          grep -nE 'ufc|method|striking|publish|PUBLIC|render|watcher' /opt/sports-publisher/sports_publish.py 2>/dev/null | head -240 || true
          echo '=== ufc_lifecycle.py ==='
          sed -n '1,320p' /opt/sports-publisher/ufc_lifecycle.py 2>/dev/null || true
          echo '=== publisher ownership ==='
          ls -la /opt/sports-publisher || true
