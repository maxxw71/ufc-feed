name: Appwiza live inspect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/appwiza-live-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'maxxw71/ufc-feed' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect UFC page inputs
        shell: bash
        run: |
          set -u
          echo '=== UFC PUBLIC FILES ==='
          find /srv/appwiza-sports/public/ufc -maxdepth 2 -type f -printf '%p %s bytes\n' 2>/dev/null | sort | head -120 || true
          echo
          echo '=== UFC STATE FILES ==='
          find /srv/appwiza-sports/state -maxdepth 2 -type f -printf '%p %s bytes\n' 2>/dev/null | sort | head -120 || true
          echo
          echo '=== UFC PROJECT FILES ==='
          find /home/anestishkurti92/ufc-predictor-v1 -maxdepth 3 -type f -print 2>/dev/null | sort | head -240 || true
          echo
          echo '=== PAGE SOURCE MATCHES ==='
          grep -RnilF 'UFC qualifying matchups' /home/anestishkurti92/ufc-predictor-v1 2>/dev/null | head -50 || true
          grep -RnilF 'Upcoming selections' /home/anestishkurti92/ufc-predictor-v1 2>/dev/null | head -50 || true
          echo
          echo '=== CURRENT UFC HTML HEAD ==='
          sed -n '1,300p' /srv/appwiza-sports/public/ufc/index.html 2>/dev/null || true
