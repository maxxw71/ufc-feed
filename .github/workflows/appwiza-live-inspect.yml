name: Appwiza live inspect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/appwiza-live-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'maxxw71/ufc-feed' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect boxing archive runtime
        shell: bash
        run: |
          set -u
          echo '=== BOXING SERVICE ==='
          systemctl cat boxing-archive.service 2>/dev/null || true
          echo
          echo '=== BOXING PROCESS ==='
          ps -ef | grep -Ei '[b]oxing|[d]rain_archive|[p]unch_collect' || true
          echo
          echo '=== KNOWN BOXING RUNTIME TREES ==='
          find /opt/appwiza-sports-imports/google-ufc-model-20260913/home/boxing-research -maxdepth 3 -type f 2>/dev/null | head -120 || true
          echo
          echo '=== OWNERSHIP ==='
          for p in /opt/appwiza-sports-imports/google-ufc-model-20260913/home/boxing-research /opt/sports-runtime-manifests/boxing-before-priority /srv/appwiza-sports/public/boxing; do
            [ -e "$p" ] && ls -ld "$p" || true
          done
          echo
          echo '=== DATABASES UNDER BOXING TREE ==='
          find /opt/appwiza-sports-imports/google-ufc-model-20260913/home/boxing-research -maxdepth 4 -type f \( -name '*.sqlite3' -o -name '*.db' \) -exec ls -lh {} \; 2>/dev/null || true
