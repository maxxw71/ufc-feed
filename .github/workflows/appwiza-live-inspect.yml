name: Appwiza live inspect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/appwiza-live-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'maxxw71/ufc-feed' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Locate UFC helper modules and boxing archive hooks
        shell: bash
        run: |
          set -u
          echo '=== BET TRACKER LOCATIONS ==='
          find /opt /home/anestishkurti92 -type f \( -name 'bet_tracker.py' -o -name 'ufc_email_design.py' -o -name 'ufc_lifecycle.py' \) -print 2>/dev/null | head -100 || true
          echo
          echo '=== UFC WATCHER IMPORTS ==='
          grep -n '^import\|^from' /home/anestishkurti92/ufc-predictor-v1/ufc_email_watcher.py 2>/dev/null | head -100 || true
          echo
          echo '=== UFC SERVICE ENV ==='
          systemctl cat ufc-model-watcher.service 2>/dev/null || true
          echo
          echo '=== BOXING DRAIN SCRIPT ==='
          sed -n '1,260p' /home/anestishkurti92/boxing-research/drain_archive.sh 2>/dev/null || true
          echo
          echo '=== BOXING ARCHIVE CURRENT PUNCH REFERENCES ==='
          grep -nE 'punch_collect|historical_punch|CompuBox|round' /home/anestishkurti92/boxing-research/drain_archive.sh /home/anestishkurti92/boxing-research/*.py 2>/dev/null | head -220 || true
