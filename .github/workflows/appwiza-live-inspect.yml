name: Appwiza live inspect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/appwiza-live-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'maxxw71/ufc-feed' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check controlled deploy prerequisites
        shell: bash
        run: |
          set -u
          echo '=== ACL TOOLS ==='
          command -v setfacl || true
          command -v getfacl || true
          echo '=== RUNNER ==='
          id || true
          echo '=== PATHS ==='
          namei -l /home/anestishkurti92/ufc-predictor-v1/ufc_email_watcher.py || true
          namei -l /srv/appwiza-sports/public/ufc/index.html || true
          namei -l /opt/sports-publisher/sports_publish.py || true
          echo '=== SUDO RULES ==='
          sudo -n -l 2>&1 || true
