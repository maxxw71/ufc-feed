name: Appwiza live inspect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/appwiza-live-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'maxxw71/ufc-feed' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect UFC publisher and current dashboard inputs
        shell: bash
        run: |
          set -u
          echo '=== UFC PUBLIC FILES ==='
          find /srv/appwiza-sports/public/ufc -maxdepth 2 -type f -printf '%p %s bytes\n' 2>/dev/null | sort | head -120 || true
          echo
          echo '=== UFC STATE FILES ==='
          find /srv/appwiza-sports/state -maxdepth 2 -type f -printf '%p %s bytes\n' 2>/dev/null | sort | head -120 || true
          echo
          echo '=== PUBLISHER CANDIDATES ==='
          find /opt /home/anestishkurti92 -type f \( -iname '*sports*publish*' -o -iname '*public*page*' -o -iname '*ufc*publish*' -o -iname '*ufc*page*' \) -print 2>/dev/null | head -160 || true
          echo
          echo '=== UFC PAGE TITLE SOURCE MATCHES ==='
          grep -RnilF 'UFC qualifying matchups' /opt /home/anestishkurti92 2>/dev/null | head -50 || true
          echo
          echo '=== UFC UPCOMING SECTION SOURCE MATCHES ==='
          grep -RnilF 'Upcoming selections' /opt /home/anestishkurti92 2>/dev/null | head -50 || true
          echo
          echo '=== CURRENT UFC HTML HEAD/SECTIONS ==='
          sed -n '1,260p' /srv/appwiza-sports/public/ufc/index.html 2>/dev/null || true
          echo
          echo '=== UFC JSON STATE PREVIEW ==='
          for f in /srv/appwiza-sports/state/ufc*.json /srv/appwiza-sports/state/*ufc*.json; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            python3 - "$f" <<'PY'
import json,sys
p=sys.argv[1]
try:
 d=json.load(open(p))
 print(json.dumps(d,indent=2)[:20000])
except Exception as e: print(e)
PY
          done
