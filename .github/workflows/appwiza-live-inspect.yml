name: Appwiza live inspect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/appwiza-live-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'maxxw71/ufc-feed' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect UFC publisher implementation
        shell: bash
        run: |
          set -u
          P=/opt/sports-publisher/sports_publish.py
          echo '=== FUNCTION INDEX ==='
          grep -nE '^def (publish_ufc|ufc_record_html|card_html|downloads_html|safe_call)' "$P" || true
          echo
          echo '=== UFC PUBLISH BLOCK ==='
          line=$(grep -n '^def publish_ufc' "$P" | head -1 | cut -d: -f1)
          if [ -n "$line" ]; then start=$((line-20)); [ "$start" -lt 1 ] && start=1; end=$((line+220)); sed -n "${start},${end}p" "$P"; fi
          echo
          echo '=== UFC RECORD BLOCK ==='
          line=$(grep -n '^def ufc_record_html' "$P" | head -1 | cut -d: -f1)
          if [ -n "$line" ]; then start=$((line-20)); [ "$start" -lt 1 ] && start=1; end=$((line+180)); sed -n "${start},${end}p" "$P"; fi
