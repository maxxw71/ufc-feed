name: Appwiza live inspect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/appwiza-live-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'maxxw71/ufc-feed' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect UFC publisher hooks
        shell: bash
        run: |
          set -u
          echo '=== WATCHER SPORTS PUBLISH CONTEXT ==='
          grep -n -B8 -A14 -E 'sports_publish|publish_ufc|bet_tracker|ufc_picks' /home/anestishkurti92/ufc-predictor-v1/ufc_email_watcher.py 2>/dev/null | head -500 || true
          echo
          echo '=== PUBLISH MODULE LOCATIONS ==='
          find /home/anestishkurti92 /opt -type f -name 'sports_publish.py' -print 2>/dev/null | head -30 || true
          echo
          echo '=== TRACKER CANDIDATE HEAD ==='
          sed -n '1,260p' /home/anestishkurti92/ufc-predictor-v1/ufc_tracker_candidate.py 2>/dev/null || true
