name: Appwiza live inspect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/appwiza-live-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'maxxw71/ufc-feed' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect missing UFC helpers and live usages
        shell: bash
        run: |
          set -u
          echo '=== FILE NAMES MATCHING HELPERS ==='
          find /opt /home/anestishkurti92 -type f \( -iname '*bet*tracker*' -o -iname '*ufc*email*design*' -o -iname '*sports*publish*' \) -print 2>/dev/null | head -200 || true
          echo
          echo '=== CONTENT DEFINITIONS / USAGES ==='
          grep -RniE 'def ufc_picks|def method_cards|class .*Tracker|bet_tracker\.|ufc_email_design\.' /opt /home/anestishkurti92 2>/dev/null | head -260 || true
          echo
          echo '=== WATCHER BET TRACKER CONTEXT ==='
          grep -n -B4 -A8 -E 'bet_tracker\.|ufc_email_design\.' /home/anestishkurti92/ufc-predictor-v1/ufc_email_watcher.py 2>/dev/null | head -260 || true
          echo
          echo '=== WATCHER BACKUPS ==='
          ls -lt /home/anestishkurti92/ufc-predictor-v1/ufc_email_watcher.py* 2>/dev/null | head -30 || true
          echo
          echo '=== CURRENT LIVE PAGE TOKENS ==='
          grep -oE 'Striking \+ TD Defense[^<]*|40 / 40|94\.4%|17\.64%|23\.08%' /srv/appwiza-sports/public/ufc/index.html 2>/dev/null | sort | uniq -c || true
