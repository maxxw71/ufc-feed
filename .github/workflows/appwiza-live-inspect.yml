name: Appwiza live inspect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/appwiza-live-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect UFC public permissions
        shell: bash
        run: |
          set -u
          id
          stat -c '%A %a %U:%G %n' /opt/sports-publisher /opt/sports-publisher/sports_publish.py /srv/appwiza-sports/public /srv/appwiza-sports/public/ufc /srv/appwiza-sports/public/ufc/index.html /srv/appwiza-sports/state /srv/appwiza-sports/state/ufc.json 2>/dev/null || true
          test -w /srv/appwiza-sports/public/ufc/index.html && echo UFC_HTML_WRITABLE=yes || echo UFC_HTML_WRITABLE=no
          test -w /srv/appwiza-sports/public/ufc && echo UFC_DIR_WRITABLE=yes || echo UFC_DIR_WRITABLE=no
          test -w /srv/appwiza-sports/public/style.css && echo CSS_WRITABLE=yes || echo CSS_WRITABLE=no
