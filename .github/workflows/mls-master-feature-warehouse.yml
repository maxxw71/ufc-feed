name: MLS Master Feature Warehouse

on:
  push:
    branches: [main]
    paths:
      - 'scripts/mls_master_feature_merge.py'
      - 'mls/features/**'
      - '.github/workflows/mls-master-feature-warehouse.yml'
  workflow_dispatch:

concurrency:
  group: mls-master-warehouse
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  merge:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Build canonical MLS master warehouse
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          D=/home/anestishkurti92/mls-predictor-v1
          cat scripts/mls_master_feature_merge.py | ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" "cat > $D/mls_master_feature_merge.py"
          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" "cd $D && venv/bin/python -m py_compile mls_master_feature_merge.py && timeout 10m venv/bin/python mls_master_feature_merge.py"
      - name: Pull master audit
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          mkdir -p mls/features
          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" 'cat /home/anestishkurti92/mls-predictor-v1/reports/master_feature_meta.json' > mls/features/master_feature_meta.json
      - name: Persist master audit
        shell: bash
        run: |
          set -Eeuo pipefail
          cp mls/features/master_feature_meta.json "$RUNNER_TEMP/master_meta.json"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p mls/features
          cp "$RUNNER_TEMP/master_meta.json" mls/features/master_feature_meta.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add mls/features/master_feature_meta.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish MLS master warehouse audit'
            git push origin HEAD:main
          fi
