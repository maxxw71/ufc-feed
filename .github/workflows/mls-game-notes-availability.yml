name: MLS Sparse Game Notes Availability

on:
  push:
    branches: [main]
    paths:
      - 'scripts/mls_game_notes_availability.py'
      - 'mls/sources/game_notes_availability_manifest.json'
      - '.github/workflows/mls-game-notes-availability.yml'
  workflow_dispatch:

concurrency:
  group: mls-research
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Parse verified game-note availability
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          SSH="ssh -i $KEY -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new $HOST"
          D=/home/anestishkurti92/mls-predictor-v1
          $SSH "cd $D && venv/bin/pip install --quiet pypdf"
          cat scripts/mls_game_notes_availability.py | $SSH "cat > $D/mls_game_notes_availability.py"
          cat mls/sources/game_notes_availability_manifest.json | $SSH "cat > $D/game_notes_availability_manifest.json"
          $SSH "cd $D && venv/bin/python -m py_compile mls_game_notes_availability.py && timeout 12m venv/bin/python mls_game_notes_availability.py"
      - name: Pull audit
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          mkdir -p mls/features
          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" 'cat /home/anestishkurti92/mls-predictor-v1/reports/game_notes_availability_meta.json' > mls/features/game_notes_availability_meta.json
      - name: Persist audit
        shell: bash
        run: |
          set -Eeuo pipefail
          cp mls/features/game_notes_availability_meta.json "$RUNNER_TEMP/game_notes_meta.json"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p mls/features
          cp "$RUNNER_TEMP/game_notes_meta.json" mls/features/game_notes_availability_meta.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add mls/features/game_notes_availability_meta.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish MLS sparse game-note availability audit'
            git push origin HEAD:main
          fi
