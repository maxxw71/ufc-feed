name: NBA market microstructure discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/research/discover_market_micro.py'
      - '.github/workflows/nba-market-micro-discovery.yml'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nba/research/discover_market_micro.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/research/market_micro
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: add market microstructure discovery results"
          git pull --rebase origin main
          git push
