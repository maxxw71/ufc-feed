name: NFL early-season context validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/nfl_early_season_context_validation.py'
      - '.github/workflows/nfl-early-season-context-validation.yml'

permissions:
  contents: read

concurrency:
  group: nfl-early-season-context-validation
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'maxxw71/ufc-feed' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate early-season context risk factors
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT=/home/anestishkurti92/nfl-predictor-v1
          CTX=/home/appwiza-runner/nfl-context-data
          test -f "$CTX/derived/team_game_pregame_context_2006_2026.parquet"
          NFL_SOURCE_ROOT="$ROOT" NFL_CONTEXT_ROOT="$CTX" "$ROOT/venv/bin/python" "$GITHUB_WORKSPACE/scripts/nfl_early_season_context_validation.py"
          echo '=== RISK COMPARISON ==='
          cat "$CTX/validation/early_season_risk_comparison.csv"
