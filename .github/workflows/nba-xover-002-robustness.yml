name: NBA XOVER 002 robustness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/research/audit_xover_002.py'
      - '.github/workflows/nba-xover-002-robustness.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python nba/research/audit_xover_002.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name appwiza-nba-bot
          git config user.email actions@users.noreply.github.com
          git add nba/research/cross_family/xover_002_robustness.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: add XOVER 002 robustness results"
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
