name: NBA Scheduler Capability Check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nba-scheduler-capability-check.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          mkdir -p diagnostics
          {
            echo '=== RUNNER GH ==='
            command -v gh || true
            gh --version 2>/dev/null | head -2 || true
            gh auth status -h github.com 2>&1 | sed -E 's/(token: ).*/\1[redacted]/' || true
            echo '=== SERVER GH ==='
            ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" 'command -v gh || true; gh --version 2>/dev/null | head -2 || true; gh auth status -h github.com 2>&1 | sed -E "s/(token: ).*/\1[redacted]/" || true'
          } > diagnostics/nba_scheduler_capability.txt
          git config user.name appwiza-nba-bot
          git config user.email actions@users.noreply.github.com
          git add diagnostics/nba_scheduler_capability.txt
          git commit -m 'diagnostics: inspect NBA scheduler gh capability' || exit 0
          git pull --rebase origin main
          git push
