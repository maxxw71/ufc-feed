name: UFC Age Reach Overlap

on:
  workflow_dispatch:
  push:
    paths:
      - 'ufc_age_reach_overlap.py'
      - '.github/workflows/ufc-age-reach-overlap.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pandas numpy
      - name: Download odds dataset
        run: |
          set -e
          URL='https://www.kaggle.com/api/v1/kernels/output/download/jerzyszocik/ufc-betting-odds-daily'
          if ! curl -L --fail --retry 6 --retry-delay 3 --retry-all-errors "$URL" -o /tmp/odds.zip; then
            curl -L --fail --retry 10 --retry-delay 3 --retry-all-errors 'https://www.kaggle.com/api/v1/datasets/download/binduvr/ufc-betting-odds' -o /tmp/odds.zip
          fi
      - name: Run overlap backtest
        run: python ufc_age_reach_overlap.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ufc_age_reach_overlap/
          git commit -m "Add age reach overlap backtest results" || exit 0
          git pull --rebase origin main || true
          git push
