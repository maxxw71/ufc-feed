name: Lower-high RSI deep filter search

on:
  push:
    branches: [main]
    paths:
      - 'crypto/research/lower_high_rsi30_filter_search.py'
      - '.github/workflows/lower-high-rsi30-filter-search.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy
      - run: python crypto/research/lower_high_rsi30_filter_search.py
      - name: Commit outputs
        run: |
          git config user.name "appwiza-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crypto/research/results_lower_high_rsi30_filtered
          if ! git diff --cached --quiet; then
            git commit -m "Update lower-high RSI deep filter search"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
