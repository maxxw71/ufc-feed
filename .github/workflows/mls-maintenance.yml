name: MLS maintenance bridge

on:
  pull_request:
    paths:
      - ".github/workflows/mls-maintenance.yml"
      - ".github/mls-probe.txt"
  workflow_dispatch:

jobs:
  audit-relay-sources:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test Jina relay for ESPN historical lineup data
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          SSH="ssh -i $KEY -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new $HOST"
          $SSH 'set -Eeuo pipefail; python3 - <<'"'"'PY'"'"'
          import urllib.request
          UA={"User-Agent":"Mozilla/5.0 AppwizaMLSSourceAudit/1.1","Accept":"text/plain"}
          urls=[
            "https://r.jina.ai/http://site.api.espn.com/apis/site/v2/sports/soccer/usa.1/scoreboard?dates=20230422%26limit=100",
            "https://r.jina.ai/https://site.api.espn.com/apis/site/v2/sports/soccer/usa.1/scoreboard?dates=20230422%26limit=100",
          ]
          for url in urls:
              print("\nTRY",url)
              try:
                  req=urllib.request.Request(url,headers=UA)
                  body=urllib.request.urlopen(req,timeout=60).read().decode("utf-8","replace")
                  print("bytes",len(body),"prefix",body[:10000])
              except Exception as e:
                  print("ERR",type(e).__name__,str(e)[:500])
          PY'
