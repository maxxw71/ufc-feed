name: MLS maintenance bridge

on:
  pull_request:
    paths:
      - ".github/workflows/mls-maintenance.yml"
      - ".github/mls-probe.txt"
  workflow_dispatch:

jobs:
  audit-history-sources:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Test Wayback availability history and ESPN lineup incidents
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          SSH="ssh -i $KEY -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new $HOST"
          $SSH 'set -Eeuo pipefail; cd /home/anestishkurti92/mls-predictor-v1; venv/bin/python - <<'"'"'PY'"'"'
          import json,urllib.parse,urllib.request
          UA={"User-Agent":"Mozilla/5.0 AppwizaMLSSourceAudit/1.0"}

          def get(url,timeout=45):
              req=urllib.request.Request(url,headers=UA)
              return urllib.request.urlopen(req,timeout=timeout).read()

          print("== WAYBACK CDX ==")
          target="https://www.mlssoccer.com/news/mlssoccer-com-injury-report"
          q={
            "url":target,"from":"2022","to":"2023","output":"json",
            "filter":["statuscode:200","mimetype:text/html"],"collapse":"digest","fl":"timestamp,original,statuscode,digest"
          }
          params=[]
          for k,v in q.items():
              if isinstance(v,list):
                  for x in v:params.append((k,x))
              else:params.append((k,v))
          cdx="https://web.archive.org/cdx/search/cdx?"+urllib.parse.urlencode(params)
          try:
              raw=get(cdx,60).decode("utf-8","replace")
              data=json.loads(raw)
              rows=data[1:] if isinstance(data,list) and data else []
              print("wayback_rows",len(rows))
              print("wayback_first",rows[:5])
              print("wayback_last",rows[-5:])
              for row in rows[:3]+rows[-3:]:
                  ts=row[0]
                  u=f"https://web.archive.org/web/{ts}id_/{target}"
                  try:
                      body=get(u,60).decode("utf-8","replace")
                      print("SNAP",ts,"bytes",len(body),"matchday_mentions",body.lower().count("matchday"),"out_mentions",body.lower().count("out:"))
                  except Exception as e:
                      print("SNAP_ERR",ts,type(e).__name__,str(e)[:200])
          except Exception as e:
              print("WAYBACK_ERR",type(e).__name__,str(e)[:500])

          print("\n== ESPN 2023 SCOREBOARD ==")
          score="https://site.api.espn.com/apis/site/v2/sports/soccer/usa.1/scoreboard?dates=20230422&limit=100"
          try:
              s=json.loads(get(score,45))
              events=s.get("events") or []
              print("espn_events",len(events))
              for ev in events:
                  comp=(ev.get("competitions") or [{}])[0]
                  teams=[c.get("team",{}).get("displayName") for c in comp.get("competitors") or []]
                  print("EVENT",ev.get("id"),ev.get("date"),teams)
              event=next((ev for ev in events if any("New England" in str(c.get("team",{}).get("displayName","")) for c in (ev.get("competitions") or [{}])[0].get("competitors",[]))),events[0] if events else None)
              if event:
                  eid=event["id"];summary=f"https://site.api.espn.com/apis/site/v2/sports/soccer/usa.1/summary?event={eid}"
                  z=json.loads(get(summary,45))
                  print("SUMMARY_EVENT",eid,"keys",list(z.keys()))
                  for key in ["rosters","boxscore","plays","commentary","header","gameInfo"]:
                      val=z.get(key)
                      print("SUMMARY_KEY",key,"type",type(val).__name__,"preview",json.dumps(val,default=str)[:8000])
          except Exception as e:
              print("ESPN_ERR",type(e).__name__,str(e)[:500])
          PY'
