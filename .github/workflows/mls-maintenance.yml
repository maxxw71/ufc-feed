name: MLS maintenance bridge

on:
  pull_request:
    paths:
      - ".github/workflows/mls-maintenance.yml"
      - ".github/mls-probe.txt"
  workflow_dispatch:

jobs:
  inspect-mls-sitemaps:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Inspect MLS sitemap and player-status URL discovery
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          SSH="ssh -i $KEY -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new $HOST"
          $SSH 'set -Eeuo pipefail; cd /home/anestishkurti92/mls-predictor-v1; venv/bin/python - <<'"'"'PY'"'"'
          import re, urllib.request, xml.etree.ElementTree as ET
          from urllib.parse import urlparse
          UA="Mozilla/5.0 AppwizaMLSStatusDiscovery/1.0"

          urls=[
            "https://www.mlssoccer.com/sitemap.xml",
            "https://www.mlssoccer.com/sitemap-index.xml",
            "https://www.mlssoccer.com/sitemap_index.xml",
            "https://www.mlssoccer.com/news-sitemap.xml",
          ]
          for url in urls:
              print("\nTRY",url)
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":UA})
                  raw=urllib.request.urlopen(req,timeout=30).read()
                  print("bytes",len(raw),"prefix",raw[:180])
                  txt=raw.decode("utf-8","replace")
                  locs=re.findall(r"<loc>\s*(.*?)\s*</loc>",txt,re.I)
                  print("loc_count",len(locs))
                  matches=[x for x in locs if "player-status-report" in x.lower() or "injury-report" in x.lower()]
                  print("direct_status_matches",len(matches))
                  for x in matches[:30]:print("STATUS",x)
                  for x in locs[:20]:print("LOC",x)
              except Exception as e:
                  print("ERR",type(e).__name__,str(e)[:300])
          PY'
