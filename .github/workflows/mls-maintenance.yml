name: MLS maintenance bridge

on:
  pull_request:
    paths:
      - ".github/workflows/mls-maintenance.yml"
      - ".github/mls-probe.txt"
  workflow_dispatch:

jobs:
  inspect-context-schemas:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect MLS referee goalkeeper and player schemas
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          SSH="ssh -i $KEY -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new $HOST"
          $SSH 'set -Eeuo pipefail; cd /home/anestishkurti92/mls-predictor-v1; venv/bin/python - <<'"'"'PY'"'"'
          from pathlib import Path
          import pandas as pd, json
          root=Path("/home/anestishkurti92/mls-predictor-v1/data/processed")
          for name in [
            "asa_mls_games_2013_present.parquet",
            "asa_player_gk_game_2013_present.parquet",
            "asa_player_xg_game_2013_present.parquet",
            "asa_players.parquet",
            "asa_teams.parquet",
          ]:
              p=root/name
              print("\n==",name,"==")
              if not p.exists():
                  print("MISSING")
                  continue
              d=pd.read_parquet(p)
              print("shape",d.shape)
              print("columns",list(d.columns))
              print(d.head(3).to_json(orient="records",date_format="iso")[:12000])
          PY'
