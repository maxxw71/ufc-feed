name: MLS maintenance bridge

on:
  pull_request:
    paths:
      - ".github/workflows/mls-maintenance.yml"
      - ".github/mls-probe.txt"
  workflow_dispatch:

jobs:
  inspect-mls-stories:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Discover historical MLS player-status reports
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          SSH="ssh -i $KEY -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new $HOST"
          $SSH 'set -Eeuo pipefail; cd /home/anestishkurti92/mls-predictor-v1; venv/bin/python - <<'"'"'PY'"'"'
          import re, urllib.request
          UA="Mozilla/5.0 AppwizaMLSStatusDiscovery/1.0"
          url="https://www.mlssoccer.com/sitemap-stories.xml"
          req=urllib.request.Request(url,headers={"User-Agent":UA})
          raw=urllib.request.urlopen(req,timeout=45).read().decode("utf-8","replace")
          print("bytes",len(raw))
          locs=re.findall(r"<loc>\s*(.*?)\s*</loc>",raw,re.I)
          print("loc_count",len(locs))
          matches=sorted({x for x in locs if "player-status-report" in x.lower() or "injury-report" in x.lower()})
          print("status_matches",len(matches))
          for x in matches:print("STATUS",x)
          PY'
