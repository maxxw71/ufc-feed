name: MLS maintenance bridge

on:
  pull_request:
    paths:
      - ".github/workflows/mls-maintenance.yml"
      - ".github/mls-probe.txt"
  workflow_dispatch:

jobs:
  inspect-real-mls:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Inspect real MLS warehouse through established SSH bridge
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          SSH="ssh -i $KEY -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new $HOST"
          $SSH 'set -Eeuo pipefail; cd /home/anestishkurti92/mls-predictor-v1; echo "== ROOT =="; pwd; echo "== TOP =="; find . -maxdepth 2 -type f | sort | head -250; echo "== PROCESSED =="; ls -lh data/processed | tail -80; echo "== REPORTS =="; ls -lh reports | tail -80; echo "== AVAILABILITY =="; find data/raw/availability_archive live/availability -maxdepth 2 -type f -printf "%p %s bytes\n" 2>/dev/null | sort | tail -120; venv/bin/python - <<'"'"'PY'"'"'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path("/home/anestishkurti92/mls-predictor-v1")
          print("== DATAFRAME SCHEMAS ==")
          for rel in [
              "data/processed/mls_match_features_advanced.parquet",
              "data/processed/mls_player_manager_pregame_features.parquet",
              "data/processed/mls_match_features_player_enriched.parquet",
              "data/raw/availability_archive/availability_archive_2024_2025.parquet",
          ]:
              p=root/rel
              if not p.exists():
                  print(rel, "MISSING")
                  continue
              d=pd.read_parquet(p)
              print(rel, "shape=",d.shape)
              print("columns=",list(d.columns))
              print("season_counts=", d["season"].value_counts().sort_index().to_dict() if "season" in d else "n/a")
          print("== ARCHIVE META ==")
          p=root/"data/raw/availability_archive/meta.json"
          print(p.read_text() if p.exists() else "missing")
          print("== LATEST UNMATCHED ==")
          p=root/"live/availability/latest.json"
          if p.exists():
              d=json.loads(p.read_text())
              print(json.dumps(d.get("unmatched") or [],indent=2,ensure_ascii=False))
              print("team_summary_keys", sorted((d.get("team_summary") or {}).keys()))
          print("== MERGE META ==")
          p=root/"reports/player_merge_meta.json"
          print(p.read_text() if p.exists() else "missing")
          PY'
