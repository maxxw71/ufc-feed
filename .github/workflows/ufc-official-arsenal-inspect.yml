name: UFC Official Arsenal Inspect
on:
  push:
    paths:
      - '.github/workflows/ufc-official-arsenal-inspect.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: [self-hosted, appwiza]
    steps:
      - uses: actions/checkout@v4
      - name: Inspect actual UFC tracker module
        shell: bash
        run: |
          set -euo pipefail
          OUT=ufc_unique_method_discovery/official_arsenal_inspect.txt
          mkdir -p "$(dirname "$OUT")"
          cd /home/anestishkurti92/ufc-predictor-v1
          source venv/bin/activate
          python - "$OUT" <<'PY'
          import sys,inspect
          from pathlib import Path
          sys.path.insert(0,'/home/anestishkurti92/betting-ledger/code')
          import bet_tracker
          p=Path(sys.argv[1])
          p.write_text('FILE='+str(bet_tracker.__file__)+'\n\n'+inspect.getsource(bet_tracker.ufc_picks))
          PY
      - name: Push diagnostic
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git checkout -B ufc-inspect-output
          git add -f ufc_unique_method_discovery/official_arsenal_inspect.txt
          git commit -m 'Inspect actual UFC tracker module' || true
          git push -f origin ufc-inspect-output
# trigger 14
