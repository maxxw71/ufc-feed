name: UFC Official Arsenal Inspect
on:
  push:
    paths:
      - '.github/workflows/ufc-official-arsenal-inspect.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: [self-hosted, appwiza]
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live UFC modules over local SSH
        shell: bash
        run: |
          set -euo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          SSH="ssh -i $KEY -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new $HOST"
          OUT=ufc_unique_method_discovery/official_arsenal_inspect.txt
          mkdir -p "$(dirname "$OUT")"
          $SSH 'export HOME=/home/anestishkurti92; cd /home/anestishkurti92/ufc-predictor-v1; source venv/bin/activate; python - <<'"'"'PY'"'"'
import inspect,importlib.util,sys
from pathlib import Path
wp=Path("/home/anestishkurti92/ufc-predictor-v1/ufc_email_watcher.py")
spec=importlib.util.spec_from_file_location("watcher_runtime",wp)
w=importlib.util.module_from_spec(spec);spec.loader.exec_module(w)
print("BET_TRACKER_FILE",getattr(w.bet_tracker,"__file__",None))
print(inspect.getsource(w.bet_tracker.ufc_picks))
print("UFC_EMAIL_DESIGN_FILE",getattr(w.ufc_email_design,"__file__",None))
print(inspect.getsource(w.ufc_email_design.method_cards))
PY' > "$OUT"
      - name: Push diagnostic to isolated branch
        shell: bash
        run: |
          git config user.name 'appwiza-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -B ufc-inspect-output
          git add -f ufc_unique_method_discovery/official_arsenal_inspect.txt
          git commit -m 'UFC live runtime hook diagnostic' || true
          git push -f origin ufc-inspect-output
# trigger 11
