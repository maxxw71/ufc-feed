name: UFC Official Arsenal Inspect
on:
  push:
    paths:
      - '.github/workflows/ufc-official-arsenal-inspect.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: [self-hosted, appwiza]
    steps:
      - uses: actions/checkout@v4
      - name: Inspect runtime UFC hooks via watcher import
        shell: bash
        run: |
          set -euo pipefail
          OUT=ufc_unique_method_discovery/official_arsenal_inspect.txt
          mkdir -p "$(dirname "$OUT")"
          cd /home/anestishkurti92/ufc-predictor-v1
          source venv/bin/activate
          python - "$OUT" <<'PY'
          import sys,inspect,importlib.util
          from pathlib import Path
          wp=Path('/home/anestishkurti92/ufc-predictor-v1/ufc_email_watcher.py')
          spec=importlib.util.spec_from_file_location('watcher_runtime',wp)
          w=importlib.util.module_from_spec(spec);spec.loader.exec_module(w)
          parts=[]
          parts.append('BET_TRACKER_FILE='+str(getattr(w.bet_tracker,'__file__',None)))
          parts.append(inspect.getsource(w.bet_tracker.ufc_picks))
          parts.append('UFC_EMAIL_DESIGN_FILE='+str(getattr(w.ufc_email_design,'__file__',None)))
          parts.append(inspect.getsource(w.ufc_email_design.method_cards))
          Path(sys.argv[1]).write_text('\n\n'.join(parts))
          PY
      - name: Push diagnostic to isolated branch
        shell: bash
        run: |
          git config user.name 'appwiza-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -B ufc-inspect-output
          git add -f ufc_unique_method_discovery/official_arsenal_inspect.txt
          git commit -m 'UFC runtime hook diagnostic via watcher' || true
          git push -f origin ufc-inspect-output
# trigger 9
