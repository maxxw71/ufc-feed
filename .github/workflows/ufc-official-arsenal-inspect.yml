name: UFC Official Arsenal Inspect
on:
  push:
    paths:
      - '.github/workflows/ufc-official-arsenal-inspect.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: [self-hosted, appwiza]
    steps:
      - uses: actions/checkout@v4
      - name: Find UFC pick implementation
        shell: bash
        run: |
          set -u
          OUT=ufc_unique_method_discovery/official_arsenal_inspect.txt
          mkdir -p "$(dirname "$OUT")"
          {
            echo '=== ufc_picks locations ==='
            grep -R -n --include='*.py' 'def ufc_picks' /home/anestishkurti92 /opt 2>/dev/null || true
            echo '=== bet_tracker locations ==='
            find /home/anestishkurti92 /opt -name '*bet*tracker*.py' -o -name 'bet_tracker.py' 2>/dev/null || true
            echo '=== design method cards ==='
            grep -n -A60 -B5 'def method_cards' /home/anestishkurti92/ufc-predictor-v1/ufc_email_design.py 2>/dev/null || true
          } > "$OUT"
      - name: Push diagnostic
        shell: bash
        run: |
          git config user.name 'appwiza-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -B ufc-inspect-output
          git add -f ufc_unique_method_discovery/official_arsenal_inspect.txt
          git commit -m 'Find UFC pick implementation' || true
          git push -f origin ufc-inspect-output
# trigger 12
