name: Boxing WBA PDF layout probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boxing-wba-layout-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pypdf
      - name: Probe known official WBA PDF layout
        run: |
          python - <<'PY'
          import io,urllib.request
          from pypdf import PdfReader
          url='https://www.wbaboxing.com/wba-ranking-pdf/2025/10'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 AppwizaWBAProbe/1.0'})
          raw=urllib.request.urlopen(req,timeout=40).read()
          print('BYTES',len(raw),raw[:4])
          pdf=PdfReader(io.BytesIO(raw))
          for mode in [None,'layout']:
              print('=== MODE',mode,'===')
              for pi,p in enumerate(pdf.pages[:2]):
                  try:t=p.extract_text(extraction_mode=mode) if mode else p.extract_text()
                  except Exception as e:print('ERR',e);continue
                  print('PAGE',pi,'LEN',len(t or ''))
                  for i,line in enumerate((t or '').splitlines()[:220]):
                      print(f'{i:03d}: {line!r}')
          PY
