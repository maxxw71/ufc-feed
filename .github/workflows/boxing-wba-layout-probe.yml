name: Boxing WBA PDF layout probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boxing-wba-layout-probe.yml'
      - 'boxing/research/probe_wba_layout.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pdfplumber
      - name: Probe WBA PDF columns
        run: python boxing/research/probe_wba_layout.py
