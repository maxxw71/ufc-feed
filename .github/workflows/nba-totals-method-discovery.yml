name: NBA Totals Method Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nba/research/discover_totals.py"
      - ".github/workflows/nba-totals-method-discovery.yml"

permissions:
  contents: write

concurrency:
  group: nba-totals-method-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nba/build_market_features.py
      - run: python nba/research/discover_totals.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/research/totals
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: add totals method discovery"
          git fetch origin main
          git rebase origin/main
          git push
