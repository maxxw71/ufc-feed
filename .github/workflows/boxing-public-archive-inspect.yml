name: Boxing public archive inspect

on:
  push:
    paths:
      - '.github/workflows/boxing-public-archive-inspect.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Appwiza publish boxing research database
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  inspect:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect archives
        run: |
          python - <<'PY'
          import json,urllib.request,zipfile,io
          urls={
            'research_database':'https://appwiza.com/sports/downloads/boxing/research-database.zip',
            'reports_indexes':'https://appwiza.com/sports/downloads/boxing/reports-and-indexes.zip',
          }
          out={}
          for name,url in urls.items():
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 AppwizaResearchArchive/1.0'})
                  with urllib.request.urlopen(req,timeout=120) as r:data=r.read()
                  z=zipfile.ZipFile(io.BytesIO(data))
                  out[name]={'url':url,'bytes':len(data),'files':[{'name':x.filename,'size':x.file_size,'compressed':x.compress_size} for x in z.infolist()]}
              except Exception as e:
                  out[name]={'url':url,'error':repr(e)}
          open('boxing/public_archive_index.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Commit archive index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add boxing/public_archive_index.json
          if git diff --cached --quiet; then
            echo 'No archive-index changes.'
          else
            git commit -m 'Update boxing public archive index'
            git push
          fi
