name: DWCS Isolation Guard

on:
  push:
    branches: [main]
    paths:
      - 'dwcs/**'
      - '.github/workflows/dwcs-isolation-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, appwiza]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
      - name: Validate DWCS remains separate from UFC
        run: python dwcs/validate_dwcs.py
