name: NBA shot profile discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/build_shot_profile_rolling.py'
      - 'nba/research/discover_shot_profile.py'
      - 'nba/research/discover_shot_profile_v2.py'
      - '.github/workflows/nba-shot-profile-discovery.yml'

permissions:
  contents: write

concurrency:
  group: nba-shot-profile-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nba/build_shot_profile_rolling.py
      - run: python nba/research/discover_shot_profile.py
      - run: python nba/research/discover_shot_profile_v2.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/features/shot_profile_rolling.csv.gz nba/features/shot_profile_rolling_summary.json nba/research/shot_profile nba/research/shot_profile_v2
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: add shot profile discovery results"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
