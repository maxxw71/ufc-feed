name: DWCS Frozen Method Discovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dwcs-frozen-method-discovery.yml'
      - 'dwcs/research/run_frozen_method_discovery.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas numpy
      - name: Rebuild frozen master from latest enriched sources
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python dwcs/research/build_frozen_master.py
      - name: Run S1-6 discovery and locked S7-9 validation
        run: python dwcs/research/run_frozen_method_discovery.py
      - name: Commit frozen master and discovery results
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add dwcs/frozen dwcs/research/method_discovery_frozen
          git diff --cached --quiet && exit 0
          git commit -m 'Run frozen DWCS method discovery and locked validation'
          git pull --rebase origin main
          git push
