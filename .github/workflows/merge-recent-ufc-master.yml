name: Merge Recent UFC Master

on:
  workflow_dispatch:
  push:
    paths:
      - 'merge_recent_ufc_master.py'
      - 'ufc_recent_exactid_backfill/**'
      - 'ufc_recent_daily_backfill_v2/**'
      - '.github/workflows/merge-recent-ufc-master.yml'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - run: python merge_recent_ufc_master.py
      - name: Commit master results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ufc_recent_master/
          git commit -m "Build merged UFC recent master dataset" || exit 0
          git pull --rebase origin main
          git push
