name: UFC Height ROI Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - 'ufc_height_roi_backtest.py'
      - '.github/workflows/ufc-height-roi-backtest.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests pandas numpy
      - name: Download odds dataset
        run: |
          URL='https://www.kaggle.com/api/v1/kernels/output/download/jerzyszocik/ufc-betting-odds-daily'
          curl -L --fail --retry 6 --retry-delay 3 --retry-all-errors "$URL" -o /tmp/odds.zip
      - name: Run height ROI backtest
        run: python ufc_height_roi_backtest.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ufc_height_roi_backtest/
          git commit -m "Add UFC height hybrid ROI backtest results" || exit 0
          git pull --rebase origin main || true
          git push
