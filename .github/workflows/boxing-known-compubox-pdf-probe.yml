name: Boxing Known Archived CompuBox PDF Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boxing-known-compubox-pdf-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pypdf
      - name: Probe known explicit archived CompuBox full-stat PDF
        shell: bash
        run: |
          python - <<'PY'
          import io,json,urllib.request
          from pypdf import PdfReader
          urls=[
            'https://web.archive.org/web/20110725072211/http://www.compuboxonline.com/featured_stats/V_Klitschko_KO_10_Arreola.pdf',
          ]
          out=[]
          for url in urls:
              item={'url':url}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 AppwizaCompuBoxPDFProbe/1.1'})
                  with urllib.request.urlopen(req,timeout=60) as r:
                      raw=r.read(12_000_001);item['final_url']=r.geturl()
                  item['bytes']=len(raw);item['is_pdf']=raw.lstrip().startswith(b'%PDF')
                  if item['is_pdf']:
                      pdf=PdfReader(io.BytesIO(raw))
                      text='\n'.join((p.extract_text() or '') for p in pdf.pages)
                      item['pages']=len(pdf.pages)
                      item['text_sample']=text[:30000]
              except Exception as e:item['error']=repr(e)
              out.append(item)
          print(json.dumps(out,indent=2,ensure_ascii=False))
          PY
