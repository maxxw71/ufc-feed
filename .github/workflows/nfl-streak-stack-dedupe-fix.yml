name: NFL streak stack dedupe fix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/nfl_streak_stack_dedupe_fix.py'
      - 'scripts/nfl_streak_stack_dedupe_trigger.txt'
permissions:
  contents: write
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Run deduped stack correction
        shell: bash
        run: |
          set -Eeuo pipefail
          /home/anestishkurti92/nfl-predictor-v1/venv/bin/python "$GITHUB_WORKSPACE/scripts/nfl_streak_stack_dedupe_fix.py"
      - name: Publish corrected streak results
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC=/home/appwiza-runner/nfl-context-data/streak_priority_deep_dissection
          DEST="$GITHUB_WORKSPACE/nfl/streak_priority_deep_dissection"
          mkdir -p "$DEST"
          cp "$SRC"/* "$DEST"/
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add nfl/streak_priority_deep_dissection
          if ! git diff --cached --quiet; then
            git commit -m 'Correct redundant streak veto stacks'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
