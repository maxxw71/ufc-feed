name: Deploy crypto daily email

on:
  push:
    branches: [main]
    paths:
      - 'crypto/live/crypto_daily_email.py'
      - '.github/workflows/appwiza-crypto-daily-email-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and schedule daily email
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          SSH="ssh -i $KEY -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new $HOST"

          cat crypto/live/crypto_daily_email.py | $SSH 'mkdir -p /home/anestishkurti92/crypto-trading; cat > /home/anestishkurti92/crypto-trading/crypto_daily_email.py'

          $SSH 'bash -s' <<'EOF' | tee crypto/daily_email_deploy_report.txt
          set -Eeuo pipefail
          ROOT=/home/anestishkurti92/crypto-trading
          PY=/home/anestishkurti92/ufc-predictor-v1/venv/bin/python

          chmod 0755 "$ROOT/crypto_daily_email.py"
          "$PY" - <<'PY'
          from pathlib import Path
          p=Path('/home/anestishkurti92/crypto-trading/crypto_daily_email.py')
          compile(p.read_text(),str(p),'exec')
          print('crypto_daily_email_compile=ok')
          PY

          # Build a real preview from current live signals + latest research,
          # without sending a message during deployment.
          "$PY" "$ROOT/crypto_daily_email.py" --dry-run
          "$PY" - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('/home/anestishkurti92/ufc-predictor-v1/ufc_email_watcher.py')
          spec=importlib.util.spec_from_file_location('ufc_email_watcher_verify',p)
          assert spec and spec.loader
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert callable(getattr(mod,'send_email',None))
          print('ufc_send_email_interface=ok')
          PY

          TMP=$(mktemp)
          crontab -l 2>/dev/null | grep -v '/crypto-trading/crypto_daily_email.py' > "$TMP" || true
          echo 'CRON_TZ=America/New_York' >> "$TMP"
          echo '30 8 * * * /home/anestishkurti92/ufc-predictor-v1/venv/bin/python /home/anestishkurti92/crypto-trading/live_crypto_scanner.py --methods /home/anestishkurti92/crypto-trading/methods.json --output /srv/appwiza-sports/public/trading/crypto/signals.json --history /home/anestishkurti92/crypto-trading/history.json --days 125 --recent-hours 72 >> /home/anestishkurti92/crypto-trading/scanner.log 2>&1; /home/anestishkurti92/ufc-predictor-v1/venv/bin/python /home/anestishkurti92/crypto-trading/crypto_daily_email.py >> /home/anestishkurti92/crypto-trading/email.log 2>&1' >> "$TMP"
          crontab "$TMP"
          rm -f "$TMP"

          echo 'daily_email_schedule=08:30_America/New_York'
          crontab -l | grep 'crypto_daily_email.py'
          test -s "$ROOT/crypto_daily_email_preview.html"
          stat -c '%U:%G %a %s %n' "$ROOT/crypto_daily_email.py" "$ROOT/crypto_daily_email_preview.html"
          EOF

          git config user.name github-actions
          git config user.email github-actions@github.com
          git add crypto/daily_email_deploy_report.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record crypto daily email deployment'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
