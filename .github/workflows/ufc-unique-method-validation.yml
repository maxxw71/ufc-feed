name: UFC Unique Method Validation

on:
  push:
    paths:
      - '.github/workflows/ufc-unique-method-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: [self-hosted, appwiza]
    steps:
      - uses: actions/checkout@v4
      - name: Validate new UFC methods
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/home/anestishkurti92/ufc-predictor-v1
          OUT="$GITHUB_WORKSPACE/ufc_unique_method_discovery"
          mkdir -p "$OUT"
          PY="$ROOT/venv/bin/python"; [ -x "$PY" ] || PY="$ROOT/venv.google-original/bin/python"
          ROOT="$ROOT" OUT="$OUT" "$PY" - <<'PY'
          import os
          from pathlib import Path
          import numpy as np, pandas as pd
          root=Path(os.environ['ROOT']); out=Path(os.environ['OUT'])
          d=pd.read_csv(root/'new_category_discovery/prefight_favorite_features.csv',low_memory=False)
          d['event_date']=pd.to_datetime(d.event_date,errors='coerce')
          for c in d.columns:
              if c not in ['event_date','favorite','opponent','won']:
                  d[c]=pd.to_numeric(d[c],errors='coerce')
          if d.won.dtype != bool:
              d['won']=d.won.astype(str).str.lower().map({'true':1,'false':0,'1':1,'0':0}).astype('boolean')
          d['layoff_gap']=d.o_layoff-d.f_layoff; d['winpct_gap']=d.f_win_pct-d.o_win_pct
          def stats(g):
              n=len(g); p=float(g.profit100.sum()) if n else 0
              return n,int(g.won.fillna(False).sum()),(p/(100*n) if n else np.nan)
          rules={
            'battle_core':(d.market_prob>=.575)&(d.market_prob<=.775)&(d.f_fights>=8)&(d.o_fights<=3)&(d.winpct_gap>=.05),
            'battle_wide_price':(d.market_prob>=.55)&(d.market_prob<=.80)&(d.f_fights>=8)&(d.o_fights<=3)&(d.winpct_gap>=.05),
            'battle_opp4':(d.market_prob>=.575)&(d.market_prob<=.725)&(d.f_fights>=8)&(d.o_fights<=4)&(d.winpct_gap>=.05),
            'battle_exp10':(d.market_prob>=.55)&(d.market_prob<=.80)&(d.f_fights>=10)&(d.o_fights<=5)&(d.winpct_gap>=0),
            'ring_rust_core':(d.market_prob>=.55)&(d.market_prob<=.75)&(d.layoff_gap>=90)&(d.o_layoff>=300)&(d.f_layoff<=120)&(d.f_fights>=3)&(d.o_fights>=3),
            'experience_freshness':(d.market_prob>=.55)&(d.market_prob<=.725)&((d.f_fights-d.o_fights)>=5)&(d.layoff_gap>=120)&(d.f_fights>=6),
          }
          lines=['UFC UNIQUE METHOD ROBUSTNESS VALIDATION','='*100]
          allrows=[]
          for name,m in rules.items():
              g=d[m.fillna(False)].copy(); n,w,roi=stats(g)
              lines += ['',f'{name}: {n} bets, {w}-{n-w}, win {w/n*100:.1f}%, ROI {roi*100:+.2f}%']
              ys=[]
              for y,gg in g.groupby(g.event_date.dt.year):
                  nn,ww,rr=stats(gg); ys.append((int(y),nn,ww,rr)); allrows.append(dict(rule=name,year=int(y),n=nn,wins=ww,roi=rr))
              lines.append('  Yearly: '+' | '.join(f'{y}: {nn} bets {rr*100:+.1f}%' for y,nn,ww,rr in ys))
              g=g.sort_values('event_date').reset_index(drop=True)
              edges=np.linspace(0,len(g),4,dtype=int)
              vals=[]
              for i in range(3):
                  c=g.iloc[edges[i]:edges[i+1]]; nn,ww,rr=stats(c); vals.append(f'T{i+1} n={nn} ROI={rr*100:+.1f}%')
              lines.append('  Chronological thirds: '+' | '.join(vals))
              lo=[]
              for y in sorted(g.event_date.dt.year.dropna().unique()):
                  gg=g[g.event_date.dt.year!=y]; nn,ww,rr=stats(gg); lo.append(rr)
              if lo: lines.append(f'  Leave-one-year-out ROI range: {min(lo)*100:+.2f}% to {max(lo)*100:+.2f}%')
              if n:
                  rng=np.random.default_rng(71); arr=g.profit100.to_numpy(float)
                  vals=np.array([rng.choice(arr,size=n,replace=True).mean()/100 for _ in range(10000)])
                  q=np.quantile(vals,[.025,.5,.975]); lines.append(f'  Bootstrap ROI 95% CI: {q[0]*100:+.2f}% to {q[2]*100:+.2f}% (median {q[1]*100:+.2f}%)')
          pd.DataFrame(allrows).to_csv(out/'validation_yearly.csv',index=False)
          (out/'validation_report.txt').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
      - name: Commit validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add ufc_unique_method_discovery/validation_report.txt ufc_unique_method_discovery/validation_yearly.csv
          git diff --cached --quiet && exit 0
          git commit -m 'Validate new UFC research methods'
          git push
