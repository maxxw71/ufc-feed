name: BoxingScene CompuBox API Probe
on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/probe_boxingscene_compubox_api.py'
      - '.github/workflows/boxing-boxingscene-compubox-api-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4 lxml
      - run: python boxing/research/probe_boxingscene_compubox_api.py
