name: NBA Historical Injury Features

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/build_historical_injury_features.py'
      - 'nba/availability/historical_by_season/**'
      - '.github/workflows/nba-historical-injury-features.yml'

permissions:
  contents: write

concurrency:
  group: nba-historical-injury-features
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python nba/build_historical_injury_features.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name appwiza-nba-bot
          git config user.email actions@users.noreply.github.com
          git add nba/features/historical_injury_players.csv.gz nba/features/historical_injury_teams.csv.gz nba/features/historical_injury_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: refresh historical injury features"
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
