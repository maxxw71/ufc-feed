name: Boxing Wikidata Nationality Backfill

on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/backfill_wikidata_nationalities.py'
      - '.github/workflows/boxing-wikidata-nationality-backfill.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backfill exact Wikipedia/Wikidata citizenship
        run: python boxing/research/backfill_wikidata_nationalities.py
      - name: Persist verified nationality supplements on latest main
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/boxing-wikidata-nationality
          cp boxing/profile_supplements/verified_profiles.jsonl /tmp/boxing-wikidata-nationality/verified_profiles.jsonl
          cp boxing/profile_supplements/wikidata_nationality_backfill_report.json /tmp/boxing-wikidata-nationality/report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/boxing-wikidata-nationality/verified_profiles.jsonl boxing/profile_supplements/verified_profiles.jsonl
          cp /tmp/boxing-wikidata-nationality/report.json boxing/profile_supplements/wikidata_nationality_backfill_report.json
          git add boxing/profile_supplements/verified_profiles.jsonl boxing/profile_supplements/wikidata_nationality_backfill_report.json
          if git diff --cached --quiet; then
            echo 'No Wikidata nationality changes.'
          else
            git commit -m 'Expand verified boxing nationalities from Wikidata citizenship'
            git push origin HEAD:main
          fi
