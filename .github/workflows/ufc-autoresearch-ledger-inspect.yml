name: UFC Auto Research Ledger Inspect
on:
  push:
    paths:
      - '.github/workflows/ufc-autoresearch-ledger-inspect.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: [self-hosted, appwiza]
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          ssh -i "$KEY" -o StrictHostKeyChecking=no anestishkurti92@127.0.0.1 'bash -s' <<'EOF'
          set -e
          cd /home/anestishkurti92/ufc-predictor-v1
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 venv/bin/python ufc_autoresearch_runner.py snapshot
          echo '=== OFFICIAL HISTORY ==='
          find auto_research/official_history -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null | sort || true
          echo '=== DB SOURCES ==='
          venv/bin/python - <<'PY'
          import sqlite3
          db=sqlite3.connect('auto_research/state/research.sqlite3')
          for row in db.execute("SELECT source,COUNT(*),MAX(captured_at) FROM source_snapshots GROUP BY source ORDER BY source"):
              print(row)
          print('official_auto_promotions',db.execute('SELECT COUNT(*) FROM candidates WHERE official != 0').fetchone()[0])
          PY
          EOF
