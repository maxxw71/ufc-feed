name: UFC Methods Deep Research
on:
  push:
    paths:
      - '.github/workflows/ufc-methods-deep-research.yml'
  workflow_dispatch:
jobs:
  research:
    runs-on: [self-hosted, appwiza]
    timeout-minutes: 40
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          K=/home/appwiza-runner/.ssh/appwiza_vps
          ssh -i "$K" -o StrictHostKeyChecking=no anestishkurti92@127.0.0.1 'bash -s' <<'EOF'
          set -euo pipefail
          cd /home/anestishkurti92/ufc-predictor-v1
          echo '=== LIVE METHOD CODE ==='
          grep -nE 'def (compute_|.*signal|predict_bout)|pace_defense|striking_td_defense|striking_differential|wrestling_mismatch|AGE HYBRID|REACH HYBRID|STRUCTURAL EDGE|AGE \+ REACH' ufc_email_watcher.py | tail -220
          echo '=== STRIKING INDEX ==='
          cat striking_method_index.json 2>/dev/null | head -200 || true
          echo '=== WRESTLING ROBUST CANDIDATES TOP ==='
          venv/bin/python - <<'PY'
          import pandas as pd
          for p in ['wrestling_mismatch_analysis/robust_wrestling_candidates.csv','striking_family_stability/stable_striking_candidates.csv','striking_portfolio_100/strategy_summary.csv']:
            try:
              d=pd.read_csv(p,low_memory=False); print('\n',p,list(d.columns)); print(d.head(30).to_string(index=False))
            except Exception as e: print(p,e)
          PY
          EOF
