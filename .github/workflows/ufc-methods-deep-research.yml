name: UFC Methods Deep Research
on:
  push:
    paths:
      - '.github/workflows/ufc-methods-deep-research.yml'
  workflow_dispatch:
jobs:
  research:
    runs-on: [self-hosted, appwiza]
    timeout-minutes: 40
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          K=/home/appwiza-runner/.ssh/appwiza_vps
          ssh -i "$K" -o StrictHostKeyChecking=no anestishkurti92@127.0.0.1 'bash -s' <<'EOF'
          set -euo pipefail
          cd /home/anestishkurti92/ufc-predictor-v1
          mkdir -p method_deep_research
          venv/bin/python - <<'PY'
          import pandas as pd, numpy as np, json, re
          def norm(s): return re.sub(r'[^a-z0-9]+',' ',str(s or '').lower()).strip()
          def summary(d, won='won', dec='fav_decimal', date='event_date'):
              x=d.copy(); w=x[won].astype(bool); od=pd.to_numeric(x[dec],errors='coerce'); m=od.notna()&(od>1)
              x=x.loc[m].copy(); w=w.loc[m]; od=od.loc[m]
              p=np.where(w,od-1,-1.0)
              ans={'n':len(x),'wins':int(w.sum()),'losses':int((~w).sum()),'win_rate':float(w.mean()),'roi':float(np.mean(p))}
              dt=pd.to_datetime(x[date],errors='coerce')
              for label,mask in [('pre2020',dt.dt.year<2020),('recent2020p',dt.dt.year>=2020)]:
                  if mask.sum():
                      pp=np.where(w[mask],od[mask]-1,-1.0); ans[label+'_n']=int(mask.sum()); ans[label+'_roi']=float(np.mean(pp))
              return ans
          def printj(tag,obj): print(tag,json.dumps(obj,sort_keys=True))

          v6=pd.read_csv('feature_expansion/prefight_favorite_features_v6.csv',low_memory=False)
          v6['_key']=v6.apply(lambda r:(str(pd.to_datetime(r['event_date']).date()),)+tuple(sorted((norm(r['favorite']),norm(r['opponent'])))),axis=1)
          vdict={k:g.iloc[0] for k,g in v6.groupby('_key',sort=False)}

          print('=== U2 REACH SKILL VETO / NEW FEATURE FILTERS ===')
          u2=pd.read_csv('skill_veto_official_samples/reach_415_with_skill_veto.csv',low_memory=False).rename(columns={'_won':'won'})
          u2['_key']=u2.apply(lambda r:(str(pd.to_datetime(r['event_date']).date()),)+tuple(sorted((norm(r['favorite']),norm(r['underdog'])))),axis=1)
          rows=[]
          for _,r in u2.iterrows():
              rr=r.to_dict(); z=vdict.get(r['_key'])
              if z is not None:
                  for c in v6.columns:
                      if c.startswith(('f2_','f3_','f4_','f5_','f6_')): rr[c]=z.get(c,np.nan)
              rows.append(rr)
          u2x=pd.DataFrame(rows); printj('U2_BASE',summary(u2x,'won','fav_decimal'))
          tests={'skill_veto_keep':~u2x['skill_veto_flag'].fillna(False)}
          for c,t,op in [('f2_diff_sig_diff_pm',-1.0,'>'),('f2_diff_td_def',-0.20,'>'),('f2_diff_days_since_ko_loss',0,'>='),('f5_diff_current_lose_streak',1,'<='),('f6_diff_split_loss_count',1,'<=')]:
              if c in u2x:
                  s=pd.to_numeric(u2x[c],errors='coerce'); tests[c+op+str(t)]=(s>t if op=='>' else s>=t if op=='>=' else s<=t)
          for name,m in tests.items():
              q=u2x[m.fillna(False)]
              if len(q)>=40: printj('U2_FILTER_'+name,summary(q,'won','fav_decimal'))

          print('=== U3 STRUCTURAL EDGE NEW FEATURE FILTERS ===')
          u3=pd.read_csv('structural_edge_failure_analysis/structural_edge_83_fights.csv',low_memory=False).rename(columns={'favorite_won':'won','profit_100':'profit100'})
          ao=pd.to_numeric(u3['american_odds'],errors='coerce');u3['fav_decimal']=np.where(ao<0,1+100/(-ao),1+ao/100)
          u3['_key']=u3.apply(lambda r:(str(pd.to_datetime(r['event_date']).date()),)+tuple(sorted((norm(r['favorite']),norm(r['underdog'])))),axis=1)
          rows=[]
          for _,r in u3.iterrows():
              rr=r.to_dict(); z=vdict.get(r['_key'])
              if z is not None:
                  for c in v6.columns:
                      if c.startswith(('f2_','f3_','f4_','f5_','f6_')): rr[c]=z.get(c,np.nan)
              rows.append(rr)
          u3x=pd.DataFrame(rows); printj('U3_BASE',summary(u3x,'won','fav_decimal'))
          cand=[]
          for c in [x for x in u3x.columns if x.startswith(('f2_diff_','f5_diff_','f6_diff_'))]:
              s=pd.to_numeric(u3x[c],errors='coerce')
              if s.notna().sum()<35 or s.nunique()<4: continue
              for quant in [.15,.25,.35,.65,.75,.85]:
                  t=float(s.quantile(quant))
                  for op in ['>=','<=']:
                      m=s>=t if op=='>=' else s<=t; q=u3x[m.fillna(False)]
                      if len(q)<45: continue
                      sm=summary(q,'won','fav_decimal')
                      if sm.get('pre2020_n',0)>=20 and sm.get('recent2020p_n',0)>=10 and sm['roi']>0.121 and sm.get('pre2020_roi',-9)>0 and sm.get('recent2020p_roi',-9)>0:
                          cand.append((min(sm['pre2020_roi'],sm['recent2020p_roi']),sm['roi'],c,op,t,sm))
          for x in sorted(cand,reverse=True)[:20]: printj('U3_CAND '+f'{x[2]} {x[3]} {x[4]:.4g}',x[5])

          print('=== U5 ROBUST NEIGHBORHOOD ===')
          wr=pd.read_csv('wrestling_mismatch_analysis/robust_wrestling_candidates.csv',low_memory=False)
          print('U5_cols',list(wr.columns))
          favroi=next((c for c in wr if 'roi' in c.lower() and 'fav' in c.lower()),None); pre=next((c for c in wr if 'pre' in c.lower() and ('edge' in c.lower() or 'roi' in c.lower())),None); recent=next((c for c in wr if ('recent' in c.lower() or '2020' in c.lower()) and ('edge' in c.lower() or 'roi' in c.lower())),None)
          if favroi:
              z=wr.copy(); z[favroi]=pd.to_numeric(z[favroi],errors='coerce')
              if pre: z=z[pd.to_numeric(z[pre],errors='coerce')>0]
              if recent: z=z[pd.to_numeric(z[recent],errors='coerce')>0]
              print(z.sort_values(favroi,ascending=False).head(25).to_string(index=False))

          print('=== U6-U8 FAMILY STABILITY ===')
          files={'U6':'striking_family_stability/pace_defense_all.csv','U7':'striking_family_stability/striking_td_defense_all.csv','U8':'striking_family_stability/striking_differential_all.csv'}
          for n,p in files.items():
              d=pd.read_csv(p); stable=d[(d['n']>=40)&(d['pre_n']>=15)&(d['recent_n']>=15)&(d['roi']>0)&(d['pre_roi']>0)&(d['recent_roi']>0)].copy()
              print(n,'stable_count',len(stable),'of',len(d)); print(stable.sort_values(['roi','n'],ascending=[False,False]).head(20).to_string(index=False))

          print('=== U10 THRESHOLD NEIGHBORHOOD ===')
          s10=pd.to_numeric(v6['f2_diff_days_since_ko_loss'],errors='coerce')
          for t in [30,60,75,90,105,120,150,180,240,365]:
              q=v6[s10>=t]
              if len(q)>=40: printj('U10_T'+str(t),summary(q,'won','fav_decimal'))

          print('=== U11 THRESHOLD NEIGHBORHOOD ===')
          s11=pd.to_numeric(v6['f2_diff_strong_opp_sig_diff'],errors='coerce')
          for t in [1.0,1.5,2.0,2.3,2.5,2.623,2.75,3.0,3.5,4.0]:
              q=v6[s11>=t]
              if len(q)>=40: printj('U11_T'+str(t),summary(q,'won','fav_decimal'))

          print('=== U10/U11 OVERLAP ===')
          a=s10>=105;b=s11>=2.623
          for tag,m in [('U10_only',a&~b),('U11_only',b&~a),('both',a&b),('union',a|b)]:
              q=v6[m.fillna(False)]
              if len(q): printj(tag,summary(q,'won','fav_decimal'))
          PY
          EOF
