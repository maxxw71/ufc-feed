name: Inspect UFC mailer interface for crypto

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-ufc-mailer-interface-for-crypto.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Read mailer function safely
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          SSH="ssh -i $KEY -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new $HOST"
          {
            echo '=== send_email ==='
            $SSH "python3 - <<'PY'
import ast
from pathlib import Path
p=Path('/home/anestishkurti92/ufc-predictor-v1/ufc_email_watcher.py')
s=p.read_text()
t=ast.parse(s)
for n in t.body:
    if isinstance(n,ast.FunctionDef) and n.name=='send_email':
        print(ast.get_source_segment(s,n))
PY"
            echo '=== env keys referenced by mailer/backtest ==='
            $SSH "python3 - <<'PY'
import ast,re
from pathlib import Path
for fn in ['/home/anestishkurti92/ufc-predictor-v1/ufc_email_watcher.py','/home/anestishkurti92/ufc-predictor-v1/ufc_historical_backtest.py']:
    s=Path(fn).read_text()
    keys=sorted(set(re.findall(r'vals\.get\([\"\'']([^\"\'']+)',s)))
    print(fn, keys)
PY"
          } > crypto/mailer_interface_exact.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add crypto/mailer_interface_exact.txt
          git commit -m 'Inspect exact UFC mailer interface for crypto' || true
          git pull --rebase origin main
          git push origin HEAD:main
