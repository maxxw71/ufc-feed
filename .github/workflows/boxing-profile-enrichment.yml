name: Boxing strict profile enrichment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boxing-profile-enrichment.yml'
      - 'boxing/research/backfill_profile_proxies.py'

concurrency:
  group: boxing-profile-enrichment
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  enrich:
    if: github.repository == 'maxxw71/ufc-feed' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4 lxml python-dateutil
      - name: Fill highest-impact missing boxer profile fields
        run: python boxing/research/backfill_profile_proxies.py --limit 160
      - name: Commit verified profile supplements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add boxing/profile_supplements
          if git diff --cached --quiet; then
            echo 'No profile supplement changes.'
          else
            git commit -m 'Expand verified boxing profile supplements'
            git pull --rebase origin main
            git push
          fi
