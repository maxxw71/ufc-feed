name: NBA Historical Season Backfill

on:
  workflow_dispatch:
    inputs:
      season:
        description: "NBA season, e.g. 2024-25"
        required: true
        default: "2024-25"
      include_postseason:
        description: "Also backfill postseason"
        required: true
        default: "true"
        type: choice
        options: ["true","false"]

permissions:
  contents: write

concurrency:
  group: nba-historical-${{ github.event.inputs.season }}
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade requests

      - name: Backfill selected season
        shell: bash
        run: |
          set -euo pipefail
          SEASON="${{ github.event.inputs.season }}"
          ARGS=(--slice "$SEASON|Regular Season")
          if [[ "${{ github.event.inputs.include_postseason }}" == "true" ]]; then
            ARGS+=(--slice "$SEASON|Post Season")
          fi
          python nba/bootstrap_dataset.py "${ARGS[@]}"

      - name: Integrity audit
        run: python nba/integrity_check.py

      - name: Build context and rolling features
        run: |
          python nba/build_context.py
          python nba/build_rolling_features.py

      - name: Commit selected historical season
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/data nba/bootstrap_status.json nba/integrity_report.json nba/team_game_context.csv.gz nba/context_summary.json nba/features
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "nba: backfill ${{ github.event.inputs.season }}"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push
