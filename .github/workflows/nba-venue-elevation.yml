name: NBA venue elevation enrichment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/travel/enrich_venue_elevation.py'
      - 'nba/build_travel_context.py'
      - '.github/workflows/nba-venue-elevation.yml'
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nba/travel/enrich_venue_elevation.py
      - run: python nba/build_travel_context.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email actions@users.noreply.github.com
          git add nba/travel/venue_geocode_cache.json nba/travel/venue_elevation_summary.json nba/features/travel_pregame.csv.gz nba/features/travel_pregame_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: add venue elevation and travel features"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
