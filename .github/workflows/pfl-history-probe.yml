name: PFL History Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pfl_history_probe.py"
      - ".github/workflows/pfl-history-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml pandas duckdb
      - name: Probe sources
        run: python pfl_history_probe.py
