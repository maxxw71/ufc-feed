name: UFC Unique Method Inventory

on:
  push:
    paths:
      - '.github/workflows/ufc-unique-method-inventory.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: [self-hosted, appwiza]
    steps:
      - uses: actions/checkout@v4

      - name: Inventory UFC research datasets
        shell: bash
        run: |
          set -u
          ROOT=/home/anestishkurti92/ufc-predictor-v1
          OUT="$GITHUB_WORKSPACE/ufc_unique_method_discovery"
          mkdir -p "$OUT"
          {
            echo "UFC RESEARCH DATASET INVENTORY"
            echo "Generated: $(date -u +%FT%TZ)"
            echo "Root: $ROOT"
            echo
            echo "== KEY FILE HEADERS =="
            for f in \
              "$ROOT/favorite_loss_risk_analysis/enriched_market_sample.csv" \
              "$ROOT/combined_age_reach_backtest/reach_market_sample.csv" \
              "$ROOT/raw/competitions.csv" \
              "$ROOT/historical_backtest/walkforward_fight_results.csv" \
              "$ROOT/new_category_discovery/prefight_favorite_features.csv" \
              "$ROOT/wrestling_stability_positive_roi/all_favorite_sides_with_prefight_wrestling.csv"; do
              echo "--- $f ---"
              if [ -f "$f" ]; then head -1 "$f"; else echo MISSING; fi
            done
          } > "$OUT/inventory.txt"

          PY="$ROOT/venv/bin/python"
          if [ ! -x "$PY" ]; then PY="$ROOT/venv.google-original/bin/python"; fi
          ROOT="$ROOT" "$PY" - <<'PY' >> "$OUT/inventory.txt"
          import os
          from pathlib import Path
          import pandas as pd
          root=Path(os.environ['ROOT'])
          print('\n== SCHEMAS / ROW COUNTS ==')
          candidates=[
              root/'favorite_loss_risk_analysis/enriched_market_sample.csv',
              root/'combined_age_reach_backtest/reach_market_sample.csv',
              root/'raw/competitions.csv',
              root/'historical_backtest/walkforward_fight_results.csv',
              root/'new_category_discovery/prefight_favorite_features.csv',
              root/'wrestling_stability_positive_roi/all_favorite_sides_with_prefight_wrestling.csv',
          ]
          for p in candidates:
              print(f'\n--- {p} ---')
              if not p.exists(): print('MISSING'); continue
              d=pd.read_csv(p, low_memory=False)
              print('rows:',len(d),'cols:',len(d.columns))
              print('columns:', '|'.join(map(str,d.columns)))
              if 'event_date' in d.columns:
                  x=pd.to_datetime(d['event_date'],errors='coerce')
                  print('event_date:',x.min(),'->',x.max())
          PY

      - name: Commit inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'appwiza-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ufc_unique_method_discovery/inventory.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh UFC research dataset inventory'
          git push
