name: Immediate C3 candidate search

on:
  push:
    branches: [main]
    paths:
      - 'crypto/research/c3_immediate_search.py'
      - '.github/workflows/c3-immediate-search.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy
      - run: python crypto/research/c3_immediate_search.py
      - name: Commit results
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add crypto/research/results_c3_search
          if ! git diff --cached --quiet; then
            git commit -m "Update immediate C3 candidate search"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
