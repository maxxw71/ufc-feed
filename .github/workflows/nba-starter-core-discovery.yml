name: NBA Starter Core Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nba/build_starter_core.py"
      - "nba/research/discover_starter_core.py"
      - ".github/workflows/nba-starter-core-discovery.yml"

permissions:
  contents: write

concurrency:
  group: nba-starter-core-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nba/build_starter_core.py
      - run: python nba/research/discover_starter_core.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/features/starter_core_pregame.csv.gz nba/features/starter_core_pregame_summary.json nba/research/starter_core
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: add starter core method discovery results"
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
