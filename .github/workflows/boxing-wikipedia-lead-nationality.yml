name: Boxing Wikipedia Lead Nationality Backfill

on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/backfill_wikipedia_lead_nationalities.py'
      - '.github/workflows/boxing-wikipedia-lead-nationality.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backfill explicit Wikipedia lead nationalities
        run: python boxing/research/backfill_wikipedia_lead_nationalities.py
      - name: Persist verified nationality supplements on latest main
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/wiki-lead-nationality
          cp boxing/profile_supplements/verified_profiles.jsonl /tmp/wiki-lead-nationality/verified_profiles.jsonl
          cp boxing/profile_supplements/wikipedia_lead_nationality_backfill_report.json /tmp/wiki-lead-nationality/report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/wiki-lead-nationality/verified_profiles.jsonl boxing/profile_supplements/verified_profiles.jsonl
          cp /tmp/wiki-lead-nationality/report.json boxing/profile_supplements/wikipedia_lead_nationality_backfill_report.json
          git add boxing/profile_supplements/verified_profiles.jsonl boxing/profile_supplements/wikipedia_lead_nationality_backfill_report.json
          if git diff --cached --quiet; then
            echo 'No Wikipedia lead nationality changes.'
          else
            git commit -m 'Expand boxer nationalities from explicit Wikipedia leads'
            git push origin HEAD:main
          fi
