name: C3 Binance frozen validation

on:
  push:
    branches: [main]
    paths:
      - 'crypto/research/c3_binance_validation.py'
      - '.github/workflows/c3-binance-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy requests
      - run: python crypto/research/c3_binance_validation.py
      - name: Commit results
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add crypto/research/results_c3_binance_validation
          if ! git diff --cached --quiet; then
            git commit -m "Update C3 Binance frozen validation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
