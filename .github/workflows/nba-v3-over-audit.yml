name: NBA V3 OVER Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/research/audit_hunt_v3_over.py'
      - '.github/workflows/nba-v3-over-audit.yml'

permissions:
  contents: write

concurrency:
  group: nba-v3-over-audit
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python nba/research/audit_hunt_v3_over.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name appwiza-nba-bot
          git config user.email actions@users.noreply.github.com
          git add nba/research/hunt_v3/hunt_v3_over_robustness.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'nba: add V3 OVER robustness results'
          git pull --rebase origin main
          git push