name: NBA Pregame Lineup Features

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nba/lineups/historical_lineup_stints.csv.gz"
      - "nba/build_lineup_pregame.py"
      - ".github/workflows/nba-lineup-pregame-features.yml"

permissions:
  contents: write

concurrency:
  group: nba-lineup-pregame-features
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nba/build_lineup_pregame.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/features/lineup_pregame.csv.gz nba/features/lineup_pregame_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: build pregame lineup continuity features"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push
