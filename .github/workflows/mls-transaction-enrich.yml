name: MLS Transaction Enrichment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/mls_transaction_enrich.py'
      - 'mls/lineups/feature_meta.json'
      - '.github/workflows/mls-transaction-enrich.yml'

concurrency:
  group: mls-transaction-enrich
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'maxxw71/ufc-feed'
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Deploy and build official MLS transaction features
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          SSH="ssh -i $KEY -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new $HOST"
          D=/home/anestishkurti92/mls-predictor-v1
          $SSH 'cd /home/anestishkurti92/mls-predictor-v1 && venv/bin/pip install --quiet beautifulsoup4'
          cat scripts/mls_transaction_enrich.py | $SSH 'set -e; D=/home/anestishkurti92/mls-predictor-v1; cat > "$D/mls_transaction_enrich.py.new"; chmod 0644 "$D/mls_transaction_enrich.py.new"; mv -f "$D/mls_transaction_enrich.py.new" "$D/mls_transaction_enrich.py"'
          $SSH 'set -Eeuo pipefail; cd /home/anestishkurti92/mls-predictor-v1; venv/bin/python -m py_compile mls_transaction_enrich.py; timeout 10m venv/bin/python mls_transaction_enrich.py'

      - name: Pull transaction audit
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          mkdir -p mls/transactions
          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" 'cat /home/anestishkurti92/mls-predictor-v1/reports/transaction_feature_meta.json' > mls/transactions/feature_meta.json

      - name: Persist transaction audit
        shell: bash
        run: |
          set -Eeuo pipefail
          cp mls/transactions/feature_meta.json "$RUNNER_TEMP/transaction_feature_meta.json"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p mls/transactions
          cp "$RUNNER_TEMP/transaction_feature_meta.json" mls/transactions/feature_meta.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add mls/transactions/feature_meta.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish MLS transaction enrichment audit'
            git push origin HEAD:main
          fi
