name: Method 1 blow-off shape audit

on:
  push:
    branches: [main]
    paths:
      - 'crypto/research/method1_blowoff_shape_audit.py'
      - '.github/workflows/method1-blowoff-shape-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy requests
      - run: python crypto/research/method1_blowoff_shape_audit.py
      - name: Commit outputs
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add crypto/research/results_method1_blowoff_shape
          if ! git diff --cached --quiet; then
            git commit -m "Update Method 1 blow-off shape audit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
