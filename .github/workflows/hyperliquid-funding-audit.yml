name: Hyperliquid historical funding audit

on:
  push:
    branches: [main]
    paths:
      - 'crypto/research/hyperliquid_funding_audit.py'
      - '.github/workflows/hyperliquid-funding-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy requests
      - name: Pull historical funding windows
        run: |
          python crypto/research/hyperliquid_funding_audit.py             --mode scan             --shard-index ${{ matrix.shard }}             --shard-count 8             --sleep 0.35             --out funding_out
      - uses: actions/upload-artifact@v4
        with:
          name: funding-${{ matrix.shard }}
          path: funding_out/
          retention-days: 2

  aggregate:
    needs: scan
    if: always() && needs.scan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy requests
      - uses: actions/download-artifact@v4
        with:
          pattern: funding-*
          path: funding_shards
          merge-multiple: true
      - run: |
          python crypto/research/hyperliquid_funding_audit.py             --mode aggregate             --input-dir funding_shards             --out crypto/research/results_hyperliquid_funding
      - name: Commit funding audit
        run: |
          git config user.name "appwiza-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crypto/research/results_hyperliquid_funding
          if ! git diff --cached --quiet; then
            git commit -m "Update Hyperliquid historical funding audit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
