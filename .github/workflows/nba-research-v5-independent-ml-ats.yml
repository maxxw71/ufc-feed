name: NBA Research V5 Independent ML ATS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/research/discover_method_hunt_v5.py'
      - '.github/workflows/nba-research-v5-independent-ml-ats.yml'

permissions:
  contents: write

concurrency:
  group: nba-research-v5-independent-ml-ats
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test diverse point-in-time moneyline and spread methods
        run: python nba/research/discover_method_hunt_v5.py
      - name: Publish discovery-only results
        shell: bash
        run: |
          set -euo pipefail
          cp nba/research/hunt_v5/hunt_v5_report.json /tmp/nba_hunt_v5_report.json
          git config user.name appwiza-nba-bot
          git config user.email actions@users.noreply.github.com
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            mkdir -p nba/research/hunt_v5
            cp /tmp/nba_hunt_v5_report.json nba/research/hunt_v5/hunt_v5_report.json
            git add nba/research/hunt_v5/hunt_v5_report.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'nba: publish independent ML ATS v5 findings'
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
