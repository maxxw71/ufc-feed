name: NBA Dataset Bootstrap

on:
  workflow_dispatch:
    inputs:
      max_games:
        description: "Optional most-recent game limit per slice (blank = all)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "nba/bootstrap_dataset.py"
      - "nba/integrity_check.py"
      - "nba/build_context.py"
      - "nba/completeness_audit.py"
      - "nba/build_rolling_features.py"
      - "nba/official_crosscheck.py"
      - "nba/schema.json"
      - ".github/workflows/nba-dataset-bootstrap.yml"
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: write

concurrency:
  group: nba-dataset-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Fetch and normalize NBA data
        shell: bash
        run: |
          set -euo pipefail
          LIMIT="${{ github.event.inputs.max_games || '' }}"
          EXTRA=()
          if [[ -n "$LIMIT" ]]; then EXTRA+=(--max-games "$LIMIT"); fi
          python nba/bootstrap_dataset.py "${EXTRA[@]}"

      - name: Integrity checks
        run: python nba/integrity_check.py

      - name: Completed-season completeness audit
        run: python nba/completeness_audit.py

      - name: Build point-in-time schedule context
        run: python nba/build_context.py

      - name: Build point-in-time rolling team/player features
        run: python nba/build_rolling_features.py

      - name: Cross-check current season against NBA official IDs
        run: python nba/official_crosscheck.py

      - name: Commit refreshed NBA dataset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/data nba/bootstrap_status.json nba/integrity_report.json nba/completeness_report.json nba/team_game_context.csv.gz nba/context_summary.json nba/features nba/official_game_id_map.csv.gz nba/official_crosscheck_report.json
          if git diff --cached --quiet; then
            echo "No NBA dataset changes."
            exit 0
          fi
          git commit -m "nba: refresh research dataset"
          git pull --rebase origin main
          git push
