name: NFL coaching everything expansion
on:
  push:
    branches: [main]
    paths:
      - 'scripts/nfl_coaching_everything_expansion.py'
      - '.github/workflows/nfl-coaching-everything-expansion.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Run coaching and staff expansion
        shell: bash
        run: |
          set -Eeuo pipefail
          /home/anestishkurti92/nfl-predictor-v1/venv/bin/python "$GITHUB_WORKSPACE/scripts/nfl_coaching_everything_expansion.py"
      - name: Publish results
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC=/home/appwiza-runner/nfl-context-data/coaching_everything
          DEST="$GITHUB_WORKSPACE/nfl/coaching_everything"
          mkdir -p "$DEST"
          cp "$SRC/summary.json" "$DEST/summary.json"
          cp "$SRC/report.txt" "$DEST/report.txt"
          cp "$SRC/coaching_veto_candidates.csv" "$DEST/coaching_veto_candidates.csv"
          cp "$SRC/new_coaching_methods.csv" "$DEST/new_coaching_methods.csv"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add nfl/coaching_everything
          if ! git diff --cached --quiet; then
            git commit -m 'Update NFL coaching everything research'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
