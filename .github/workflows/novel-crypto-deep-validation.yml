name: Novel crypto candidate deep validation

on:
  push:
    branches: [main]
    paths:
      - 'crypto/research/novel_candidate_deep_validation.py'
      - '.github/workflows/novel-crypto-deep-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novel-crypto-deep-validation
  cancel-in-progress: true

jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy requests
      - run: |
          python crypto/research/novel_candidate_deep_validation.py \
            --mode scan --shard-index ${{ matrix.shard }} --shard-count 4 \
            --sleep 0.10 --out novel_deep_out
      - uses: actions/upload-artifact@v4
        with:
          name: novel-deep-${{ matrix.shard }}
          path: novel_deep_out/
          retention-days: 2

  aggregate:
    needs: replay
    if: always() && needs.replay.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy requests
      - uses: actions/download-artifact@v4
        with:
          pattern: novel-deep-*
          path: novel_deep_shards
          merge-multiple: true
      - run: |
          python crypto/research/novel_candidate_deep_validation.py \
            --mode aggregate --input-dir novel_deep_shards \
            --out crypto/research/results_novel_candidate_deep_validation
      - name: Commit deep validation
        run: |
          git config user.name "appwiza-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crypto/research/results_novel_candidate_deep_validation
          if ! git diff --cached --quiet; then
            git commit -m "Update novel crypto candidate deep validation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
