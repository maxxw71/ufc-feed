name: Point-in-time MA111 SMA350 validation

on:
  push:
    branches: [main]
    paths:
      - 'crypto/research/ma111_sma350_pit_validation.py'
      - '.github/workflows/ma111-sma350-pit-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ma111-sma350-pit-validation
  cancel-in-progress: true

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        venue: [hl,bn]
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy requests
      - run: python crypto/research/ma111_sma350_pit_validation.py --mode scan --venue ${{ matrix.venue }} --days 600 --binance-symbols 160 --shard-index ${{ matrix.shard }} --shard-count 8 --out pit_out
      - uses: actions/upload-artifact@v4
        with:
          name: pit-ma-${{ matrix.venue }}-${{ matrix.shard }}
          path: pit_out/
          retention-days: 2
  aggregate:
    needs: scan
    if: always() && needs.scan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy requests
      - uses: actions/download-artifact@v4
        with:
          pattern: pit-ma-*
          path: pit_shards
          merge-multiple: true
      - run: python crypto/research/ma111_sma350_pit_validation.py --mode aggregate --input-dir pit_shards --out crypto/research/results_ma111_sma350_pit
      - name: Commit validation
        run: |
          git config user.name "appwiza-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crypto/research/results_ma111_sma350_pit
          if ! git diff --cached --quiet; then
            git commit -m "Update point-in-time MA111 SMA350 validation"
            git pull --rebase -X ours origin main || true
            git push origin HEAD:main || true
          fi
