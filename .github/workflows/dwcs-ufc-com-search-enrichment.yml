name: DWCS UFC.com Search Enrichment
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dwcs-ufc-com-search-enrichment.yml'
      - 'dwcs/research/build_ufc_com_search_enrichment.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas requests
      - name: Resolve and fetch official UFC.com fighter profiles
        run: python dwcs/research/build_ufc_com_search_enrichment.py
      - name: Commit results
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add dwcs/research/ufc_com_search_enrichment
          git diff --cached --quiet && exit 0
          git commit -m 'Expand DWCS UFC.com profile coverage via official search'
          git pull --rebase origin main
          git push
