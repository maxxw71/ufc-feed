name: Boxing historical odds structure audit
on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/inspect_historical_odds_snapshot.py'
      - '.github/workflows/boxing-historical-odds-structure.yml'
      - 'boxing/public_reports/HISTORICAL_ODDS_WAYBACK_PILOT.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q beautifulsoup4 lxml
      - run: python boxing/research/inspect_historical_odds_snapshot.py
      - name: Persist structure audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add boxing/public_reports/HISTORICAL_ODDS_WAYBACK_STRUCTURE_AUDIT.json
          if git diff --cached --quiet; then
            echo 'No historical odds structure changes.'
          else
            git commit -m 'Publish historical boxing odds structure audit'
            git pull --rebase origin main
            git push
          fi
