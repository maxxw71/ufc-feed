name: NBA ML001 Practical 5.5 Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nba/research/audit_ml001_def55.py"
      - ".github/workflows/nba-ml001-practical-55.yml"

permissions:
  contents: write

concurrency:
  group: nba-ml001-practical-55
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nba/build_market_features.py
      - run: python nba/research/audit_ml001_def55.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/research/ml001_elite/practical_55_variants.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: audit practical ML001 defensive cap 5.5"
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
