name: MLS Player Manager Enrichment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/mls_player_manager_enrich.py'
      - '.github/workflows/mls-player-manager-enrich.yml'

concurrency:
  group: mls-player-enrich
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  enrich:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Install and build MLS player/manager layer
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          SSH="ssh -i $KEY -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new $HOST"
          ROOT=/home/anestishkurti92/mls-predictor-v1

          cat scripts/mls_player_manager_enrich.py | $SSH 'set -e; D=/home/anestishkurti92/mls-predictor-v1; cat > "$D/mls_player_manager_enrich.py.new"; chmod 0644 "$D/mls_player_manager_enrich.py.new"; mv -f "$D/mls_player_manager_enrich.py.new" "$D/mls_player_manager_enrich.py"'
          $SSH 'set -Eeuo pipefail; cd /home/anestishkurti92/mls-predictor-v1; venv/bin/python -m py_compile mls_player_manager_enrich.py; OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 nice -n 15 timeout 35m venv/bin/python mls_player_manager_enrich.py'

      - name: Pull non-secret player layer audit
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          SSH="ssh -i $KEY -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new $HOST"
          mkdir -p mls/players
          $SSH 'cat /home/anestishkurti92/mls-predictor-v1/reports/player_game_coverage.json' > mls/players/player_game_coverage.json
          $SSH 'cat /home/anestishkurti92/mls-predictor-v1/reports/player_manager_feature_meta.json' > mls/players/player_manager_feature_meta.json
          echo '=== COVERAGE ==='
          cat mls/players/player_game_coverage.json
          echo '=== FEATURE META ==='
          cat mls/players/player_manager_feature_meta.json
          echo '=== SERVER ==='
          $SSH 'du -sh /home/anestishkurti92/mls-predictor-v1; free -h | head -2; uptime'

      - name: Persist player layer audit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add mls/players
          if ! git diff --cached --quiet; then
            git commit -m 'Publish MLS player manager enrichment audit'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
