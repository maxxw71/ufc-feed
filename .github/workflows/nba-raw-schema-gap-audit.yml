name: NBA raw schema gap audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/schema_gap_audit.py'
      - '.github/workflows/nba-raw-schema-gap-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nba/schema_gap_audit.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/research/gap_audit/raw_schema_gap_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: add raw schema gap audit results"
          git pull --rebase origin main
          git push
