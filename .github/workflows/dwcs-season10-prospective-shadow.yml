name: DWCS Season 10 Prospective Shadow Snapshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dwcs-season10-prospective-shadow.yml'
      - 'dwcs/research/snapshot_s10_prospective.py'
  workflow_dispatch:
  schedule:
    - cron: '0 16,20,22,23 * * 2'

permissions:
  contents: write

concurrency:
  group: dwcs-season10-prospective-shadow
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas requests beautifulsoup4
      - name: Capture pre-event frozen-rule snapshot
        run: python dwcs/research/snapshot_s10_prospective.py
      - name: Commit prospective evidence
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add dwcs/research/season10_prospective_snapshots
          git diff --cached --quiet && exit 0
          git commit -m 'Snapshot DWCS Season 10 pre-event shadow signals'
          git pull --rebase origin main
          git push
