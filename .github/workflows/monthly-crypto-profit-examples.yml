name: Monthly crypto profit examples

on:
  push:
    branches: [main]
    paths:
      - 'crypto/research/monthly_profit_examples.py'
      - '.github/workflows/monthly-crypto-profit-examples.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy
      - run: python crypto/research/monthly_profit_examples.py
      - name: Commit outputs
        run: |
          git config user.name "appwiza-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crypto/research/results_monthly_profit_examples
          if ! git diff --cached --quiet; then
            git commit -m "Update monthly crypto profit examples"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
