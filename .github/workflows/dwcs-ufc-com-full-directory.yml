name: DWCS Full UFC.com Directory Enrichment
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dwcs-ufc-com-full-directory.yml'
      - 'dwcs/research/build_ufc_com_full_directory.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas requests beautifulsoup4 rapidfuzz
      - name: Enumerate official UFC directory and enrich DWCS fighters
        run: python dwcs/research/build_ufc_com_full_directory.py
      - name: Commit results
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add dwcs/research/ufc_com_full
          git diff --cached --quiet && exit 0
          git commit -m 'Expand official UFC.com coverage for DWCS fighters'
          git pull --rebase origin main
          git push
