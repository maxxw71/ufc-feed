name: Hosted Appwiza deploy capability probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hosted-appwiza-deploy-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_APPWIZA_SSH_KEY: ${{ secrets.APPWIZA_SSH_KEY != '' }}
      HAS_APPWIZA_VPS_KEY: ${{ secrets.APPWIZA_VPS_KEY != '' }}
      HAS_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY != '' }}
      HAS_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
      HAS_APPWIZA_HOST: ${{ secrets.APPWIZA_HOST != '' }}
      HAS_VPS_HOST: ${{ secrets.VPS_HOST != '' }}
      HAS_APPWIZA_USER: ${{ secrets.APPWIZA_USER != '' }}
      HAS_VPS_USER: ${{ secrets.VPS_USER != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check hosted deploy capability without exposing secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo 'HOSTED APPWIZA DEPLOY CAPABILITY PROBE'
            date -u
            echo "APPWIZA_SSH_KEY=$HAS_APPWIZA_SSH_KEY"
            echo "APPWIZA_VPS_KEY=$HAS_APPWIZA_VPS_KEY"
            echo "VPS_SSH_KEY=$HAS_VPS_SSH_KEY"
            echo "SSH_PRIVATE_KEY=$HAS_SSH_PRIVATE_KEY"
            echo "APPWIZA_HOST=$HAS_APPWIZA_HOST"
            echo "VPS_HOST=$HAS_VPS_HOST"
            echo "APPWIZA_USER=$HAS_APPWIZA_USER"
            echo "VPS_USER=$HAS_VPS_USER"
            echo '--- DNS ---'
            getent ahostsv4 appwiza.com | head -5 || true
            echo '--- TCP 22 ---'
            timeout 5 bash -c '</dev/tcp/appwiza.com/22' && echo APPWIZA_PORT22_OPEN=yes || echo APPWIZA_PORT22_OPEN=no
          } | tee crypto/hosted_deploy_probe.txt
      - name: Commit probe
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add crypto/hosted_deploy_probe.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record hosted Appwiza deploy capability"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
