name: Live crypto method failure forensics

on:
  push:
    branches: [main]
    paths:
      - 'crypto/research/live_method_failure_forensics.py'
      - '.github/workflows/live-crypto-method-failure-forensics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy
      - run: python crypto/research/live_method_failure_forensics.py
      - name: Commit results
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add crypto/research/results_live_method_failure_forensics
          if ! git diff --cached --quiet; then
            git commit -m "Update live crypto method failure forensics"
            git pull --rebase -X ours origin main || true
            git push origin HEAD:main || true
          fi
