name: Boxing public download probe

on:
  push:
    paths:
      - '.github/workflows/boxing-public-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe boxing page and download links
        run: |
          python - <<'PY'
          import html,re,urllib.request,json
          from urllib.parse import urljoin
          url='https://appwiza.com/sports/boxing/'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 AppwizaResearchProbe/1.0'})
          out={'url':url,'status':'unknown','links':[],'error':None}
          try:
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=r.read(2_000_000).decode('utf-8','replace')
                  out['status']=getattr(r,'status',200)
                  links=[]
                  for x in re.findall(r'href=[\"\']([^\"\']+)',body,re.I):
                      u=urljoin(url,html.unescape(x))
                      if 'boxing' in u.lower() or '/sports/downloads/' in u.lower() or u.lower().endswith(('.zip','.csv','.json')):
                          links.append(u)
                  out['links']=sorted(set(links))
                  out['title']=(re.search(r'<title[^>]*>(.*?)</title>',body,re.I|re.S).group(1).strip() if re.search(r'<title[^>]*>(.*?)</title>',body,re.I|re.S) else None)
                  out['body_prefix']=re.sub(r'\s+',' ',body[:500])
          except Exception as e:
              out['status']='error';out['error']=repr(e)
          open('boxing/public_download_probe.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Commit probe result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add boxing/public_download_probe.json
          if git diff --cached --quiet; then
            echo 'No probe changes.'
          else
            git commit -m 'Update boxing public download probe'
            git push
          fi
