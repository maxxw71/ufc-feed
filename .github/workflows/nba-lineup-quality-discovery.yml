name: NBA lineup quality discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/build_lineup_quality_pregame.py'
      - 'nba/research/discover_lineup_quality.py'
      - '.github/workflows/nba-lineup-quality-discovery.yml'
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nba/build_lineup_quality_pregame.py
      - run: python nba/research/discover_lineup_quality.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email actions@users.noreply.github.com
          git add nba/features/lineup_quality_pregame.csv.gz nba/features/lineup_quality_pregame_summary.json nba/research/lineup_quality
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: add lineup quality discovery results"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
