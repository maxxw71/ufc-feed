name: Hyperliquid deduped exit audit

on:
  push:
    branches: [main]
    paths:
      - 'crypto/research/analyze_hyperliquid_exit_quality.py'
      - '.github/workflows/hyperliquid-exit-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy
      - run: python crypto/research/analyze_hyperliquid_exit_quality.py
      - name: Commit audit
        run: |
          git config user.name "appwiza-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crypto/research/results_hyperliquid_all_pairs/exit_quality_deduped.txt
          if ! git diff --cached --quiet; then
            git commit -m "Add deduped Hyperliquid exit audit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
