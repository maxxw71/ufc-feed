name: NBA style totals discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/features/team_style_rolling.csv.gz'
      - 'nba/research/discover_style_totals.py'
      - 'nba/research/audit_style_totals_001.py'
      - '.github/workflows/nba-style-totals-discovery.yml'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nba/build_team_style_rolling.py
      - run: python nba/research/discover_style_totals.py
      - run: python nba/research/audit_style_totals_001.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/features/team_style_rolling.csv.gz nba/features/team_style_rolling_summary.json nba/research/style_totals
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: add style totals discovery results"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
