name: Boxing WBA Existing Reach Audit
on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/audit_wba_existing_reach.py'
      - '.github/workflows/boxing-wba-existing-reach-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q beautifulsoup4 lxml
      - run: python boxing/research/audit_wba_existing_reach.py
      - name: Persist WBA reach audit
        shell: bash
        run: |
          set -Eeuo pipefail
          cp boxing/profile_supplements/wba_existing_reach_audit.json /tmp/wba_existing_reach_audit.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/wba_existing_reach_audit.json boxing/profile_supplements/
            git add boxing/profile_supplements/wba_existing_reach_audit.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish WBA existing reach audit'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
