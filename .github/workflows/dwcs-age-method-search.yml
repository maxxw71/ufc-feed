name: DWCS Age Method Search
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dwcs-age-method-search.yml'
      - 'dwcs/research/age_enrichment/**'
      - 'dwcs/research/regional_history/**'
      - 'dwcs/research/historical_odds/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas numpy
      - name: Search age-based DWCS methods
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd, numpy as np, re
          root=Path('.'); out=root/'dwcs/research/age_methods'; out.mkdir(parents=True,exist_ok=True)
          a=pd.read_csv(root/'dwcs/research/age_enrichment/fight_age_features.csv',low_memory=False)
          o=pd.read_csv(root/'dwcs/research/historical_odds/historical_odds.csv',low_memory=False)
          r=pd.read_csv(root/'dwcs/research/regional_history/dwcs_prefight_regional_features.csv',low_memory=False)
          a['event_date']=pd.to_datetime(a.event_date,errors='coerce').dt.normalize()
          o['event_date']=pd.to_datetime(o.event_date,errors='coerce').dt.normalize()
          r['dwcs_date']=pd.to_datetime(r.dwcs_date,errors='coerce').dt.normalize()
          def norm(s):
              s=str(s or '').lower().replace('’',"'").replace('-',' ')
              s=re.sub(r'\b(jr|sr|ii|iii|iv)\b',' ',s)
              s=re.sub(r'[^a-z0-9]+',' ',s)
              return re.sub(r'\s+',' ',s).strip()
          amap={}
          for _,x in a.iterrows():
              amap[(x.event_date,tuple(sorted([norm(x.fighter_a),norm(x.fighter_b)])))]=x
          rm={(x.dwcs_date,norm(x.fighter)):x for _,x in r.iterrows()}
          rows=[]
          for _,x in o.iterrows():
              key=(x.event_date,tuple(sorted([norm(x.fighter_a),norm(x.fighter_b)])))
              ag=amap.get(key)
              if ag is None: continue
              sel=norm(x.selected_profile); opp=norm(x.opponent)
              if sel==norm(ag.fighter_a):
                  sel_age,opp_age=ag.a_age,ag.b_age
              elif sel==norm(ag.fighter_b):
                  sel_age,opp_age=ag.b_age,ag.a_age
              else: continue
              z=x.to_dict()
              z['sel_age']=sel_age; z['opp_age']=opp_age; z['age_adv']=opp_age-sel_age
              ra=rm.get((x.event_date,sel)); rb=rm.get((x.event_date,opp))
              for c in ['prior_fights','prior_win_pct','prior_finish_rate','prior_avg_opponent_win_pct']:
                  z['gap_'+c]=np.nan
                  if ra is not None and rb is not None:
                      try:z['gap_'+c]=float(getattr(ra,c))-float(getattr(rb,c))
                      except: pass
              rows.append(z)
          d=pd.DataFrame(rows)
          for c in ['selected_close','selected_open','age_adv','sel_age','opp_age','gap_prior_fights','gap_prior_win_pct','gap_prior_finish_rate','gap_prior_avg_opponent_win_pct']:
              d[c]=pd.to_numeric(d[c],errors='coerce')
          d['selected_won']=d.selected_won.astype(str).str.lower().map({'true':True,'1':True,'false':False,'0':False})
          def profit(odds,won):
              if pd.isna(odds):return np.nan
              return -100 if not won else (10000/abs(odds) if odds<0 else odds)
          d['profit100']=[profit(o,w) for o,w in zip(d.selected_close,d.selected_won)]
          res=[]
          def add(fam,rule,mask):
              g=d[mask.fillna(False)&d.selected_won.notna()&d.profit100.notna()].copy()
              if len(g)<10:return
              n=len(g); w=int(g.selected_won.sum()); pl=float(g.profit100.sum())
              ss=[]
              for s,sg in g.groupby('season'):
                  ss.append((int(s),len(sg),float(sg.selected_won.mean()),float(sg.profit100.sum()/(100*len(sg)))))
              res.append({'family':fam,'rule':rule,'n':n,'wins':w,'win_rate':w/n,'roi':pl/(100*n),
                          'seasons':len(ss),'profitable_seasons':sum(x[3]>0 for x in ss),
                          'worst_season_roi':min(x[3] for x in ss),
                          'season_detail':'|'.join(f'{s}:{nn}:{wr:.3f}:{roi:.3f}' for s,nn,wr,roi in ss)})
          # pure younger edge
          for g in [1,2,3,4,5,6,7,8,10]:
              add('YOUTH_EDGE',f'younger by >= {g}y',d.age_adv>=g)
          # age bands
          for maxage in [23,24,25,26,27,28,29,30]:
              add('YOUNG_ABS',f'selected age <= {maxage}',d.sel_age<=maxage)
          # price + age
          for g in [2,3,4,5,6]:
              for maxfav in [150,200,250,300,400]:
                  add('YOUTH_FAV',f'age>={g}y; -{maxfav}..-100',(d.age_adv>=g)&(d.selected_close<0)&(d.selected_close>=-maxfav))
              for dogmax in [150,200,250,300]:
                  add('YOUTH_DOG',f'age>={g}y; +100..+{dogmax}',(d.age_adv>=g)&(d.selected_close>=100)&(d.selected_close<=dogmax))
          # age + experience
          for ag in [2,3,4,5]:
              for eg in [2,4,6]:
                  add('YOUTH_PLUS_EXP',f'age>={ag}y; exp>={eg}',(d.age_adv>=ag)&(d.gap_prior_fights>=eg))
          # age + opponent quality
          for ag in [2,3,4,5]:
              for oq in [.05,.10,.15,.20]:
                  add('YOUTH_PLUS_OPPQUAL',f'age>={ag}y; oppqual>={oq:.2f}',(d.age_adv>=ag)&(d.gap_prior_avg_opponent_win_pct>=oq))
          # age + win-rate edge
          for ag in [2,3,4]:
              for wg in [.10,.15,.20,.25]:
                  add('YOUTH_PLUS_WIN',f'age>={ag}y; winpct>={wg:.2f}',(d.age_adv>=ag)&(d.gap_prior_win_pct>=wg))
          rr=pd.DataFrame(res)
          if len(rr): rr=rr.sort_values(['roi','win_rate','n'],ascending=[False,False,False])
          rr.to_csv(out/'all_rules.csv',index=False)
          robust=rr[(rr.n>=20)&(rr.roi>0)&(rr.seasons>=4)&(rr.profitable_seasons>=3)] if len(rr) else rr
          robust.to_csv(out/'robust_candidates.csv',index=False)
          lines=['DWCS AGE METHOD SEARCH','='*96,f'Age+price matched fights: {len(d)}','',
                 'ROBUST AGE CANDIDATES','-'*96]
          if robust.empty: lines.append('None.')
          else:
              for _,z in robust.head(30).iterrows():
                  lines.append(f"{z.family:<22} n={int(z.n):3d} win={z.win_rate*100:5.1f}% ROI={z.roi*100:+6.1f}% "
                               f"prof={int(z.profitable_seasons)}/{int(z.seasons)} worst={z.worst_season_roi*100:+6.1f}% | {z.rule}")
          lines+=['','TOP 30 BY ROI','-'*96]
          for _,z in rr.head(30).iterrows():
              lines.append(f"{z.family:<22} n={int(z.n):3d} win={z.win_rate*100:5.1f}% ROI={z.roi*100:+6.1f}% | {z.rule}")
          (out/'report.txt').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
      - name: Commit age research
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add dwcs/research/age_methods
          git diff --cached --quiet && exit 0
          git commit -m 'Add DWCS age method search'
          git pull --rebase origin main
          git push
