name: DWCS Regional History V2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dwcs-regional-history-v2.yml'
      - 'dwcs/research/apply_regional_identity_recovery.py'
      - 'dwcs/research/regional_identity_recovery_v2/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 35
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas numpy duckdb requests
      - name: Download global MMA archive
        run: |
          mkdir -p /tmp/mmadb
          python - <<'PY'
          import io,zipfile,requests
          r=requests.get('https://www.kaggle.com/api/v1/datasets/download/leandroiber/mmastats',timeout=120)
          r.raise_for_status()
          zipfile.ZipFile(io.BytesIO(r.content)).extractall('/tmp/mmadb')
          PY
      - name: Apply recovered aliases to regional feature layer
        run: python dwcs/research/apply_regional_identity_recovery.py
      - name: Commit
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add dwcs/research/regional_history_v2
          git diff --cached --quiet && exit 0
          git commit -m 'Build recovered DWCS regional history v2'
          git pull --rebase origin main
          git push
