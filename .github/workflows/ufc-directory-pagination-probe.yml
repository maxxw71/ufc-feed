name: UFC Directory Pagination Probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ufc-directory-pagination-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - name: Probe UFC directory pagination via relay
        run: |
          python - <<'PY'
          import requests,re,json
          from pathlib import Path
          out=Path('dwcs/research/ufc_directory_pagination_probe');out.mkdir(parents=True,exist_ok=True)
          rows=[]
          for p in [0,1,2,3,10,50,100,200]:
            u=f'https://r.jina.ai/https://www.ufc.com/athletes/all?page={p}'
            try:
              r=requests.get(u,headers={'User-Agent':'ufc-feed/1.1','Accept':'text/plain'},timeout=45)
              links=re.findall(r'\[Athlete Profile\]\((https://www\.ufc\.com/athlete/[^)]+)\)',r.text,re.I)
              rows.append({'page':p,'status':r.status_code,'chars':len(r.text),'n_links':len(links),'links':links[:20]})
            except Exception as e: rows.append({'page':p,'error':repr(e)})
          (out/'results.json').write_text(json.dumps(rows,indent=2))
          print(json.dumps(rows,indent=2))
          PY
      - name: Commit
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add dwcs/research/ufc_directory_pagination_probe
          git commit -m 'Probe UFC athlete directory pagination' || exit 0
          git pull --rebase origin main
          git push
