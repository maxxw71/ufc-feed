name: NBA travel method discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/travel/geocode_venues.py'
      - 'nba/build_travel_context.py'
      - 'nba/research/discover_travel.py'
      - '.github/workflows/nba-travel-discovery.yml'

permissions:
  contents: write

jobs:
  discover:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet timezonefinder
      - run: python nba/travel/geocode_venues.py
      - run: python nba/build_travel_context.py
      - run: python nba/research/discover_travel.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/travel/venue_geocode_cache.json nba/travel/venue_geocode_summary.json nba/features/travel_pregame.csv.gz nba/features/travel_pregame_summary.json nba/research/travel
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: add travel context and discovery results"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
