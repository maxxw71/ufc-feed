name: Next crypto method candidates

on:
  push:
    branches: [main]
    paths:
      - 'crypto/research/next_method_candidates.py'
      - '.github/workflows/next-crypto-method-candidates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy
      - run: python crypto/research/next_method_candidates.py
      - name: Commit results
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add crypto/research/results_next_method_candidates
          if ! git diff --cached --quiet; then
            git commit -m "Update next crypto method candidates"
            git pull --rebase -X ours origin main || true
            git push origin HEAD:main || true
          fi
