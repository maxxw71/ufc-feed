name: Ranked capacity bankroll replay

on:
  push:
    branches: [main]
    paths:
      - 'crypto/research/ranked_capacity_bankroll.py'
      - '.github/workflows/ranked-capacity-bankroll.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy requests
      - run: python crypto/research/ranked_capacity_bankroll.py
      - name: Commit outputs
        run: |
          git config user.name "appwiza-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crypto/research/results_ranked_capacity_bankroll
          if ! git diff --cached --quiet; then
            git commit -m "Update ranked capacity bankroll replay"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
