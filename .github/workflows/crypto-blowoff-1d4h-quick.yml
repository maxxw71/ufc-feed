name: Crypto 1D 4H quick targeted research

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crypto-blowoff-1d4h-quick.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy requests
      - name: Run targeted quick study
        run: |
          python crypto/research/blowoff_rebound_1d4h.py             --symbols 50             --days 700             --quick             --out crypto/research/results_1d4h_quick
      - name: Commit outputs
        run: |
          git config user.name "appwiza-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crypto/research/results_1d4h_quick
          if ! git diff --cached --quiet; then
            git commit -m "Update quick targeted 1D 4H crypto research"
            git push origin HEAD:main
          fi
