name: Appwiza sync boxing research code

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/appwiza-boxing-sync.yml'
      - 'boxing/collectors/punch_collect.py'
      - 'boxing/research/build_punch_profiles.py'
      - 'boxing/research/round_archive.py'
      - 'boxing/methods.json'

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'maxxw71/ufc-feed' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Atomically sync reviewed boxing research code
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT=/home/anestishkurti92/boxing-research
          test -d "$ROOT"
          python3 -m py_compile boxing/collectors/punch_collect.py boxing/research/build_punch_profiles.py boxing/research/round_archive.py
          cp boxing/collectors/punch_collect.py "$ROOT/punch_collect.py.new"
          mv "$ROOT/punch_collect.py.new" "$ROOT/punch_collect.py"
          cp boxing/research/build_punch_profiles.py "$ROOT/build_punch_profiles.py.new"
          mv "$ROOT/build_punch_profiles.py.new" "$ROOT/build_punch_profiles.py"
          cp boxing/research/round_archive.py "$ROOT/round_archive.py.new"
          mv "$ROOT/round_archive.py.new" "$ROOT/round_archive.py"
          cp boxing/methods.json "$ROOT/methods.json.new"
          mv "$ROOT/methods.json.new" "$ROOT/methods.json"
          echo 'SYNCED punch_collect.py build_punch_profiles.py round_archive.py methods.json'
          grep -n "ROOT_PAGES=" "$ROOT/round_archive.py"
          grep -n "B1_AGE_FORM_DEV_SELECTED" "$ROOT/methods.json"
