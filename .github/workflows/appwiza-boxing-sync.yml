name: Appwiza sync boxing research code

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/appwiza-boxing-sync.yml'
      - 'boxing/collectors/punch_collect.py'
      - 'boxing/research/build_punch_profiles.py'
      - 'boxing/research/round_archive.py'
      - 'boxing/research/apply_supplemental_careers.py'
      - 'boxing/research/rebuild_identity_links.py'
      - 'boxing/research/match_prices.py'
      - 'boxing/supplemental_careers/verified_priced_careers.jsonl'
      - 'boxing/methods.json'

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'maxxw71/ufc-feed' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Atomically sync reviewed boxing research code
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT=/home/anestishkurti92/boxing-research
          test -d "$ROOT"
          python3 -m py_compile \
            boxing/collectors/punch_collect.py \
            boxing/research/build_punch_profiles.py \
            boxing/research/round_archive.py \
            boxing/research/apply_supplemental_careers.py \
            boxing/research/rebuild_identity_links.py \
            boxing/research/match_prices.py
          for pair in \
            'boxing/collectors/punch_collect.py:punch_collect.py' \
            'boxing/research/build_punch_profiles.py:build_punch_profiles.py' \
            'boxing/research/round_archive.py:round_archive.py' \
            'boxing/research/apply_supplemental_careers.py:apply_supplemental_careers.py' \
            'boxing/research/rebuild_identity_links.py:rebuild_identity_links.py' \
            'boxing/research/match_prices.py:match_prices.py'; do
            src=${pair%%:*}; dst=${pair#*:}
            cp "$src" "$ROOT/$dst.new"
            mv "$ROOT/$dst.new" "$ROOT/$dst"
          done
          mkdir -p "$ROOT/supplemental_careers"
          cp boxing/supplemental_careers/verified_priced_careers.jsonl "$ROOT/supplemental_careers/verified_priced_careers.jsonl.new"
          mv "$ROOT/supplemental_careers/verified_priced_careers.jsonl.new" "$ROOT/supplemental_careers/verified_priced_careers.jsonl"
          cp boxing/methods.json "$ROOT/methods.json.new"
          mv "$ROOT/methods.json.new" "$ROOT/methods.json"
          echo 'SYNCED boxing collectors, supplement careers, identity and price matcher'
          grep -n "eligible_bout_sources" "$ROOT/match_prices.py"
          grep -n "ALLOWED_SOURCES" "$ROOT/rebuild_identity_links.py"
