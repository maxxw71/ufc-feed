name: DWCS Regional Identity Recovery V2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dwcs-regional-identity-recovery-v2.yml'
      - 'dwcs/research/recover_regional_by_event_opponent.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 35
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas duckdb requests rapidfuzz
      - name: Download global MMA archive
        run: |
          mkdir -p /tmp/mmadb
          python - <<'PY'
          import io,zipfile,requests
          r=requests.get('https://www.kaggle.com/api/v1/datasets/download/leandroiber/mmastats',timeout=120)
          r.raise_for_status()
          zipfile.ZipFile(io.BytesIO(r.content)).extractall('/tmp/mmadb')
          PY
      - name: Recover regional identities using DWCS date and opponent
        run: python dwcs/research/recover_regional_by_event_opponent.py
      - name: Commit recovery
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add dwcs/research/regional_identity_recovery_v2
          git diff --cached --quiet && exit 0
          git commit -m 'Recover DWCS regional identities by event and opponent'
          git pull --rebase origin main
          git push
