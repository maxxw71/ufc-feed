name: NBA Research Feature Refresh

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - NBA Dataset Bootstrap
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "nba/data/**"
      - "nba/availability/**"
      - "nba/rosters/**"
      - "nba/players/backfill_player_profiles.py"
      - "nba/build_context.py"
      - "nba/build_rolling_features.py"
      - "nba/build_pregame_strength.py"
      - "nba/build_game_flow_features.py"
      - "nba/build_availability_impact.py"
      - "nba/build_manifest.py"
      - "nba/build_market_features.py"
      - "nba/build_player_workload.py"
      - "nba/market/historical/**"

permissions:
  contents: write

concurrency:
  group: nba-research-generated-state
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync latest main before feature build
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
      - run: python -m pip install --upgrade requests

      - name: Commit research feature refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python nba/build_context.py
            python nba/build_rolling_features.py
            python nba/build_pregame_strength.py
            python nba/build_game_flow_features.py
            python nba/players/backfill_player_profiles.py
            python nba/build_availability_impact.py
            python nba/build_market_features.py
            python nba/build_player_workload.py
            python nba/build_manifest.py
            git add nba/features nba/players nba/dataset_manifest.json nba/team_game_context.csv.gz nba/context_summary.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "nba: refresh derived research features"
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
