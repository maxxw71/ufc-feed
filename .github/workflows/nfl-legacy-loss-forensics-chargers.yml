name: NFL legacy loss forensics Chargers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/nfl_legacy_loss_forensics_chargers.py'
permissions:
  contents: write
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Run loss forensics
        shell: bash
        run: |
          set -Eeuo pipefail
          /home/anestishkurti92/nfl-predictor-v1/venv/bin/python "$GITHUB_WORKSPACE/scripts/nfl_legacy_loss_forensics_chargers.py"
      - name: Publish
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC=/home/appwiza-runner/nfl-context-data/legacy_loss_forensics_chargers
          DEST="$GITHUB_WORKSPACE/nfl/legacy_loss_forensics_chargers"
          mkdir -p "$DEST"
          cp "$SRC"/* "$DEST"/
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add nfl/legacy_loss_forensics_chargers
          if ! git diff --cached --quiet; then
            git commit -m 'Update NFL legacy loss forensics Chargers audit'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
