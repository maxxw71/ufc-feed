name: UFC Core Rules Snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ufc-core-rules-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Capture live watcher core rules
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          mkdir -p ufc_core_rules_snapshot
          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST"             "nl -ba /home/anestishkurti92/ufc-predictor-v1/ufc_email_watcher.py | sed -n '300,900p'"             > ufc_core_rules_snapshot/report.txt
          cat ufc_core_rules_snapshot/report.txt
      - name: Commit snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ufc_core_rules_snapshot/report.txt
          git diff --cached --quiet && exit 0
          git commit -m "Snapshot UFC core live rules"
          git push
