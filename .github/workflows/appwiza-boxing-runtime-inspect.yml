name: Appwiza boxing runtime inspect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/appwiza-boxing-runtime-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'maxxw71/ufc-feed' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect boxing runtime safely
        shell: bash
        run: |
          set +e
          echo '=== SERVICE ==='
          systemctl is-active boxing-archive.service 2>/dev/null || true
          systemctl cat boxing-archive.service 2>/dev/null | head -120 || true
          echo '=== PROCESSES ==='
          ps -eo pid,etime,cmd | grep -E '[b]oxing|[p]unch_collect|[c]areers.py' | head -80 || true
          echo '=== RESEARCH ROOT ==='
          ls -lah /home/anestishkurti92/boxing-research 2>/dev/null | head -100 || true
          echo '=== SQLITE FILES ==='
          find /home/anestishkurti92/boxing-research -maxdepth 2 -type f -name '*.sqlite3' -printf '%p %s bytes\n' 2>/dev/null | head -30 || true
          echo '=== PUBLIC BOXING FILES ==='
          find /srv/appwiza-sports/public -maxdepth 5 -type f \( -iname '*boxing*' -o -iname '*research*' -o -iname '*.zip' \) -printf '%p %s bytes %TY-%Tm-%Td %TH:%TM:%TS\n' 2>/dev/null | head -120 || true
          echo '=== ARCHIVE/EXPORT SCRIPTS ==='
          for f in /home/anestishkurti92/boxing-research/*archive*.sh /home/anestishkurti92/boxing-research/*export*.sh /home/anestishkurti92/boxing-research/finish_data_batch.sh; do
            [ -f "$f" ] || continue
            echo "----- $f -----"
            sed -n '1,260p' "$f"
          done
          echo '=== PUBLIC ZIP SCHEMA ==='
          TMPD=$(mktemp -d)
          if unzip -qq /srv/appwiza-sports/public/downloads/boxing/research-database.zip -d "$TMPD" 2>/dev/null; then
            cat "$TMPD/TABLE_COUNTS.json" 2>/dev/null || true
            PUBDB=$(find "$TMPD" -maxdepth 1 -name '*.sqlite3' | head -1)
            [ -n "$PUBDB" ] && python3 - "$PUBDB" <<'PY'
import sqlite3,sys,json
p=sys.argv[1];d=sqlite3.connect(f'file:{p}?mode=ro',uri=True)
tables=[r[0] for r in d.execute("select name from sqlite_master where type='table' order by name")]
print(json.dumps({'tables':tables,'counts':{t:d.execute(f'select count(*) from "{t}"').fetchone()[0] for t in tables}},sort_keys=True))
PY
          fi
          rm -rf "$TMPD"
          echo '=== LIVE TABLE COUNTS ==='
          python3 - <<'PY'
import sqlite3,json
p='/home/anestishkurti92/boxing-research/boxing.sqlite3';d=sqlite3.connect(f'file:{p}?mode=ro',uri=True)
tables=[r[0] for r in d.execute("select name from sqlite_master where type='table' order by name")]
print(json.dumps({'tables':tables,'counts':{t:d.execute(f'select count(*) from "{t}"').fetchone()[0] for t in tables}},sort_keys=True))
PY
          echo '=== PUNCH COUNTS ==='
          python3 - <<'PY'
          import os,sqlite3,glob
          for p in glob.glob('/home/anestishkurti92/boxing-research/**/*.sqlite3',recursive=True):
              try:
                  d=sqlite3.connect(f'file:{p}?mode=ro',uri=True,timeout=5)
                  tables={r[0] for r in d.execute("select name from sqlite_master where type='table'")}
                  if 'punch_reports' not in tables: continue
                  def n(t):
                      return d.execute(f'select count(*) from {t}').fetchone()[0] if t in tables else None
                  print(p,{'punch_reports':n('punch_reports'),'round_punches':n('round_punches'),'fight_punch_totals':n('fight_punch_totals'),'historical_punch_observations':n('historical_punch_observations')})
              except Exception as e: print('ERR',p,e)
          PY
