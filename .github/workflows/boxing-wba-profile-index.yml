name: Boxing WBA Profile Identity Index

on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/index_wba_profiles.py'
      - '.github/workflows/boxing-wba-profile-index.yml'
  workflow_dispatch:

concurrency:
  group: boxing-wba-profile-index
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4 lxml
      - name: Build explicit-link WBA profile index
        run: python boxing/research/index_wba_profiles.py --limit 1500 --sleep 0.12
      - name: Persist WBA identity index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add boxing/profile_supplements/wba_profile_index.json
          if git diff --cached --quiet; then
            echo 'No WBA identity-index changes.'
          else
            git commit -m 'Update official WBA boxer identity index'
            git pull --rebase origin main
            git push
          fi
