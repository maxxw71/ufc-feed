name: NBA Signal Results

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/live/settle_scanner_signals.py'
      - '.github/workflows/nba-signal-results.yml'
  schedule:
    - cron: '55 * * * *'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade requests
      - run: python nba/live/settle_scanner_signals.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name appwiza-nba-bot
          git config user.email actions@users.noreply.github.com
          git add nba/scanner/settlement_latest.json
          if [[ -f nba/scanner/settlements.jsonl ]]; then
            git add nba/scanner/settlements.jsonl
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'nba: update signal results'
          git pull --rebase origin main
          git push