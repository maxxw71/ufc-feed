name: DWCS Missing Odds Recovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dwcs-missing-odds-recovery.yml'
      - 'dwcs/research/recover_bfo_missing.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas requests beautifulsoup4
      - name: Recover missing BestFightOdds rows
        run: python dwcs/research/recover_bfo_missing.py
      - name: Commit recovery
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add dwcs/research/historical_odds_recovery
          git diff --cached --quiet && exit 0
          git commit -m 'Recover missing DWCS historical odds'
          git pull --rebase origin main
          git push
