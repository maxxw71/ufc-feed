name: DWCS Official UFC Historical Enrichment
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dwcs-official-ufc-history.yml'
      - 'dwcs/research/build_official_ufc_history.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 40
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas numpy requests
      - name: Build official UFC/UFCStats point-in-time snapshots
        run: python dwcs/research/build_official_ufc_history.py
      - name: Commit official UFC enrichment
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add dwcs/research/official_ufc_history
          git diff --cached --quiet && exit 0
          git commit -m 'Add official UFC point-in-time DWCS history'
          git pull --rebase origin main
          git push
