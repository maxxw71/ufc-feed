name: NFL hosted coordinator scrape

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/nfl_scrape_coordinators_hosted.py'
      - '.github/workflows/nfl-hosted-coordinator-scrape.yml'

permissions:
  contents: write

concurrency:
  group: nfl-hosted-coordinator-scrape
  cancel-in-progress: true

jobs:
  scrape:
    if: github.repository == 'maxxw71/ufc-feed' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install -q pandas lxml requests
      - name: Collect 2006-2026 coordinators
        run: python scripts/nfl_scrape_coordinators_hosted.py
      - name: Publish coordinator table
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'appwiza-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/nfl/coordinator_history_pfr_2006_2026.csv
          if git diff --cached --quiet; then
            echo 'No coordinator data changes.'
            exit 0
          fi
          git commit -m 'Update NFL coordinator history'
          git pull --rebase origin main
          git push origin HEAD:main
