name: NBA Injury Direct Repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/repair_official_injury_downloads.py'
      - '.github/workflows/nba-injury-direct-repair.yml'

permissions:
  contents: write

concurrency:
  group: nba-injury-direct-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pypdf
      - run: python nba/repair_official_injury_downloads.py --season 2022-23 --sleep 0.12
      - name: Publish repaired season snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name appwiza-nba-bot
          git config user.email actions@users.noreply.github.com
          SNAP=/tmp/nba_2022_23_repaired
          rm -rf "$SNAP"
          cp -a nba/availability/historical_by_season/2022_23 "$SNAP"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            rm -rf nba/availability/historical_by_season/2022_23
            mkdir -p nba/availability/historical_by_season
            cp -a "$SNAP" nba/availability/historical_by_season/2022_23
            git add nba/availability/historical_by_season/2022_23
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "nba: repair 2022-23 official injury text"
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
