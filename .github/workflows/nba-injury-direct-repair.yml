name: NBA Injury Direct Repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/repair_official_injury_downloads.py'
      - '.github/workflows/nba-injury-direct-repair.yml'

permissions:
  contents: write

concurrency:
  group: nba-injury-direct-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pypdf
      - run: python nba/repair_official_injury_downloads.py --season 2022-23 --sleep 0.12
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name appwiza-nba-bot
          git config user.email actions@users.noreply.github.com
          git add nba/availability/historical_by_season/2022_23
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: repair 2022-23 official injury text"
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 4
          done
          exit 1
