name: Cross-venue crypto confirmation

on:
  push:
    branches: [main]
    paths:
      - 'crypto/research/crossvenue_confirmation.py'
      - '.github/workflows/crossvenue-crypto-confirmation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy
      - run: python crypto/research/crossvenue_confirmation.py
      - name: Commit outputs
        run: |
          git config user.name "appwiza-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crypto/research/results_crossvenue_confirmation
          if ! git diff --cached --quiet; then
            git commit -m "Update cross-venue crypto confirmation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
