name: NFL context data audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nfl-context-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'maxxw71/ufc-feed' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit NFL coach player market context data
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT=/home/anestishkurti92/nfl-predictor-v1
          test -x "$ROOT/venv/bin/python"
          test -d "$ROOT/data/raw"
          cd "$ROOT"
          NFL_ROOT="$ROOT" venv/bin/python - <<'PY'
          from pathlib import Path
          import json, os
          import pandas as pd
          root=Path(os.environ["NFL_ROOT"])/"data"/"raw"
          names=[
            "schedules_2006_2026.parquet",
            "team_weekly_2006_2026.parquet",
            "injuries_2009_2026.parquet",
            "snap_counts_2012_2026.parquet",
            "weekly_rosters_2006_2026.parquet",
            "ngs_passing_2016_2026.parquet",
            "ngs_rushing_2016_2026.parquet",
            "ngs_receiving_2016_2026.parquet",
            "pfr_adv_def_2018_2026.parquet",
            "pfr_adv_pass_2018_2026.parquet",
          ]
          out={}
          for name in names:
            p=root/name
            if not p.exists():
              out[name]={"present":False}; continue
            df=pd.read_parquet(p)
            rec={"present":True,"rows":len(df),"columns":list(df.columns)}
            if "season" in df.columns:
              s=pd.to_numeric(df.season,errors="coerce")
              rec["season_min"]=int(s.min()) if s.notna().any() else None
              rec["season_max"]=int(s.max()) if s.notna().any() else None
              z=df[s.isin([2025,2026])].head(5)
              rec["sample_2025_26"]=z.astype(object).where(pd.notna(z),None).to_dict("records")
            else:
              z=df.head(5)
              rec["sample"]=z.astype(object).where(pd.notna(z),None).to_dict("records")
            out[name]=rec
          print(json.dumps(out,indent=2,default=str))
          PY
