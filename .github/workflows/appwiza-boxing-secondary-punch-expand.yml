name: Appwiza boxing secondary punch expansion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/appwiza-boxing-secondary-punch-expand.yml'

permissions:
  contents: read

jobs:
  expand:
    if: github.repository == 'maxxw71/ufc-feed' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Expand secondary published punch evidence safely
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT=/home/anestishkurti92/boxing-research
          cd "$ROOT"
          test -x venv/bin/python
          test -f boxing.sqlite3
          test -f round_archive.py
          [ "$(systemctl is-active boxing-archive.service 2>/dev/null || true)" != active ] || { echo 'boxing archive service active; refusing concurrent write'; exit 2; }
          available=$(df -Pk . | awk 'NR==2 {print $4}')
          [ "$available" -ge 2097152 ] || { echo 'Less than 2 GiB free; refusing collection'; exit 3; }
          exec 6>archive-drain.lock; flock -n 6 || { echo 'archive lock busy'; exit 4; }
          exec 7>data-enrichment.lock; flock -n 7 || { echo 'enrichment lock busy'; exit 5; }
          exec 9>continuation.lock; flock -n 9 || { echo 'continuation lock busy'; exit 6; }
          venv/bin/python - <<'PY'
          import sqlite3,json
          d=sqlite3.connect('boxing.sqlite3')
          tabs={r[0] for r in d.execute("select name from sqlite_master where type='table'")}
          def n(t):return d.execute(f'select count(*) from {t}').fetchone()[0] if t in tabs else 0
          print('BEFORE',json.dumps({t:n(t) for t in ['round_evidence_pages','secondary_round_punches','secondary_fight_punch_totals']}))
          PY
          nice -n 15 venv/bin/python -u round_archive.py --pages 120 | tee ROUND_ARCHIVE_EXPAND.latest.log
          venv/bin/python - <<'PY'
          import sqlite3,json,datetime
          d=sqlite3.connect('boxing.sqlite3')
          tabs={r[0] for r in d.execute("select name from sqlite_master where type='table'")}
          def n(t):return d.execute(f'select count(*) from {t}').fetchone()[0] if t in tabs else 0
          out={t:n(t) for t in ['round_evidence_pages','secondary_round_punches','secondary_fight_punch_totals']}
          out['completed_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          open('SECONDARY_PUNCH_EXPAND_STATUS.json','w').write(json.dumps(out,indent=2))
          print('AFTER',json.dumps(out))
          PY
