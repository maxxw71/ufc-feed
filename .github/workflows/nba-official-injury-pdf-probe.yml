name: NBA official injury PDF probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/probe_official_injury_pdfs.py'
      - '.github/workflows/nba-official-injury-pdf-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pypdf
      - run: python nba/probe_official_injury_pdfs.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email actions@users.noreply.github.com
          git add nba/research/gap_audit/official_injury_pdf_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: add official injury PDF probe results"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
