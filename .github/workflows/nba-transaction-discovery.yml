name: NBA roster transaction discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/transactions/backfill_bref_transactions.py'
      - 'nba/build_transaction_pregame.py'
      - 'nba/research/discover_transactions.py'
      - '.github/workflows/nba-transaction-discovery.yml'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nba/transactions/backfill_bref_transactions.py
      - run: python nba/build_transaction_pregame.py
      - run: python nba/research/discover_transactions.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/transactions/bref_team_transactions.csv.gz nba/transactions/bref_coach_events.csv.gz nba/transactions/bref_transactions_summary.json nba/features/transaction_pregame.csv.gz nba/features/transaction_pregame_summary.json nba/research/transactions
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: add roster transaction discovery results"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
