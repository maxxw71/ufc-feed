name: NFL creative travel fatigue expansion
on:
  push:
    branches: [main]
    paths:
      - 'scripts/nfl_creative_travel_fatigue_expansion.py'
      - '.github/workflows/nfl-creative-travel-fatigue-expansion.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Run creative context expansion
        shell: bash
        run: |
          set -Eeuo pipefail
          /home/anestishkurti92/nfl-predictor-v1/venv/bin/python "$GITHUB_WORKSPACE/scripts/nfl_creative_travel_fatigue_expansion.py"
      - name: Publish results
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC=/home/appwiza-runner/nfl-context-data/creative_travel_fatigue
          DEST="$GITHUB_WORKSPACE/nfl/creative_travel_fatigue"
          mkdir -p "$DEST"
          cp "$SRC/summary.json" "$DEST/summary.json"
          cp "$SRC/report.txt" "$DEST/report.txt"
          cp "$SRC/all_creative_veto_tests.csv" "$DEST/all_creative_veto_tests.csv"
          cp "$SRC/confirmed_creative_vetoes.csv" "$DEST/confirmed_creative_vetoes.csv"
          cp "$SRC/creative_method_survivors.csv" "$DEST/creative_method_survivors.csv"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add nfl/creative_travel_fatigue
          if ! git diff --cached --quiet; then
            git commit -m 'Update NFL creative travel fatigue results'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
