name: DWCS Official UFC Prefight Record Enrichment
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dwcs-official-ufc-prefight-records.yml'
      - 'dwcs/research/build_official_ufc_prefight_records.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas requests
      - name: Build official UFC historical pre-fight records
        run: python dwcs/research/build_official_ufc_prefight_records.py
      - name: Commit results
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add dwcs/research/official_ufc_prefight_records
          git diff --cached --quiet && exit 0
          git commit -m 'Add official UFC historical DWCS pre-fight records'
          git pull --rebase origin main
          git push
