name: MLS BeatTheBookie Source Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mls-beatthebookie-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Inspect MLS continuous odds-series schema
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import urllib.request, pathlib, zipfile, gzip, csv, io, collections, re
          root=pathlib.Path('/tmp/appwiza-beatbookie'); root.mkdir(parents=True,exist_ok=True)
          out=root/'archive.zip'
          url='https://www.kaggle.com/api/v1/datasets/download/austro/beat-the-bookie-worldwide-football-dataset'
          if not out.exists() or out.stat().st_size < 80_000_000:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 AppwizaMLS/1.0'})
              with urllib.request.urlopen(req,timeout=180) as r, out.open('wb') as f:
                  while True:
                      b=r.read(1024*1024)
                      if not b: break
                      f.write(b)
          dest=root/'unzip'
          if not dest.exists():
              with zipfile.ZipFile(out) as z: z.extractall(dest)

          for mfn,sfn in [('odds_series_matches.csv.gz','odds_series.csv.gz'),('odds_series_b_matches.csv.gz','odds_series_b.csv.gz')]:
              print('\n###',mfn,sfn)
              mls={}
              with gzip.open(dest/mfn,'rt',encoding='utf-8',errors='replace',newline='') as g:
                  rd=csv.DictReader(g)
                  for r in rd:
                      if (r.get(' league') or r.get('league') or '').strip()=='USA: MLS':
                          mid=(r.get('match_id') or '').strip()
                          mls[mid]=r
              print('MLS_MATCHES',len(mls),'FIRST_IDS',list(mls)[:10])

              with gzip.open(dest/sfn,'rt',encoding='utf-8',errors='replace',newline='') as g:
                  header=next(g).rstrip('\n')
                  print('SERIES_HEADER',header[:3000])
                  for i in range(5):
                      print('SERIES_SAMPLE',next(g).rstrip('\n')[:3000])

              hits=[]; total=0
              with gzip.open(dest/sfn,'rt',encoding='utf-8',errors='replace',newline='') as g:
                  rd=csv.reader(g)
                  hdr=next(rd)
                  for row in rd:
                      total+=1
                      if not row: continue
                      if row[0].strip() in mls:
                          hits.append(row)
                          if len(hits)>=8: break
              print('SERIES_COLUMNS',len(hdr),'HEADER_FIRST',hdr[:30])
              print('SERIES_ROWS_SCANNED_TO_8_HITS',total,'HITS',len(hits))
              for row in hits:
                  print('MLS_SERIES_ROW_LEN',len(row),'ID',row[0],'FIRST40',row[:40])
          PY
