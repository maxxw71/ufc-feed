name: MLS BeatTheBookie Source Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mls-beatthebookie-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect published odds-series archive
        shell: bash
        run: |
          set -Eeuo pipefail
          TMP=/tmp/appwiza-beatbookie
          rm -rf "$TMP"; mkdir -p "$TMP"
          python3 - <<'PY'
          import urllib.request, pathlib, zipfile, re, os
          url='https://www.kaggle.com/api/v1/datasets/download/austro/beat-the-bookie-worldwide-football-dataset'
          root=pathlib.Path('/tmp/appwiza-beatbookie')
          out=root/'archive.zip'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 AppwizaMLS/1.0'})
          with urllib.request.urlopen(req,timeout=180) as r, out.open('wb') as f:
              while True:
                  b=r.read(1024*1024)
                  if not b: break
                  f.write(b)
          print('download_bytes',out.stat().st_size)
          with zipfile.ZipFile(out) as z:
              infos=z.infolist()
              print('zip_entries',len(infos))
              for i in infos[:240]:
                  print('ENTRY',i.filename,i.file_size)
              dest=root/'unzip'; z.extractall(dest)
          print('TOP FILES')
          files=sorted((p for p in (root/'unzip').rglob('*') if p.is_file()),key=lambda p:str(p))
          for p in files[:240]:
              print('FILE',p,p.stat().st_size)
          print('TEXT CANDIDATES')
          for p in files:
              if p.stat().st_size>250_000_000: continue
              if p.suffix.lower() not in {'.csv','.txt','.sql','.json','.md'}: continue
              try:
                  t=p.read_text(errors='ignore')
              except Exception:
                  continue
              if re.search(r'Major League Soccer|\bMLS\b|United States|USA',t,re.I):
                  print('HIT',p,p.stat().st_size)
                  for line in t.splitlines():
                      if re.search(r'Major League Soccer|\bMLS\b|United States|USA',line,re.I):
                          print('  ',line[:600])
                          break
          PY
