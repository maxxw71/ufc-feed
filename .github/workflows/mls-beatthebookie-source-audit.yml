name: MLS BeatTheBookie Source Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mls-beatthebookie-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect published odds-series archive
        shell: bash
        run: |
          set -Eeuo pipefail
          TMP=/tmp/appwiza-beatbookie
          rm -rf "$TMP"; mkdir -p "$TMP"
          python3 - <<'PY'
          import urllib.request, pathlib
          url='https://www.kaggle.com/api/v1/datasets/download/austro/beat-the-bookie-worldwide-football-dataset'
          out=pathlib.Path('/tmp/appwiza-beatbookie/archive.zip')
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 AppwizaMLS/1.0'})
          with urllib.request.urlopen(req,timeout=180) as r, out.open('wb') as f:
              while True:
                  b=r.read(1024*1024)
                  if not b: break
                  f.write(b)
          print('download_bytes',out.stat().st_size)
          PY
          unzip -l "$TMP/archive.zip" | sed -n '1,240p'
          mkdir -p "$TMP/unzip"
          unzip -q "$TMP/archive.zip" -d "$TMP/unzip"
          echo "TOP FILES"
          find "$TMP/unzip" -maxdepth 4 -type f -printf '%p %s bytes\n' | head -240
          echo "MLS TEXT HITS"
          grep -RilE 'Major League Soccer|MLS|USA.*Soccer|United States' "$TMP/unzip" 2>/dev/null | head -100 || true
