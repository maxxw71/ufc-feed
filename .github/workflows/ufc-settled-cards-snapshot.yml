name: UFC Settled Cards Snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ufc-settled-cards-snapshot.yml']
permissions:
  contents: write
jobs:
  snap:
    runs-on: [self-hosted, Linux, X64, appwiza]
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          mkdir -p ufc_settled_cards_snapshot
          ssh -i /home/appwiza-runner/.ssh/appwiza_vps -o BatchMode=yes -o StrictHostKeyChecking=accept-new anestishkurti92@127.0.0.1 "python3 -c 'import json; d=json.load(open(\"/srv/appwiza-sports/state/ufc.json\")); print(json.dumps([{\"selection\":c.get(\"selection\"),\"opponent\":c.get(\"opponent\"),\"result\":c.get(\"result\"),\"price\":c.get(\"price\"),\"profit_units\":c.get(\"profit_units\"),\"methods\":[m.get(\"id\") for m in c.get(\"methods\",[])]} for c in d.get(\"cards\",[]) if c.get(\"result\") in [\"win\",\"loss\"]], indent=2))'" > ufc_settled_cards_snapshot/report.json
          cat ufc_settled_cards_snapshot/report.json
      - shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ufc_settled_cards_snapshot/report.json
          git diff --cached --quiet || (git commit -m 'Snapshot UFC settled cards' && git push)