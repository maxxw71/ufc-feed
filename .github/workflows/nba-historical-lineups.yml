name: NBA Historical Lineup Rotation Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nba/lineups/build_historical_lineups.py"
      - ".github/workflows/nba-historical-lineups.yml"

permissions:
  contents: write

concurrency:
  group: nba-historical-lineups
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nba/lineups/build_historical_lineups.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/lineups
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: build historical lineup and rotation stints"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push
