name: NBA Near Tip Live State
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 2
    steps:
      - name: Check independent appwiza capture
        shell: bash
        run: |
          test -s /srv/appwiza-sports/capture/near-tip-status.json
          cat /srv/appwiza-sports/capture/near-tip-status.json
          systemctl is-active nba-prospective-near-tip.timer
