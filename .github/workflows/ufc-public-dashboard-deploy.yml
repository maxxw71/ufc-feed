name: UFC public page canonical deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ufc/ufc_public_page.py'
      - 'scripts/patch_ufc_page_contract_guard.py'
      - 'scripts/patch_sport_render_isolation.py'
      - '.github/workflows/ufc-public-dashboard-deploy.yml'

concurrency:
  group: appwiza-sports-public-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Reject stale UFC page source
        id: freshness
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          THIS=$(sha256sum ufc/ufc_public_page.py | awk '{print $1}')
          LATEST=$(git show origin/main:ufc/ufc_public_page.py | sha256sum | awk '{print $1}')
          echo "this=$THIS latest=$LATEST"
          if [ "$THIS" != "$LATEST" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "STALE UFC PAGE RUN — skipping server write"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate canonical UFC source
        if: steps.freshness.outputs.deploy == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile ufc/ufc_public_page.py
          grep -q "PAGE_CONTRACT='UFC_PUBLIC_CANONICAL_V2_20260919'" ufc/ufc_public_page.py
          grep -q 'Method Key · U1–U12' ufc/ufc_public_page.py
          grep -q '/sports/ufc/dashboard.css?v=' ufc/ufc_public_page.py
          grep -q "atomic(PUBLIC/'dashboard.css',DASH_CSS)" ufc/ufc_public_page.py

      - name: Install canonical UFC enhancer and guards
        if: steps.freshness.outputs.deploy == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          SSH="ssh -i $KEY -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new $HOST"

          cat ufc/ufc_public_page.py | $SSH 'set -e; D=/home/anestishkurti92/ufc-predictor-v1; cat > "$D/ufc_public_page.py.new"; chmod 0644 "$D/ufc_public_page.py.new"; mv -f "$D/ufc_public_page.py.new" "$D/ufc_public_page.py"'
          cat scripts/patch_ufc_page_contract_guard.py | $SSH 'cat > /tmp/patch_ufc_page_contract_guard.py'
          cat scripts/patch_sport_render_isolation.py | $SSH 'cat > /tmp/patch_sport_render_isolation.py'

          $SSH 'set -Eeuo pipefail; export HOME=/home/anestishkurti92; export PYTHONPATH=/home/anestishkurti92/ufc-predictor-v1:/home/anestishkurti92/betting-ledger/code:/opt/sports-publisher; cd /home/anestishkurti92/ufc-predictor-v1; /home/anestishkurti92/ufc-predictor-v1/venv/bin/python /tmp/patch_ufc_page_contract_guard.py ufc_email_watcher.py; /home/anestishkurti92/ufc-predictor-v1/venv/bin/python /tmp/patch_sport_render_isolation.py ufc ufc_email_watcher.py; /home/anestishkurti92/ufc-predictor-v1/venv/bin/python -m py_compile ufc_public_page.py ufc_email_watcher.py; grep -q UFC_PUBLIC_PAGE_CONTRACT_GUARD_V1 ufc_email_watcher.py; grep -q UFC_RENDER_ISOLATION_V1 ufc_email_watcher.py; /home/anestishkurti92/ufc-predictor-v1/venv/bin/python -c "import sports_publish,ufc_public_page; assert ufc_public_page.PAGE_CONTRACT==\"UFC_PUBLIC_CANONICAL_V2_20260919\"; ufc_public_page.safe_enhance(sports_publish)"'

      - name: Verify canonical UFC live page
        if: steps.freshness.outputs.deploy == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://appwiza.com/sports/ufc/ > /tmp/ufc-live.html
          grep -q 'Overall record' /tmp/ufc-live.html
          grep -q 'Current UFC audit' /tmp/ufc-live.html
          grep -q 'Available selections' /tmp/ufc-live.html
          grep -q 'Completed selections' /tmp/ufc-live.html
          grep -q 'Method Key · U1–U12' /tmp/ufc-live.html
          for x in U1 U2 U3 U4 U5 U6 U7 U8 U9 U10 U11 U12; do grep -q ">$x</span>" /tmp/ufc-live.html; done
          echo 'UFC canonical page deploy and contract guards verified'
