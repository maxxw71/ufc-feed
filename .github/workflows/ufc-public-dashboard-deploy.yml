name: UFC public dashboard deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ufc/ufc_public_page.py'
      - '.github/workflows/ufc-public-dashboard-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Deploy UFC dashboard over local SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          SSH="ssh -i $KEY -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new $HOST"
          cat ufc/ufc_public_page.py | $SSH 'cat > /home/anestishkurti92/ufc-predictor-v1/ufc_public_page.py'
          $SSH 'export HOME=/home/anestishkurti92; export PYTHONPATH=/home/anestishkurti92/ufc-predictor-v1:/home/anestishkurti92/betting-ledger/code:/opt/sports-publisher; /home/anestishkurti92/ufc-predictor-v1/venv/bin/python -c "import sports_publish,ufc_public_page; ufc_public_page.safe_enhance(sports_publish)"'
      - name: Verify public page
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://appwiza.com/sports/ufc/ > /tmp/ufc-live.html
          grep -q 'Overall record' /tmp/ufc-live.html
          grep -q 'Upcoming picks' /tmp/ufc-live.html
          grep -q 'Completed selections' /tmp/ufc-live.html
          grep -q '2-1' /tmp/ufc-live.html
          grep -q 'Manon Fiorot' /tmp/ufc-live.html
          echo 'UFC dashboard live verification passed'
