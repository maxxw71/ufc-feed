name: UFC public dashboard deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/ufc_public_dashboard_patch.py'
      - '.github/workflows/ufc-public-dashboard-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'maxxw71/ufc-feed' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Patch and install UFC dashboard as site owner
        shell: bash
        run: |
          set -Eeuo pipefail
          P=/opt/sports-publisher/sports_publish.py
          T=/tmp/sports_publish.ufc-dashboard.py
          SSH='ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new anestishkurti92@127.0.0.1'
          cp "$P" "$T"
          python3 scripts/ufc_public_dashboard_patch.py "$T"
          python3 -m py_compile "$T"
          $SSH 'set -e; test -w /opt/sports-publisher/sports_publish.py; cp /opt/sports-publisher/sports_publish.py /opt/sports-publisher/sports_publish.py.pre-ufc-dashboard.bak'
          cat "$T" | $SSH 'cat > /opt/sports-publisher/sports_publish.py; chmod 0644 /opt/sports-publisher/sports_publish.py; python3 -m py_compile /opt/sports-publisher/sports_publish.py'
          $SSH "python3 -c \"import sys; sys.path.insert(0,'/opt/sports-publisher'); import sports_publish; sports_publish.render_all()\""
      - name: Verify public UFC dashboard
        shell: bash
        run: |
          set -Eeuo pipefail
          P=/srv/appwiza-sports/public/ufc/index.html
          grep -q 'Overall record' "$P"
          grep -q 'Upcoming picks' "$P"
          grep -q 'Completed selections' "$P"
          grep -q 'history-table' "$P"
          grep -q 'Manon Fiorot' "$P"
          grep -q 'LOSS' "$P"
          grep -q '2-1' "$P"
          echo 'UFC dashboard verification passed'
          grep -oE 'Overall record|Win rate|Tracked ROI|Net units|Upcoming picks|Completed selections|2-1|-18\.2%' "$P" | sort | uniq -c
