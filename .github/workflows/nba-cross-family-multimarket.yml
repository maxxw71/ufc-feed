name: NBA cross family multimarket discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/research/discover_cross_family_multimarket.py'
      - '.github/workflows/nba-cross-family-multimarket.yml'
permissions:
  contents: write
jobs:
  discover:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python nba/research/discover_cross_family_multimarket.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name appwiza-nba-bot
          git config user.email actions@users.noreply.github.com
          git add nba/research/cross_family
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: add cross family multimarket results"
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
