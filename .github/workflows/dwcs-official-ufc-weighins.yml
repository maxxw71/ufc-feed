name: DWCS Official UFC Weigh-In Archive
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dwcs-official-ufc-weighins.yml'
      - 'dwcs/research/build_official_ufc_weighins.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas numpy requests rapidfuzz
      - name: Build official UFC DWCS weigh-in archive
        run: python dwcs/research/build_official_ufc_weighins.py
      - name: Commit results
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add dwcs/research/official_ufc_weighins
          git diff --cached --quiet && exit 0
          git commit -m 'Add official UFC DWCS weigh-in history'
          git pull --rebase origin main
          git push
