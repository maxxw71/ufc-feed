name: Golden-ratio MA rail crypto research

on:
  push:
    branches: [main]
    paths:
      - 'crypto/research/golden_ratio_ma_rails.py'
      - 'crypto/research/MA_SUPPORT_RESEARCH_SAVED.md'
      - '.github/workflows/golden-ratio-ma-rails.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: golden-ratio-ma-rails
  cancel-in-progress: true

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        venue: [hl,bn]
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy requests
      - run: |
          python crypto/research/golden_ratio_ma_rails.py \
            --mode scan --venue ${{ matrix.venue }} --days 600 \
            --binance-symbols 160 --shard-index ${{ matrix.shard }} --shard-count 8 \
            --out golden_ma_out
      - uses: actions/upload-artifact@v4
        with:
          name: golden-ma-${{ matrix.venue }}-${{ matrix.shard }}
          path: golden_ma_out/
          retention-days: 2

  aggregate:
    needs: scan
    if: always() && needs.scan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy requests
      - uses: actions/download-artifact@v4
        with:
          pattern: golden-ma-*
          path: golden_ma_shards
          merge-multiple: true
      - run: python crypto/research/golden_ratio_ma_rails.py --mode aggregate --input-dir golden_ma_shards --out crypto/research/results_golden_ratio_ma_rails
      - name: Commit outputs
        run: |
          git config user.name "appwiza-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crypto/research/results_golden_ratio_ma_rails
          if ! git diff --cached --quiet; then
            git commit -m "Update Golden Ratio MA rail research"
            git pull --rebase -X ours origin main || true
            git push origin HEAD:main || true
          fi
