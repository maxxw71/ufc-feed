name: NBA transaction value discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/transactions/backfill_bref_transactions.py'
      - 'nba/build_transaction_value_pregame.py'
      - 'nba/research/discover_transaction_value.py'
      - '.github/workflows/nba-transaction-value-discovery.yml'
permissions:
  contents: write
jobs:
  discover:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python nba/transactions/backfill_bref_transactions.py
      - run: python nba/build_transaction_value_pregame.py
      - run: python nba/research/discover_transaction_value.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name appwiza-nba-bot
          git config user.email actions@users.noreply.github.com
          git add nba/transactions/bref_team_transactions.csv.gz nba/transactions/bref_player_transaction_edges.csv.gz nba/transactions/bref_player_transaction_edges_enriched.csv.gz nba/transactions/bref_coach_events.csv.gz nba/transactions/bref_transactions_summary.json nba/features/transaction_value_pregame.csv.gz nba/features/transaction_value_pregame_summary.json nba/research/transaction_value
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: add transaction value discovery results"
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
