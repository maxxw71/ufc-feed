name: MLS Odds Credential Name Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mls-odds-credential-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect credential names only
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" 'python3 - <<'"'"'PY'"'"'
          from pathlib import Path
          for p in [Path("/home/anestishkurti92/.config/ufc-watcher.env"),Path("/home/anestishkurti92/.config/nfl-watcher.env")]:
              print("FILE",p,"exists",p.exists())
              if not p.exists(): continue
              for line in p.read_text(errors="ignore").splitlines():
                  line=line.strip()
                  if not line or line.startswith("#") or "=" not in line: continue
                  k=line.split("=",1)[0].strip()
                  if any(x in k.upper() for x in ["ODDS","API","KEY","TOKEN"]):
                      print("KEYNAME",k)
          PY'
