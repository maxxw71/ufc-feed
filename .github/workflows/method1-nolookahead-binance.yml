name: Method 1 no-lookahead Binance replication

on:
  push:
    branches: [main]
    paths:
      - 'crypto/research/method1_nolookahead_binance_replication.py'
      - '.github/workflows/method1-nolookahead-binance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy requests
      - run: python crypto/research/method1_nolookahead_binance_replication.py --symbols 120 --days 900
      - name: Commit outputs
        run: |
          git config user.name "appwiza-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crypto/research/results_method1_nolookahead_binance_replication
          if ! git diff --cached --quiet; then
            git commit -m "Update corrected Method 1 Binance replication"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
