name: NBA Research V4 ML ATS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/research/discover_method_hunt_v4.py'
      - '.github/workflows/nba-research-v4-ml-ats.yml'

permissions:
  contents: write

concurrency:
  group: nba-research-v4-ml-ats
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python nba/research/discover_method_hunt_v4.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name appwiza-nba-bot
          git config user.email actions@users.noreply.github.com
          git add nba/research/hunt_v4
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'nba: add research v4 ML ATS results'
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
