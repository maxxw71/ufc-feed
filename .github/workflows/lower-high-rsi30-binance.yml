name: Lower-high RSI30 Binance research

on:
  push:
    branches: [main]
    paths:
      - 'crypto/research/lower_high_rsi30_binance.py'
      - '.github/workflows/lower-high-rsi30-binance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy requests
      - run: python crypto/research/lower_high_rsi30_binance.py --symbols 120 --days 900
      - name: Commit outputs
        run: |
          git config user.name "appwiza-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crypto/research/results_lower_high_rsi30_binance
          if ! git diff --cached --quiet; then
            git commit -m "Update lower-high RSI30 Binance research"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
