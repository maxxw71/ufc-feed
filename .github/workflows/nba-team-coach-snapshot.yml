name: NBA Team Coach Snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nba/teams/capture_team_profiles.py"
      - ".github/workflows/nba-team-coach-snapshot.yml"
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: write

concurrency:
  group: nba-team-coach-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade requests
      - run: python nba/teams/capture_team_profiles.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/teams
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: refresh team coach profiles"
          git pull --rebase origin main
          git push
