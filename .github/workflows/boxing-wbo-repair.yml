name: Boxing WBO Verified-PDF Repair

on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/repair_wbo_rankings.py'
      - 'boxing/research/collect_wbo_rankings.py'
      - '.github/workflows/boxing-wbo-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pypdf beautifulsoup4 lxml
      - name: Rebuild from verified WBO PDF index
        run: python boxing/research/repair_wbo_rankings.py
      - name: Persist repaired WBO archive
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add boxing/rankings/wbo_monthly_rankings.json boxing/rankings/wbo_monthly_champions.json boxing/rankings/wbo_monthly_rankings_meta.json
          if git diff --cached --quiet; then
            echo 'No WBO repair changes.'
          else
            git commit -m 'Repair official WBO ranking archive'
            git pull --rebase origin main || {
              git rebase --abort || true
              git fetch origin main
              cp boxing/rankings/wbo_monthly_rankings.json /tmp/wbo_rankings.json
              cp boxing/rankings/wbo_monthly_champions.json /tmp/wbo_champions.json
              cp boxing/rankings/wbo_monthly_rankings_meta.json /tmp/wbo_meta.json
              git reset --hard origin/main
              cp /tmp/wbo_rankings.json boxing/rankings/wbo_monthly_rankings.json
              cp /tmp/wbo_champions.json boxing/rankings/wbo_monthly_champions.json
              cp /tmp/wbo_meta.json boxing/rankings/wbo_monthly_rankings_meta.json
              git add boxing/rankings/wbo_monthly_rankings.json boxing/rankings/wbo_monthly_champions.json boxing/rankings/wbo_monthly_rankings_meta.json
              git commit -m 'Repair official WBO ranking archive'
            }
            git push origin HEAD:main
          fi
