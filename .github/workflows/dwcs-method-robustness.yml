name: DWCS Validated Candidate Robustness
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dwcs-method-robustness.yml'
      - 'dwcs/research/run_method_robustness.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas numpy
      - name: Run validation robustness and overlap analysis
        run: python dwcs/research/run_method_robustness.py
      - name: Commit robustness results
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add dwcs/research/method_robustness
          git diff --cached --quiet && exit 0
          git commit -m 'Analyze robustness of validated DWCS methods'
          git pull --rebase origin main
          git push
