name: Boxing SofaScore Reach Probe
on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/probe_sofascore_reach.py'
      - '.github/workflows/boxing-sofascore-reach-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 20
    steps:
      - name: Prepare isolated boxing scratch space
        run: mkdir -p "${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python boxing/research/probe_sofascore_reach.py
      - name: Persist probe
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/ss-reach
          cp boxing/profile_supplements/sofascore_reach_probe.json /tmp/ss-reach/
          cp boxing/profile_supplements/sofascore_reach_additions.jsonl /tmp/ss-reach/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ss-reach/sofascore_reach_probe.json boxing/profile_supplements/
            cp /tmp/ss-reach/sofascore_reach_additions.jsonl boxing/profile_supplements/
            git add boxing/profile_supplements/sofascore_reach_probe.json boxing/profile_supplements/sofascore_reach_additions.jsonl
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish SofaScore reach probe'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Remove this run temporary boxing files
        if: always()
        run: rm -rf -- "${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}"
