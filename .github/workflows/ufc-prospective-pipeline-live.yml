name: UFC Prospective Pipeline Live
on:
  push:
    paths:
      - 'scripts/ufc_prospective_pipeline.py'
      - 'scripts/patch_ufc_prospective_market.py'
      - 'scripts/ufcstats_live_refresh.py'
      - '.github/workflows/ufc-prospective-pipeline-live.yml'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: [self-hosted, appwiza]
    timeout-minutes: 45
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          K=/home/appwiza-runner/.ssh/appwiza_vps
          SRC=https://raw.githubusercontent.com/maxxw71/ufc-feed/$GITHUB_SHA/scripts/ufc_prospective_pipeline.py
          PATCH=https://raw.githubusercontent.com/maxxw71/ufc-feed/5e00048e7453480fc57ec3957ae862edfc1dd756/scripts/patch_ufc_prospective_market.py
          REFRESH=https://raw.githubusercontent.com/maxxw71/ufc-feed/$GITHUB_SHA/scripts/ufcstats_live_refresh.py
          T=$(mktemp); P=$(mktemp); R=$(mktemp)
          curl -fsSL "$SRC" -o "$T"
          curl -fsSL "$PATCH" -o "$P"
          curl -fsSL "$REFRESH" -o "$R"
          scp -i "$K" -o StrictHostKeyChecking=no "$T" anestishkurti92@127.0.0.1:/home/anestishkurti92/ufc-predictor-v1/ufc_prospective_pipeline.py
          scp -i "$K" -o StrictHostKeyChecking=no "$P" anestishkurti92@127.0.0.1:/home/anestishkurti92/ufc-predictor-v1/patch_ufc_prospective_market.py
          scp -i "$K" -o StrictHostKeyChecking=no "$R" anestishkurti92@127.0.0.1:/home/anestishkurti92/ufc-predictor-v1/ufcstats_live_refresh.py
          rm -f "$T" "$P" "$R"
          ssh -i "$K" -o StrictHostKeyChecking=no anestishkurti92@127.0.0.1 'bash -s' <<'EOF'
          set -euo pipefail
          cd /home/anestishkurti92/ufc-predictor-v1
          chmod 700 ufc_prospective_pipeline.py ufcstats_live_refresh.py
          venv/bin/python patch_ufc_prospective_market.py
          venv/bin/python -m py_compile ufc_prospective_pipeline.py ufcstats_live_refresh.py

          # Self-contained live UFCStats refresher uses packages already present in the model environment.
          venv/bin/python -c 'import requests,lxml,pandas,numpy'
          for f in ufc_feature_expansion.py ufc_metadata_features.py ufc_weight_history_features.py ufc_context_crosscheck_features.py ufc_career_context_features.py; do
            test -f "$f" || { echo "MISSING $f"; exit 3; }
          done
          venv/bin/python ufc_prospective_pipeline.py capture
          venv/bin/python ufc_prospective_pipeline.py status
          CR=/tmp/ufc_prospective_cron
          crontab -l 2>/dev/null | grep -v 'ufc_prospective_pipeline.py' | awk '!seen[$0]++' > "$CR" || true
          cat >> "$CR" <<'CRON'
          CRON_TZ=America/New_York
          10 0,6,12,18 * * * cd /home/anestishkurti92/ufc-predictor-v1 && timeout 10m nice -n 10 venv/bin/python ufc_prospective_pipeline.py capture >> auto_research/prospective.log 2>&1
          40 0,6,12,18 * * * cd /home/anestishkurti92/ufc-predictor-v1 && timeout 45m nice -n 12 venv/bin/python ufc_prospective_pipeline.py finalize >> auto_research/prospective.log 2>&1
          # Fight-weekend reconciliation: refresh UFCStats/immutable warehouse hourly so completed cards
          # do not wait up to six hours to become finalized prospective research observations.
          50 * * * 6,0 cd /home/anestishkurti92/ufc-predictor-v1 && timeout 50m nice -n 12 venv/bin/python ufc_prospective_pipeline.py reconcile >> auto_research/prospective.log 2>&1
          CRON
          crontab "$CR"
          rm -f "$CR"
          echo '=== PROSPECTIVE CRON ==='
          crontab -l | grep -E 'CRON_TZ|ufc_prospective_pipeline'
          echo '=== INITIAL POST-EVENT RECONCILIATION ==='
          venv/bin/python ufc_prospective_pipeline.py reconcile
          echo '=== QUOTE READINESS ==='
          venv/bin/python - <<'PY'
          import sqlite3,pandas as pd
          c=sqlite3.connect('auto_research/state/prospective_ufc.sqlite3');d=pd.read_sql_query('select * from bout_quotes',c)
          print('rows',len(d),'starts',int((d.event_start.fillna('').str.len()>0).sum()),'probs',int(d.p_a.notna().sum()),'prices',int(d.dec_a.notna().sum()),'books',int((d.book.fillna('').str.len()>0).sum()),'quote_at',int((d.quote_at.fillna('').str.len()>0).sum()))
          print(d[['event_date','event_start','fighter_a','fighter_b','p_a','p_b','dec_a','dec_b','book','quote_at']].head(8).to_string(index=False))
          PY
          echo '=== STATUS ==='
          venv/bin/python ufc_prospective_pipeline.py status
          echo '=== POSTFIGHT RESEARCH WAREHOUSE ==='
          venv/bin/python - <<'PY'
          import sqlite3
          c=sqlite3.connect('auto_research/state/prospective_ufc.sqlite3')
          print('postfight_observations',c.execute('select count(*) from postfight_research_observations').fetchone()[0])
          print('recent_postfight',c.execute("select event_date,favorite,opponent,method_ids_json,method_families_json,won from postfight_research_observations order by event_date desc,favorite limit 12").fetchall())
          print('ufc332_quotes',c.execute("select event_date,event_start,fighter_a,fighter_b,p_a,p_b,dec_a,dec_b,captured_at from bout_quotes where lower(fighter_a||' '||fighter_b) like '%pinas%' or lower(fighter_a||' '||fighter_b) like '%talbott%' order by captured_at desc limit 12").fetchall())
          PY
          EOF
