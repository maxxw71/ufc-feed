name: NBA Season Depth Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nba/data/**/summary.json"
      - "nba/season_depth_audit.py"
      - ".github/workflows/nba-season-depth-audit.yml"

permissions:
  contents: write

concurrency:
  group: nba-season-depth-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nba/season_depth_audit.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/season_depth_report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: refresh season depth audit"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push
