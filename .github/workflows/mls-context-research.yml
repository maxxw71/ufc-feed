name: MLS Context Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/mls_context_research.py'
      - 'mls/context/feature_meta.json'
      - '.github/workflows/mls-context-research.yml'

concurrency:
  group: mls-context-research
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  research:
    if: github.repository == 'maxxw71/ufc-feed'
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Deploy and run MLS context research
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          SSH="ssh -i $KEY -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new $HOST"
          D=/home/anestishkurti92/mls-predictor-v1
          cat scripts/mls_context_research.py | $SSH 'set -e; D=/home/anestishkurti92/mls-predictor-v1; cat > "$D/mls_context_research.py.new"; chmod 0644 "$D/mls_context_research.py.new"; mv -f "$D/mls_context_research.py.new" "$D/mls_context_research.py"'
          $SSH 'set -Eeuo pipefail; cd /home/anestishkurti92/mls-predictor-v1; venv/bin/python -m py_compile mls_context_research.py; OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 nice -n 12 timeout 12m venv/bin/python mls_context_research.py'

      - name: Pull research audit
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          mkdir -p mls/research
          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" 'cat /home/anestishkurti92/mls-predictor-v1/research/context/latest.json' > mls/research/context_latest.json

      - name: Persist research audit
        shell: bash
        run: |
          set -Eeuo pipefail
          cp mls/research/context_latest.json "$RUNNER_TEMP/context_latest.json"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p mls/research
          cp "$RUNNER_TEMP/context_latest.json" mls/research/context_latest.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add mls/research/context_latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish MLS context research audit'
            git push origin HEAD:main
          fi
