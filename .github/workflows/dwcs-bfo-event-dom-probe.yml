name: DWCS BFO Event DOM Probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dwcs-bfo-event-dom-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Probe historical BFO event DOM
        run: |
          python - <<'PY'
          import json,requests
          from pathlib import Path
          from bs4 import BeautifulSoup
          out=Path('dwcs/research/bfo_event_dom_probe'); out.mkdir(parents=True,exist_ok=True)
          url='https://www.bestfightodds.com/events/dana-white-s-contender-series-24-1767'
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0 Appwiza-DWCS-BFO/1.0'},timeout=30)
          r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          (out/'html.txt').write_text(r.text[:250000])
          rows=[]
          for tr in soup.find_all('tr'):
              txt=' '.join(tr.get_text(' ',strip=True).split())
              if txt:
                  rows.append({'class':tr.get('class'),'id':tr.get('id'),'text':txt[:3000],
                               'cells':[{'tag':c.name,'class':c.get('class'),'text':' '.join(c.get_text(' ',strip=True).split())[:500]} for c in tr.find_all(['td','th'])]})
          (out/'rows.json').write_text(json.dumps(rows[:300],indent=2))
          print('status',r.status_code,'rows',len(rows))
          PY
      - name: Commit
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add dwcs/research/bfo_event_dom_probe
          git commit -m 'Probe BFO historical event DOM' || exit 0
          git pull --rebase origin main
          git push
