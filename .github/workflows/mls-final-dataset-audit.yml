name: MLS Final Dataset Audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/mls_dataset_final_audit.py'
      - 'mls/features/master_feature_meta.json'
      - '.github/workflows/mls-final-dataset-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Run final dataset audit
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          D=/home/anestishkurti92/mls-predictor-v1
          cat scripts/mls_dataset_final_audit.py | ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" "cat > $D/mls_dataset_final_audit.py"
          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" "cd $D && venv/bin/python -m py_compile mls_dataset_final_audit.py && timeout 10m venv/bin/python mls_dataset_final_audit.py"
      - name: Pull audit
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          mkdir -p mls/features
          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" 'cat /home/anestishkurti92/mls-predictor-v1/reports/dataset_final_audit.json' > mls/features/dataset_final_audit.json
      - name: Persist audit
        shell: bash
        run: |
          set -Eeuo pipefail
          cp mls/features/dataset_final_audit.json "$RUNNER_TEMP/final_audit.json"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p mls/features
          cp "$RUNNER_TEMP/final_audit.json" mls/features/dataset_final_audit.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add mls/features/dataset_final_audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish MLS final dataset audit'
            git push origin HEAD:main
          fi
