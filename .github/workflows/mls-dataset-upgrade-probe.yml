name: MLS Dataset Upgrade Probe

on:
  push:
    branches: [main]
    paths:
      - 'scripts/mls_dataset_upgrade_probe.py'
      - '.github/workflows/mls-dataset-upgrade-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run source and schema probe
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          SSH="ssh -i $KEY -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new $HOST"
          D=/home/anestishkurti92/mls-predictor-v1
          cat scripts/mls_dataset_upgrade_probe.py | $SSH "cat > $D/mls_dataset_upgrade_probe.py"
          $SSH "cd $D && timeout 10m venv/bin/python mls_dataset_upgrade_probe.py"
