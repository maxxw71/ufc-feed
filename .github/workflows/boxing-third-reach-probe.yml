name: Boxing Third Source Reach Probe

on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/probe_boxingundefeated_reach.py'
      - '.github/workflows/boxing-third-reach-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q beautifulsoup4 lxml
      - run: python boxing/research/probe_boxingundefeated_reach.py
      - name: Persist probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add boxing/profile_supplements/boxingundefeated_reach_probe.json
          if git diff --cached --quiet; then
            echo 'No third-source reach probe changes.'
          else
            git commit -m 'Run third-source boxing reach probe'
            git pull --rebase origin main
            git push
          fi
