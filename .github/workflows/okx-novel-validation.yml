name: OKX third-venue novel validation

on:
  push:
    branches: [main]
    paths:
      - 'crypto/research/okx_novel_validation.py'
      - '.github/workflows/okx-novel-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: okx-novel-validation
  cancel-in-progress: true

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy requests
      - run: |
          python crypto/research/okx_novel_validation.py \
            --mode scan --days 600 \
            --shard-index ${{ matrix.shard }} --shard-count 8 \
            --out okx_out
      - uses: actions/upload-artifact@v4
        with:
          name: okx-novel-${{ matrix.shard }}
          path: okx_out/
          retention-days: 2

  aggregate:
    needs: scan
    if: always() && needs.scan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy requests
      - uses: actions/download-artifact@v4
        with:
          pattern: okx-novel-*
          path: okx_shards
          merge-multiple: true
      - run: |
          python crypto/research/okx_novel_validation.py \
            --mode aggregate --input-dir okx_shards \
            --out crypto/research/results_okx_novel_validation
      - name: Commit OKX validation
        run: |
          git config user.name "appwiza-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crypto/research/results_okx_novel_validation
          if ! git diff --cached --quiet; then
            git commit -m "Update OKX novel-method validation"
            git pull --rebase -X ours origin main || true
            git push origin HEAD:main || true
          fi
