name: PFL Hybrid Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pfl_hybrid_backtest.py"
      - ".github/workflows/pfl-hybrid-backtest.yml"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml pandas numpy duckdb rapidfuzz
      - name: Run PFL historical hybrid backtest
        run: python pfl_hybrid_backtest.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pfl_hybrid_backtest
          if git diff --cached --quiet; then
            echo "No result changes"
            exit 0
          fi
          git commit -m "Update PFL hybrid backtest results"
          git pull --rebase origin main
          git push origin HEAD:main
