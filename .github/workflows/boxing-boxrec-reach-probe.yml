name: Boxing BoxRec Reach Probe
on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/probe_boxrec_reach.py'
      - '.github/workflows/boxing-boxrec-reach-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 12
    steps:
      - name: Prepare isolated boxing scratch space
        run: mkdir -p "${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q beautifulsoup4 lxml
      - name: Download boxing research database
        run: |
          python - <<'PY'
          import io,zipfile,urllib.request
          u='https://appwiza.com/sports/downloads/boxing/research-database.zip'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 AppwizaBoxRecReachProbe/1.0'})
          with urllib.request.urlopen(req,timeout=180) as r:data=r.read()
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              name=next(n for n in z.namelist() if n.endswith('.sqlite3'))
              open('${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}/boxing_research.sqlite3','wb').write(z.read(name))
          PY
      - name: Probe exact BoxRec profile IDs
        env:
          BOXING_DB: ${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}/boxing_research.sqlite3
        run: python boxing/research/probe_boxrec_reach.py
      - name: Persist probe
        shell: bash
        run: |
          set -Eeuo pipefail
          cp boxing/profile_supplements/boxrec_reach_probe.json /tmp/boxrec_reach_probe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/boxrec_reach_probe.json boxing/profile_supplements/boxrec_reach_probe.json
          git add boxing/profile_supplements/boxrec_reach_probe.json
          git diff --cached --quiet || (git commit -m 'Run BoxRec boxing reach probe' && git push origin HEAD:main)

      - name: Remove this run temporary boxing files
        if: always()
        run: rm -rf -- "${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}"
