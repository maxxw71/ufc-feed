name: Boxing Legacy CompuBox Statfile Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boxing-legacy-compubox-statfile-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect stored legacy CompuBox stat-file payloads
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import sqlite3,json,re,os
          from pathlib import Path
          db='/home/anestishkurti92/boxing-research/boxing.sqlite3'
          d=sqlite3.connect(f'file:{db}?mode=ro',uri=True);d.row_factory=sqlite3.Row
          targets=['MAR-PAC2.html','stat_files/','Mayweather-Marquez']
          rows=[]
          for r in d.execute("select source_id,data from source_rows where source='external_evidence' and kind='punch' order by source_id"):
              url=str(r['source_id'] or '')
              if not any(t.lower() in url.lower() for t in targets):continue
              try:p=json.loads(r['data'])
              except Exception as e:
                  rows.append({'url':url,'payload_error':repr(e)});continue
              tabs=p.get('tables') or []
              rows.append({
                'url':url,
                'title':p.get('title'),
                'relevant_paragraphs':p.get('relevant_paragraphs') or [],
                'table_count':len(tabs),
                'tables':tabs,
                'stat_links':p.get('stat_links') or [],
                'payload_keys':sorted(p.keys())
              })
          normalized=[]
          tabs={x[0] for x in d.execute("select name from sqlite_master where type='table'")}
          if {'punch_reports','round_punches','fight_punch_totals'}<=tabs:
              for pr in d.execute("select url,bout_date,title,status from punch_reports where bout_date in ('2008-03-15','2009-09-19') order by bout_date,url"):
                  item=dict(pr)
                  item['round_rows']=d.execute("select count(*) from round_punches where report_url=?",(pr['url'],)).fetchone()[0]
                  item['total_rows']=d.execute("select count(*) from fight_punch_totals where report_url=?",(pr['url'],)).fetchone()[0]
                  normalized.append(item)
          normalized_urls={x['url'] for x in normalized}
          table_candidates=[]
          for r in d.execute("select source_id,data from source_rows where source='external_evidence' and kind='punch' order by source_id"):
              url=str(r['source_id'] or '')
              low=url.lower()
              if 'web.archive.org' not in low or 'compuboxonline.com' not in low or '*' in url:
                  continue
              if url in normalized_urls:
                  continue
              try:p=json.loads(r['data'])
              except Exception:continue
              tabs=p.get('tables') or []
              substantial=[t for t in tabs if len(t)>=4 and max([len(rr) for rr in t] or [0])>=4]
              if not substantial:
                  continue
              table_candidates.append({
                'url':url,'title':p.get('title'),
                'paragraphs':(p.get('relevant_paragraphs') or [])[:6],
                'table_count':len(tabs),
                'substantial_table_shapes':[[len(t),max([len(rr) for rr in t] or [0])] for t in substantial],
                'substantial_table_previews':[t[:8] for t in substantial[:4]],
                'stat_links':(p.get('stat_links') or [])[:30]
              })
          queue_rows=[]
          qcols={r[1] for r in d.execute("pragma table_info(external_evidence_queue)")}
          if 'url' in qcols:
              for q in d.execute("select * from external_evidence_queue where kind='punch' and (url like '%Mtagwa%' or url like '%CompuBox-Stats%' or url like '%Mayweather-Marquez%' or url like '%Klitschko%Arreola%') order by url"):
                  queue_rows.append(dict(q))
          review_candidates=[]
          qreview={str(q['url']):dict(q) for q in d.execute("select * from external_evidence_queue where kind='punch' and status='tables_need_review'")}
          for r in d.execute("select source_id,data from source_rows where source='external_evidence' and kind='punch' order by source_id"):
              url=str(r['source_id'] or '')
              if url not in qreview:continue
              try:p=json.loads(r['data'])
              except Exception:continue
              flat=' '.join(str(cell) for t in (p.get('tables') or []) for rr in (t or []) for cell in (rr or []) if cell)
              flat+=' '+' '.join(str(x) for x in (p.get('relevant_paragraphs') or []) if x)
              flat=re.sub(r'\\s+',' ',flat).strip()
              markers={
                'round_sequence':bool(re.search(r'\\bRound\\s+1\\s+2(?:\\s+3)?',flat,re.I)),
                'total':bool(re.search(r'Total\\s+Punch',flat,re.I)),
                'jab':bool(re.search(r'\\bJabs?\\b',flat,re.I)),
                'power':bool(re.search(r'Power\\s+Punch',flat,re.I)),
                'pair_density':len(re.findall(r'\\b\\d{1,3}\\s*/\\s*\\d{1,3}\\b',flat)),
              }
              if markers['round_sequence'] or markers['pair_density']>=6:
                  review_candidates.append({
                    'url':url,'title':p.get('title'),'markers':markers,
                    'table_shapes':[[len(t),max([len(rr) for rr in t] or [0])] for t in (p.get('tables') or [])],
                    'paragraphs':(p.get('relevant_paragraphs') or [])[:8],
                    'flat_sample':flat[:5000]
                  })
          d.close()
          out={'matching_payloads':len(rows),'rows':rows,'normalized_punch_reports':normalized,
               'unparsed_substantial_table_candidates':table_candidates,
               'linked_fight_queue_status':queue_rows,
               'tables_need_review_numeric_candidates':review_candidates}
          path=Path('boxing/public_punch_audit/legacy_compubox_statfile_probe.json')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(out,indent=2,ensure_ascii=False))
          print(json.dumps({'matching_payloads':len(rows),'summaries':[
            {'url':x.get('url'),'title':x.get('title'),'table_count':x.get('table_count'),
             'paragraph_count':len(x.get('relevant_paragraphs') or []),
             'table_shapes':[[len(t),max([len(rr) for rr in t] or [0])] for t in (x.get('tables') or [])]}
            for x in rows]},indent=2,ensure_ascii=False))
          PY
      - name: Persist probe
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add boxing/public_punch_audit/legacy_compubox_statfile_probe.json
          if git diff --cached --quiet; then
            echo 'No statfile probe changes.'
          else
            git commit -m 'Inspect legacy CompuBox stat files'
            git pull --rebase origin main
            git push
          fi
