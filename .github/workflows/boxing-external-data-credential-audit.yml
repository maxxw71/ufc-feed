name: Boxing External Data Credential Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boxing-external-data-credential-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Audit credential presence only
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=boxing/public_reports/EXTERNAL_DATA_ACCESS.json
          mkdir -p boxing/public_reports
          python3 - <<'PY'
          import json,os,re,pathlib,subprocess,datetime
          roots=[
            pathlib.Path('/home/anestishkurti92/boxing-research'),
            pathlib.Path('/home/anestishkurti92'),
            pathlib.Path('/etc/systemd/system'),
          ]
          names={
            'rapidapi':['RAPIDAPI_KEY','RAPID_API_KEY','X_RAPIDAPI_KEY','BOXING_DATA_API_KEY'],
            'the_odds_api':['THE_ODDS_API_KEY','ODDS_API_KEY'],
            'boxrec':['BOXREC_API_KEY','BOXREC_USERNAME','BOXREC_USER'],
            'compubox':['COMPUBOX_API_KEY','COMPUBOX_TOKEN','COMPUBOX_USERNAME'],
          }
          # Never emit values. Search environment and small config/service files for key names.
          found={k:False for k in names}
          evidence={k:[] for k in names}
          env=dict(os.environ)
          for group,keys in names.items():
            for key in keys:
              if env.get(key):
                found[group]=True;evidence[group].append('process_env:'+key)
          allowed_suffix={'.env','.conf','.service','.ini','.cfg','.toml','.yaml','.yml','.json','.sh'}
          for root in roots:
            if not root.exists():continue
            try:
              paths=root.rglob('*')
            except Exception:
              continue
            n=0
            for p in paths:
              if n>5000:break
              n+=1
              try:
                if not p.is_file() or p.stat().st_size>2_000_000:continue
                if p.suffix.lower() not in allowed_suffix and p.name not in {'.env','environment'}:continue
                txt=p.read_text(errors='ignore')
              except Exception:continue
              for group,keys in names.items():
                for key in keys:
                  if re.search(r'(?m)^\s*(?:export\s+)?'+re.escape(key)+r'\s*=',txt):
                    found[group]=True
                    tag='config_key_present:'+key
                    if tag not in evidence[group]:evidence[group].append(tag)
          # Also inspect systemd Environment= key NAMES only, never values.
          try:
            units=subprocess.run(['systemctl','list-unit-files','--type=service','--no-legend'],capture_output=True,text=True,timeout=20).stdout
            for unit in [x.split()[0] for x in units.splitlines() if x.strip() and ('box' in x.lower() or 'sport' in x.lower())]:
              try:txt=subprocess.run(['systemctl','cat',unit],capture_output=True,text=True,timeout=5).stdout
              except Exception:continue
              for group,keys in names.items():
                for key in keys:
                  if key in txt:
                    found[group]=True
                    tag='systemd_key_present:'+key
                    if tag not in evidence[group]:evidence[group].append(tag)
          except Exception:pass
          payload={
            'audited_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'credential_values_exposed':False,
            'access_presence':found,
            'evidence_key_names_only':evidence,
            'meaning':{
              'rapidapi':'Could enable Boxing Data API fighter/fight/event/ranking enrichment if subscription allows.',
              'the_odds_api':'Could enable licensed historical boxing odds (provider plan permitting).',
              'boxrec':'Could enable authorized broad record enrichment if API access is valid.',
              'compubox':'Could enable deeper punch data only under provider-approved access/terms.'
            }
          }
          pathlib.Path('boxing/public_reports/EXTERNAL_DATA_ACCESS.json').write_text(json.dumps(payload,indent=2))
          print(json.dumps(payload,indent=2))
          PY
      - name: Persist audit
        shell: bash
        run: |
          set -Eeuo pipefail
          cp boxing/public_reports/EXTERNAL_DATA_ACCESS.json "$RUNNER_TEMP/EXTERNAL_DATA_ACCESS.json"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p boxing/public_reports
          cp "$RUNNER_TEMP/EXTERNAL_DATA_ACCESS.json" boxing/public_reports/EXTERNAL_DATA_ACCESS.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add boxing/public_reports/EXTERNAL_DATA_ACCESS.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish boxing external data access audit'
            git push origin HEAD:main
          fi
