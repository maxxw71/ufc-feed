name: UFC live page diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ufc-live-page-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect recurring UFC publisher path
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== timer ==='
          systemctl cat ufc-model-watcher.timer || true
          echo '=== service ==='
          systemctl cat ufc-model-watcher.service || true
          echo '=== service properties ==='
          systemctl show ufc-model-watcher.service -p ExecStart -p User -p Group -p WorkingDirectory -p Environment --no-pager || true
          echo '=== timer properties ==='
          systemctl show ufc-model-watcher.timer -p OnCalendar -p NextElapseUSecRealtime -p LastTriggerUSec --no-pager || true
          echo '=== unit files ==='
          ls -l /etc/systemd/system/ufc-model-watcher.* /lib/systemd/system/ufc-model-watcher.* 2>/dev/null || true
          echo '=== likely watcher source ==='
          grep -RniE 'sports_publish|render_all|publish_ufc|safe_enhance|ufc_public_page' /home/anestishkurti92/ufc-predictor-v1 /opt/sports-publisher 2>/dev/null | head -240 || true
          echo '=== current UFC custom module ==='
          ls -l /home/anestishkurti92/ufc-predictor-v1/ufc_public_page.py /opt/sports-publisher/ufc_public_page.py 2>/dev/null || true
          echo '=== current page markers ==='
          grep -oE '/sports/ufc/dashboard.css\?v=[^" ]+|Overall record|Available selections|Completed selections|UFC method-selection record' /srv/appwiza-sports/public/ufc/index.html | sort -u || true
