name: Appwiza NFL email selector inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/appwiza-nfl-email-selector-inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    if: github.repository == 'maxxw71/ufc-feed' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Locate validated YPP production evaluator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nfl
          REPORT=nfl/live_ypp_evaluator_report.txt
          : > "$REPORT"
          ROOT=/home/anestishkurti92/nfl-predictor-v1
          WEB=/srv/appwiza-sports

          echo 'LIVE NFL YPP EVALUATOR REPORT' >> "$REPORT"
          date -u >> "$REPORT"
          echo >> "$REPORT"

          echo '=== FILES / REFERENCES ===' >> "$REPORT"
          timeout 30s grep -RniE -C 10 \
            '6\.2|5\.8|55%|0\.55|YPP|yards.?per.?play|market[_ ]?prob|road favorite|away favorite|prior_games|prior games' \
            "$ROOT" "$WEB" \
            --include='*.py' --include='*.sh' --include='*.js' --include='*.ts' --include='*.json' --include='*.md' \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv --exclude-dir=venv --exclude-dir=venv.google-original \
            2>/dev/null | \
          grep -Eiv 'password|secret|token|api[_-]?key|authorization|credential|smtp[_-]?(pass|password|user|host)' | \
          head -900 >> "$REPORT" || true

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REPORT"
          if ! git diff --cached --quiet; then
            git commit -m 'Capture live validated NFL YPP evaluator report'
            git push
          fi
