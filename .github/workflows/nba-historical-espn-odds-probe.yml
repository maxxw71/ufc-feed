name: NBA Historical ESPN Odds Probe

on:
  push:
    branches: [main]
    paths:
      - "nba/market/historical_espn_odds_probe.py"
      - ".github/workflows/nba-historical-espn-odds-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade requests
      - run: python nba/market/historical_espn_odds_probe.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/market/historical_espn_odds_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: record historical ESPN odds probe"
          git pull --rebase origin main
          git push
