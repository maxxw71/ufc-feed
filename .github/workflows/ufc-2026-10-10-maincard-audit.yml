name: UFC October 10 Main Card Qualifier Readonly Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ufc-2026-10-10-maincard-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read-only main card U-methods and fighter-by-fighter review
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=7 -o StrictHostKeyChecking=accept-new "$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export HOME=/home/anestishkurti92
          ROOT=$HOME/ufc-predictor-v1
          cd "$ROOT"
          "$ROOT/venv/bin/python" - <<'PY'
          import importlib.util,json
          from datetime import datetime,timezone
          spec=importlib.util.spec_from_file_location('w','ufc_email_watcher.py')
          w=importlib.util.module_from_spec(spec);spec.loader.exec_module(w)
          feed=w.fetch_feed()
          print('FEED_UPDATED_AT',feed.get('generated_at'))
          events=[e for e in feed.get('events',[]) if e.get('date')=='2026-10-10']
          assert events, 'No October 10 card'
          bundle=w.joblib.load(w.BUNDLE_PATH);reach=w.load_reach_index();skills=w.load_skill_index()
          pairs={
            frozenset(['Brendan Allen','Christian Leroy Duncan']),
            frozenset(['Matheus Camilo','Jai Herbert']),
            frozenset(['Loopy Godinez','Ketlen Souza']),
            frozenset(['Andre Fili','Kai Kamaka III']),
            frozenset(['Malcolm Wellmaker','Otari Tanzilovi'])
          }
          for e in events:
            ed=w.pd.Timestamp(e['date']).date()
            for b in e.get('bouts',[]):
              if frozenset([b.get('fighter_a'),b.get('fighter_b')]) not in pairs:continue
              p=w.predict_bout(b,ed,bundle,reach,skills)
              allcards=w._orig_method_cards_matchup(p,w.__dict__)
              qualified=w.ufc_email_design.method_cards(p,w.__dict__)
              outcome={
                'matchup':str(b.get('fighter_a'))+' vs '+str(b.get('fighter_b')),
                'start_utc':(b.get('market') or {}).get('commence_time'),
                'prediction_status':p.get('status'),
                'probabilities':{'model_a':p.get('p_a'),'model_b':p.get('p_b'),'no_vig_market_a':p.get('market_a'),'no_vig_market_b':p.get('market_b')},
                'market':{'a':p.get('best_odds_a'),'book_a':p.get('best_book_a'),'b':p.get('best_odds_b'),'book_b':p.get('best_book_b'),'ev_a_pct':p.get('ev_a_pct'),'ev_b_pct':p.get('ev_b_pct')},
                'raw_U_methods':[{'id':c.get('id'),'favorite':c.get('favorite'),'title':c.get('title')} for c in allcards],
                'approved_U_methods':[{'id':c.get('id'),'favorite':c.get('favorite'),'title':c.get('title')} for c in qualified],
                'matchup_review':{name:{'status':r.get('status'),'reasons':r.get('reasons'),'warnings':r.get('warnings'),'favorite_history':r.get('favorite_history'),'opponent_history':r.get('opponent_history')} for name,r in (p.get('matchup_reviews') or {}).items()}
              }
              print('UFC_MAINCARD_AUDIT '+json.dumps(outcome,default=str,sort_keys=True))
          print('AUDIT_DONE',datetime.now(timezone.utc).isoformat())
          PY
          REMOTE
