name: Boxing Ring CompuBox Sitemap Discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'boxing/research/discover_ring_compubox_sitemap.py'
      - '.github/workflows/boxing-ring-compubox-discovery.yml'
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python boxing/research/discover_ring_compubox_sitemap.py
      - name: Persist discovery
        shell: bash
        run: |
          set -Eeuo pipefail
          cp boxing/public_punch_audit/ring_compubox_sitemap_discovery.json /tmp/ring_compubox_sitemap_discovery.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/ring_compubox_sitemap_discovery.json boxing/public_punch_audit/
            git add boxing/public_punch_audit/ring_compubox_sitemap_discovery.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish Ring CompuBox sitemap discovery'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
