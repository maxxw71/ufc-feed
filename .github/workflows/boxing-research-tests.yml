name: Boxing research tests

on:
  push:
    paths:
      - 'boxing/research/**'
      - '.github/workflows/boxing-research-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -q beautifulsoup4 lxml python-dateutil
      - name: Compile research modules
        working-directory: boxing/research
        run: python -m py_compile *.py
      - name: Run leakage, audit, identity and market-policy tests
        working-directory: boxing/research
        run: python -m unittest test_chronological_master test_sample_audit test_market_consensus test_identity_links_v2 test_priced_career_backfill test_punch_profiles test_archived_compubox_rounds test_wba_consensus_careers test_boxingscene_compubox_summaries test_ranking_archives
