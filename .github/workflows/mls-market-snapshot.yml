name: MLS Prospective Odds Snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/mls_market_snapshot.py'
      - '.github/workflows/mls-market-snapshot.yml'

concurrency:
  group: mls-market-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Install and capture current MLS market
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          SSH="ssh -i $KEY -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new $HOST"
          cat scripts/mls_market_snapshot.py | $SSH 'set -e; D=/home/anestishkurti92/mls-predictor-v1; cat > "$D/mls_market_snapshot.py.new"; chmod 0644 "$D/mls_market_snapshot.py.new"; mv -f "$D/mls_market_snapshot.py.new" "$D/mls_market_snapshot.py"'
          $SSH 'set -Eeuo pipefail; cd /home/anestishkurti92/mls-predictor-v1; venv/bin/python -m py_compile mls_market_snapshot.py; timeout 90s venv/bin/python mls_market_snapshot.py'

      - name: Pull non-secret snapshot summary
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          mkdir -p mls/prospective
          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST"             'cat /home/anestishkurti92/mls-predictor-v1/live/market_snapshots/latest_summary.json' > mls/prospective/latest_summary.json
          cat mls/prospective/latest_summary.json

      - name: Persist snapshot status
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add mls/prospective/latest_summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update MLS prospective market snapshot status'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
