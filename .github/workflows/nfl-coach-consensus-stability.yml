name: NFL coach consensus stability
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/nfl_coach_consensus_stability.py'
permissions:
  contents: write
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Run consensus stability
        shell: bash
        run: |
          set -Eeuo pipefail
          /home/anestishkurti92/nfl-predictor-v1/venv/bin/python "$GITHUB_WORKSPACE/scripts/nfl_coach_consensus_stability.py"
      - name: Publish
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC=/home/appwiza-runner/nfl-context-data/coach_consensus_stability
          DEST="$GITHUB_WORKSPACE/nfl/coach_consensus_stability"
          mkdir -p "$DEST"
          cp "$SRC"/* "$DEST"/
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add nfl/coach_consensus_stability
          if ! git diff --cached --quiet; then
            git commit -m 'Update coach-H consensus stability results'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
