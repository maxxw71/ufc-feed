name: MLS Cross Competition Workload\n\non:\n  push:\n    branches: [main]\n    paths:\n      - 'scripts/mls_cross_comp_workload.py'\n      - '.github/workflows/mls-cross-comp-workload.yml'\n  workflow_dispatch:\n\nconcurrency:\n  group: mls-research\n  cancel-in-progress: false\n\npermissions:\n  contents: write\n\njobs:\n  build:\n    runs-on: [self-hosted, Linux, X64, appwiza]\n    timeout-minutes: 45\n    steps:\n      - uses: actions/checkout@v4\n        with: {fetch-depth: 0}\n      - name: Build workload features\n        shell: bash\n        run: |\n          set -Eeuo pipefail\n          KEY=/home/appwiza-runner/.ssh/appwiza_vps\n          HOST=anestishkurti92@127.0.0.1\n          D=/home/anestishkurti92/mls-predictor-v1\n          cat scripts/mls_cross_comp_workload.py | ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" "cat > $D/mls_cross_comp_workload.py"\n          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" "cd $D && venv/bin/python -m py_compile mls_cross_comp_workload.py && venv/bin/python mls_cross_comp_workload.py"\n      - name: Pull audit\n        shell: bash\n        run: |\n          set -Eeuo pipefail\n          KEY=/home/appwiza-runner/.ssh/appwiza_vps\n          HOST=anestishkurti92@127.0.0.1\n          mkdir -p mls/features\n          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" 'cat /home/anestishkurti92/mls-predictor-v1/reports/cross_comp_feature_meta.json' > mls/features/cross_comp_feature_meta.json\n      - name: Persist audit\n        shell: bash\n        run: |\n          set -Eeuo pipefail\n          cp mls/features/cross_comp_feature_meta.json "$RUNNER_TEMP/cross_comp_feature_meta.json"\n          git fetch origin main\n          git reset --hard origin/main\n          mkdir -p mls/features\n          cp "$RUNNER_TEMP/cross_comp_feature_meta.json" mls/features/cross_comp_feature_meta.json\n          git config user.name github-actions\n          git config user.email github-actions@github.com\n          git add mls/features/cross_comp_feature_meta.json\n          if ! git diff --cached --quiet; then git commit -m 'Publish MLS cross competition workload audit'; git push origin HEAD:main; fi\n