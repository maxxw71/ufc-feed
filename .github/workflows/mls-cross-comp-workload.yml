name: MLS Cross Competition Workload

on:
  push:
    branches: [main]
    paths:
      - 'scripts/mls_cross_comp_workload.py'
      - '.github/workflows/mls-cross-comp-workload.yml'
  workflow_dispatch:

concurrency:
  group: mls-research
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Build workload features
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          D=/home/anestishkurti92/mls-predictor-v1
          cat scripts/mls_cross_comp_workload.py | ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" "cat > $D/mls_cross_comp_workload.py"
          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" "cd $D && venv/bin/python -m py_compile mls_cross_comp_workload.py && venv/bin/python mls_cross_comp_workload.py"
      - name: Pull audit
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          mkdir -p mls/features
          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" 'cat /home/anestishkurti92/mls-predictor-v1/reports/cross_comp_feature_meta.json' > mls/features/cross_comp_feature_meta.json
      - name: Persist audit
        shell: bash
        run: |
          set -Eeuo pipefail
          cp mls/features/cross_comp_feature_meta.json "$RUNNER_TEMP/cross_comp_feature_meta.json"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p mls/features
          cp "$RUNNER_TEMP/cross_comp_feature_meta.json" mls/features/cross_comp_feature_meta.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add mls/features/cross_comp_feature_meta.json
          if ! git diff --cached --quiet; then git commit -m 'Publish MLS cross competition workload audit'; git push origin HEAD:main; fi
