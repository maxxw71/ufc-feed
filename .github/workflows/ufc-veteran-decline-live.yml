name: UFC Veteran Decline Live

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_live_veteran_decline.sh'
      - '.github/workflows/ufc-veteran-decline-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Deploy U11 U12 over local SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          test -f "$KEY"
          cat scripts/apply_live_veteran_decline.sh | \
            ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" \
            'export HOME=/home/anestishkurti92; bash -s'

      - name: Verify production watcher
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          SSH="ssh -i $KEY -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new $HOST"
          $SSH "grep -q 'VETERAN_DECLINE_LIVE_V1' /home/anestishkurti92/ufc-predictor-v1/ufc_email_watcher.py"
          $SSH "/home/anestishkurti92/ufc-predictor-v1/venv/bin/python -m py_compile /home/anestishkurti92/ufc-predictor-v1/ufc_email_watcher.py"
          $SSH "systemctl is-active ufc-model-watcher.timer"
          echo 'U11/U12 production watcher marker, syntax, and active timer verified.'

# verification trigger v2
