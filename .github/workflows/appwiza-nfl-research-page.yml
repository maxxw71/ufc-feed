name: Appwiza NFL research lab page
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/nfl_build_research_page.py'
      - 'scripts/nfl_research_page_trigger.txt'
      - 'nfl/live_candidate_finalization/**'
      - 'nfl/coach_only_final_sieve/**'
      - 'nfl/top3_timing_final_audit/**'
      - 'nfl/unique_situational_deep_dissection/**'
      - 'nfl/streak_priority_deep_dissection/**'
      - 'nfl/streak_bounceback_division_discovery/**'
      - 'nfl/legacy_live_home_opener_exact/**'
      - 'nfl/legacy_live_secondary_exact/**'
      - 'nfl/coach_consensus_priority.json'
      - 'nfl/rs_h_consensus_priority.json'
permissions:
  contents: write
jobs:
  build-deploy:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Build research page
        shell: bash
        run: |
          set -Eeuo pipefail
          /home/anestishkurti92/nfl-predictor-v1/venv/bin/python "$GITHUB_WORKSPACE/scripts/nfl_build_research_page.py"
      - name: Deploy research page without touching official tracker
        shell: bash
        run: |
          set -Eeuo pipefail
          PRIMARY_ROOT=/srv/appwiza-sports/public/nfl
          PRIMARY_DIR="$PRIMARY_ROOT/research"
          FALLBACK_ROOT=/srv/appwiza-sports/public/downloads/nfl
          FALLBACK_DIR="$FALLBACK_ROOT/research"
          REPORT="$GITHUB_WORKSPACE/nfl/research_page/deploy_report.txt"
          SRC="$GITHUB_WORKSPACE/nfl/research_page/index.html"
          {
            echo "runner=$(id)"
            echo "primary_root=$PRIMARY_ROOT"
            echo "fallback_root=$FALLBACK_ROOT"
            stat -c 'primary_stat=%U:%G %a %n' "$PRIMARY_ROOT" 2>/dev/null || true
            stat -c 'fallback_stat=%U:%G %a %n' "$FALLBACK_ROOT" 2>/dev/null || true
            echo "official_tracker_untouched=$PRIMARY_ROOT/index.html"
          } > "$REPORT"
          if [ -d "$PRIMARY_ROOT" ] && [ -w "$PRIMARY_ROOT" ]; then
            mkdir -p "$PRIMARY_DIR"
            cp "$SRC" "$PRIMARY_DIR/index.html"
            chmod 0644 "$PRIMARY_DIR/index.html" || true
            echo "deploy_status=SUCCESS_PRIMARY" >> "$REPORT"
            echo "public_url=https://appwiza.com/sports/nfl/research/" >> "$REPORT"
            stat -c 'deployed=%U:%G %a %s %n' "$PRIMARY_DIR/index.html" >> "$REPORT" || true
          elif [ -d "$FALLBACK_ROOT" ] && [ -w "$FALLBACK_ROOT" ]; then
            mkdir -p "$FALLBACK_DIR"
            cp "$SRC" "$FALLBACK_DIR/index.html"
            chmod 0664 "$FALLBACK_DIR/index.html" || true
            echo "deploy_status=SUCCESS_FALLBACK" >> "$REPORT"
            echo "public_url=https://appwiza.com/sports/downloads/nfl/research/" >> "$REPORT"
            echo "primary_blocker=ACL_MASK_READONLY_ON_NFL_DIRECTORY" >> "$REPORT"
            stat -c 'deployed=%U:%G %a %s %n' "$FALLBACK_DIR/index.html" >> "$REPORT" || true
          else
            echo "deploy_status=NO_WRITE_ACCESS" >> "$REPORT"
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add nfl/research_page
          if ! git diff --cached --quiet; then
            git commit -m 'Update Appwiza NFL research lab page'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
