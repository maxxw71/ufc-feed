name: NBA Appwiza Live Feed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nba/live/**"
      - ".github/workflows/nba-appwiza-live-feed.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: nba-appwiza-live-feed
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nba/live/build_appwiza_feed.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/live/appwiza_feed.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: refresh Appwiza live feed"
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
