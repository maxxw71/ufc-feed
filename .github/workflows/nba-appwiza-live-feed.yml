name: NBA Appwiza Live Feed
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 2
    steps:
      - name: Independent live feed status
        run: systemctl status nba-live-scan.timer --no-pager
      # Feed publication is exclusively owned by nba-live-scan.service.
