name: Boxing Data Public Punch Stats

on:
  push:
    branches: [main]
    paths:
      - 'boxing/collectors/boxing_data_public_stats.py'
      - '.github/workflows/boxing-data-public-stats.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boxing-data-public-stats
  cancel-in-progress: true

jobs:
  collect:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 15
    steps:
      - name: Prepare isolated boxing scratch space
        run: mkdir -p "${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 lxml
      - run: python boxing/collectors/boxing_data_public_stats.py
      - name: Publish supplemental report
        shell: bash
        run: |
          set -Eeuo pipefail
          cp boxing/punch_supplements/boxing_data_public_stats_report.json ${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}/boxing_data_public_stats_report.json
          cp boxing/punch_supplements/boxing_data_public_stats_rows.csv ${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}/boxing_data_public_stats_rows.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp ${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}/boxing_data_public_stats_report.json boxing/punch_supplements/boxing_data_public_stats_report.json
            cp ${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}/boxing_data_public_stats_rows.csv boxing/punch_supplements/boxing_data_public_stats_rows.csv
            git add boxing/punch_supplements/boxing_data_public_stats_report.json boxing/punch_supplements/boxing_data_public_stats_rows.csv
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Refresh Boxing Data public punch-stat supplement'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Remove this run temporary boxing files
        if: always()
        run: rm -rf -- "${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}"
