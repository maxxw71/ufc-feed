name: NBA External Odds Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "47 22 * * *"

permissions:
  contents: write

concurrency:
  group: nba-external-odds-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade requests
      - name: Capture multi-book NBA odds
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python nba/market/capture_external_odds.py
      - name: Commit external odds snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/market
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: capture external bookmaker odds"
          git pull --rebase origin main
          git push
