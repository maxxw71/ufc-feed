name: Boxing Phase 2 Force Refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boxing-phase2-force-refresh.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch current boxing Phase 2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/boxing-public-phase2.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Dispatched boxing-public-phase2.yml at main"
