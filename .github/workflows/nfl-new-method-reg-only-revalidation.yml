name: NFL new method REG-only revalidation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/nfl_new_method_reg_only_revalidation.py'
      - '.github/workflows/nfl-new-method-reg-only-revalidation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Run REG-only revalidation
        shell: bash
        run: |
          set -Eeuo pipefail
          /home/anestishkurti92/nfl-predictor-v1/venv/bin/python "$GITHUB_WORKSPACE/scripts/nfl_new_method_reg_only_revalidation.py"
      - name: Publish results
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC=/home/appwiza-runner/nfl-context-data/new_method_reg_only_revalidation
          DEST="$GITHUB_WORKSPACE/nfl/new_method_reg_only_revalidation"
          mkdir -p "$DEST"
          cp "$SRC/summary.json" "$DEST/summary.json"
          cp "$SRC/report.txt" "$DEST/report.txt"
          cp "$SRC/new_methods_reg_only_revalidation.csv" "$DEST/new_methods_reg_only_revalidation.csv"
          cp "$SRC/survivors.csv" "$DEST/survivors.csv"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add nfl/new_method_reg_only_revalidation
          if ! git diff --cached --quiet; then
            git commit -m 'Update REG-only revalidation for new NFL methods'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
