name: UFC Matchup Review Regional V2 Live
on:
  push:
    branches: [main]
    paths:
      - 'scripts/ufc_matchup_review_v1.py'
      - 'scripts/ufc_regional_history_v1.py'
      - 'ufc/regional_verified_fights.csv'
      - 'dwcs/research/regional_history/dwcs_prefight_regional_fight_detail.csv'
      - 'scripts/test_ufc_matchup_review_v1.py'
      - 'scripts/install_ufc_matchup_review_v1.py'
      - '.github/workflows/ufc-matchup-review-v1-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Test point-in-time matchup reviewer
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s scripts -p 'test_ufc_matchup_review_v1.py' -v
          python3 -m py_compile scripts/ufc_matchup_review_v1.py scripts/install_ufc_matchup_review_v1.py scripts/ufc_regional_history_v1.py
          mkdir -p "$RUNNER_TEMP/ufc-regional-build"
          python3 scripts/ufc_regional_history_v1.py \
            --archive dwcs/research/regional_history/dwcs_prefight_regional_fight_detail.csv \
            --verified ufc/regional_verified_fights.csv \
            --outdir "$RUNNER_TEMP/ufc-regional-build"
          REGIONAL_BUILD="$RUNNER_TEMP/ufc-regional-build" python3 - <<'PY'
          import csv,json,os
          from pathlib import Path
          root=Path(os.environ['REGIONAL_BUILD'])
          r=list(csv.DictReader((root/'regional_fight_history.csv').open()))
          assert len(r)>=100, 'Regional archive unexpectedly small'
          assert any(x['fighter']=='Jai Herbert' and x['opponent']=='Tony Morgan' and x['method']=='Submission' and x['event_date']=='2016-05-14' for x in r)
          assert any(x['fighter']=='Felipe Franco' and x['opponent']=='Freddy Vidal' and x['result']=='L' and x['method']=='Submission' for x in r)
          assert any(x['fighter']=='Brendson Ribeiro' and x['result']=='W' and x['method']=='Submission' for x in r)
          print('REGIONAL_FIXTURES_VERIFIED',len(r))
          PY
      - name: Deploy and verify no-send UFC canonical selection gate
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          SSH=(ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=7 -o StrictHostKeyChecking=accept-new)
          SCP=(scp -i "$KEY" -o BatchMode=yes -o ConnectTimeout=7 -o StrictHostKeyChecking=accept-new)
          "${SCP[@]}" scripts/ufc_matchup_review_v1.py "$HOST":/tmp/ufc_matchup_review_v1.py
          "${SCP[@]}" "$RUNNER_TEMP/ufc-regional-build/regional_fight_history.csv" "$HOST":/tmp/ufc_regional_fight_history_v2.csv
          "${SCP[@]}" "$RUNNER_TEMP/ufc-regional-build/regional_history_manifest.json" "$HOST":/tmp/ufc_regional_history_manifest_v2.json
          "${SCP[@]}" scripts/install_ufc_matchup_review_v1.py "$HOST":/tmp/install_ufc_matchup_review_v1.py
          "${SCP[@]}" scripts/ufc_sync_tracker_canonical.py "$HOST":/tmp/ufc_sync_tracker_canonical_matchup.py
          "${SSH[@]}" "$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export HOME=/home/anestishkurti92
          ROOT="$HOME/ufc-predictor-v1"
          PY="$ROOT/venv/bin/python"
          W="$ROOT/ufc_email_watcher.py"
          cd "$ROOT"
          BK="$W.pre-matchup-review.$(date -u +%Y%m%dT%H%M%SZ).bak"
          cp "$W" "$BK"
          rollback() {
            echo 'UFC MATCHUP V1 CHECK FAILED: restoring original watcher'
            cp "$BK" "$W"
          }
          trap rollback ERR
          mkdir -p "$ROOT/regional_history"
          cp /tmp/ufc_regional_fight_history_v2.csv "$ROOT/regional_history/regional_fight_history.csv"
          cp /tmp/ufc_regional_history_manifest_v2.json "$ROOT/regional_history/regional_history_manifest.json"
          cp /tmp/ufc_matchup_review_v1.py "$ROOT/ufc_matchup_review_v1.py"
          "$PY" /tmp/install_ufc_matchup_review_v1.py "$W"
          "$PY" -m py_compile "$W" "$ROOT/ufc_matchup_review_v1.py"
          "$PY" - <<'PY'
          import importlib.util,json
          from pathlib import Path
          from datetime import datetime,timezone
          spec=importlib.util.spec_from_file_location('w','ufc_email_watcher.py')
          w=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(w)
          assert 'UFC_MATCHUP_REVIEW_GATE_V1' in Path('ufc_email_watcher.py').read_text()
          feed=w.fetch_feed()
          events=w.ufc_lifecycle.future_events(feed.get('events') or [])
          bundle=w.joblib.load(w.BUNDLE_PATH)
          reach=w.load_reach_index();skills=w.load_skill_index()
          preds={}
          total=0;held=0;approved=0
          for e in events:
              try: ed=w.pd.Timestamp(e['date']).date()
              except Exception:continue
              group=[]
              for b in e.get('bouts') or []:
                  p=w.predict_bout(b,ed,bundle,reach,skills)
                  group.append(p);total+=1
                  reviews=p.get('matchup_reviews') or {}
                  assert len(reviews)>=2,('missing both-side analysis',b)
                  for side in reviews.values():
                      assert side['status'] in ('PASS','HOLD')
                      assert side['version']==w._review_version
                      held+=int(side['status']=='HOLD')
                  cards=w.ufc_email_design.method_cards(p,w.__dict__)
                  for card in cards:
                      assert reviews[card['favorite']]['status']=='PASS'
                      assert any('Matchup PASS' in str(check) for check in card.get('checks',[]))
                      approved+=1
              preds[w.event_key(e)]=group
          canon=w.canonical_ufc_all_picks(events,preds)
          print('EVALUATED',json.dumps({'events':len(events),'fights':total,'held_sides':held,
                                        'qualifying_method_cards':approved,'canonical_picks':len(canon)}))
          # Side-effect-free pre-fight regression for the loss that exposed the blind spot.
          case=w._review_assess({'fighter_a':'Felipe Franco','fighter_b':'Brendson Ribeiro',
                                  'market_a':.765438,'market_b':.234562},
                                 'Felipe Franco','2026-10-10',w.ROOT)
          assert case['status']=='HOLD',('dangerous UFC-only false clearance',case)
          herbert=w._review_assess({'fighter_a':'Matheus Camilo','fighter_b':'Jai Herbert'},'Matheus Camilo','2026-10-10',w.ROOT)
          assert herbert['opponent_history']['regional_submission_wins']>=1,herbert
          assert herbert['opponent_history']['latest_submission_win']=='2016-05-14',herbert
          assert 'HISTORICAL_ONLY_SUBMISSION_WIN_REQUIRES_RELEVANCE_REVIEW' in herbert['warnings'],herbert
          print('JAI_HERBERT_REGIONAL_HISTORY',json.dumps({'regional_fights':herbert['opponent_history']['regional_fights'],
              'regional_sub_wins':herbert['opponent_history']['regional_submission_wins'],
              'latest_submission_win':herbert['opponent_history']['latest_submission_win'],
              'matchup_status':herbert['status'],'warnings':herbert['warnings']}))
          print('FRANCO_RIBEIRO_PRE_FIGHT_REVIEW',json.dumps({
              'status':case['status'],'reasons':case['reasons'],
              'favorite_history':case['favorite_history'],
              'opponent_history':case['opponent_history']},default=str))
          # Site, email and canonical tracker use the SAME guarded method cards.
          w.sports_publish.publish_ufc(events,preds,w.__dict__)
          import ufc_public_page
          ufc_public_page.safe_enhance(w.sports_publish)
          assert w.validate_ufc_public_canonical(canon)
          payload=w.write_ufc_canonical(canon)
          assert payload['selection_count']==len(canon)
          review=json.loads(Path('/srv/appwiza-sports/public/ufc/matchup_reviews.json').read_text())
          assert review['reviewed_matchups']==total,(review['reviewed_matchups'],total)
          assert review['officially_approved_picks']==len(canon)
          for q in canon:
              assert any(x['approved_sides'] and q['selection'] in x['approved_sides'] for x in review['reviews'])
          print('VERIFIED_UFC_MATCHUP_GATE_V1',review['version'],'all_matchups',total,
                'site_canonical',len(canon),'no_test_email_sent',True)
          PY
          # Only future pending approvals are changed; historic picks/results,
          # first delivery, bookmaker and original odds remain immutable.
          "$PY" /tmp/ufc_sync_tracker_canonical_matchup.py
          trap - ERR
          rm -f /tmp/ufc_matchup_review_v1.py /tmp/install_ufc_matchup_review_v1.py /tmp/ufc_sync_tracker_canonical_matchup.py /tmp/ufc_regional_fight_history_v2.csv /tmp/ufc_regional_history_manifest_v2.json
          systemctl is-active ufc-model-watcher.timer
          echo 'UFC matchup review live and canonical publication verified; no emails sent'
          REMOTE
