name: UFC Age Reach Wrestling Interaction Study
on:
  push:
    branches: [main]
    paths:
      - 'scripts/ufc_age_reach_wrestling_interactions.py'
      - '.github/workflows/ufc-age-reach-wrestling-study.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run read-only chronological UFC interaction research
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/ufc_age_reach_wrestling_interactions.py
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          scp -i "$KEY" -o BatchMode=yes -o ConnectTimeout=7 -o StrictHostKeyChecking=accept-new scripts/ufc_age_reach_wrestling_interactions.py "$HOST":/tmp/ufc_age_reach_wrestling_interactions.py
          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=7 -o StrictHostKeyChecking=accept-new "$HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export HOME=/home/anestishkurti92
          ROOT="$HOME/ufc-predictor-v1"
          PY="$ROOT/venv/bin/python"
          OUT=/tmp/ufc_age_reach_wrestling_study_20261010
          mkdir -p "$OUT"
          "$PY" /tmp/ufc_age_reach_wrestling_interactions.py --input "$ROOT/feature_expansion/prefight_favorite_features_v6.csv" --outdir "$OUT"
          "$PY" - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          o=Path('/tmp/ufc_age_reach_wrestling_study_20261010')
          c=json.loads((o/'cohort_results.json').read_text())
          for item in c:
              if item['cohort'][:2] in ('05','06','07','09','10','11'):
                  print('CONFIDENCE',json.dumps({
                    'cohort':item['cohort'],'n':item['n'],
                    'roi_95_bootstrap':item.get('roi_bootstrap_95pct'),
                    'win_approx_95':item.get('win_ci_approx'),
                    'holdout_n':item['holdout']['n'],
                    'holdout_roi_95':item['holdout'].get('roi_bootstrap_95pct')},default=str))
          for case in ['06_cases.csv','07_cases.csv','09_cases.csv']:
              d=pd.read_csv(o/case)
              cols=['event_date','favorite','opponent','weightclass','win','profit100',
                    'market_prob','fav_decimal','age_adv','height_disadv',
                    'reach_disadv','f_td_a15','f_ctrl15','o_td_a15','o_td_def',
                    'o_sig_l_pm','f_fights','o_fights','period']
              for status,group in [('LOSSES',d[d.win==0]),('MOST_RECENT',d.sort_values('event_date').tail(8))]:
                  print('CASE',case,status,'count',len(group))
                  for r in group[cols].to_dict('records'):
                      print('FIGHT_ROW',json.dumps(r,default=str))
          PY
          echo "RESEARCH_OUTPUT" "$OUT"
          REMOTE
