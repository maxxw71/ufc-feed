name: NFL frozen holdout discovery
on:
  push:
    branches: [main]
    paths:
      - 'scripts/nfl_frozen_holdout_discovery.py'
      - '.github/workflows/nfl-frozen-holdout-discovery.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Run leakage-free discovery
        shell: bash
        run: |
          set -Eeuo pipefail
          /home/anestishkurti92/nfl-predictor-v1/venv/bin/python "$GITHUB_WORKSPACE/scripts/nfl_frozen_holdout_discovery.py"
      - name: Publish results
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC=/home/appwiza-runner/nfl-context-data/frozen_holdout_discovery
          DEST="$GITHUB_WORKSPACE/nfl/frozen_holdout_discovery"
          mkdir -p "$DEST"
          cp "$SRC/summary.json" "$DEST/summary.json"
          cp "$SRC/report.txt" "$DEST/report.txt"
          cp "$SRC/frozen_holdout_survivors.csv" "$DEST/frozen_holdout_survivors.csv"
          cp "$SRC/canonical_frozen_holdout_methods.csv" "$DEST/canonical_frozen_holdout_methods.csv"
          cp "$SRC/flagship_frozen_holdout_families.csv" "$DEST/flagship_frozen_holdout_families.csv"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add nfl/frozen_holdout_discovery
          if ! git diff --cached --quiet; then
            git commit -m 'Update NFL frozen holdout discovery results'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
