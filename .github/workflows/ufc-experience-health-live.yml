name: UFC Experience Health Live
on:
  push:
    paths:
      - 'scripts/apply_live_experience_health.sh'
      - '.github/workflows/ufc-experience-health-live.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, appwiza]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare production-safe U9 installer
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/apply_live_experience_health.sh').read_text()
          s=s.replace('export HOME=/home/anestishkurti92\n','')
          s=s.replace('ENV_FILE="$HOME/.config/ufc-watcher.env"\n','')
          s=s.replace('[ -f "$ENV_FILE" ] || { echo "ERROR: Missing $ENV_FILE"; exit 3; }\n','')
          old='''set -a\nsource "$ENV_FILE"\nset +a\n\necho "[ 80%] Running official watcher and publishing site state..."\npython "$WATCHER" --run --force-initial\n\necho "[ 90%] Restarting scheduled watcher..."\nsudo systemctl daemon-reload\nsudo systemctl restart ufc-model-watcher.timer\n'''
          new='''echo "[ 80%] U9 code installed; systemd restart will be performed by the authorized runner."\n'''
          if old in s:
              s=s.replace(old,new)
          else:
              # Also handle the already-transformed wording from an earlier deploy attempt.
              import re
              s=re.sub(r'echo "\[ 80%\] Restarting production watcher through systemd.*?sudo systemctl restart ufc-model-watcher\.service \|\| sudo systemctl start ufc-model-watcher\.service\n',new,s,flags=re.S)
          Path('/tmp/apply_live_experience_health_prod.sh').write_text(s)
          PY
          chmod +x /tmp/apply_live_experience_health_prod.sh
      - name: Deploy U9 over local SSH
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set +e
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          SSH="ssh -i $KEY -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new $HOST"
          cat /tmp/apply_live_experience_health_prod.sh | $SSH 'export HOME=/home/anestishkurti92; bash -s' > "$GITHUB_WORKSPACE/ufc_u9_deploy.log" 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Restart production UFC watcher
        if: steps.deploy.outputs.exit_code == '0'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo systemctl daemon-reload
          sudo systemctl restart ufc-model-watcher.timer
          sudo systemctl restart ufc-model-watcher.service || sudo systemctl start ufc-model-watcher.service
      - name: Verify live watcher and public UFC page
        if: steps.deploy.outputs.exit_code == '0'
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          SSH="ssh -i $KEY -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new $HOST"
          $SSH "grep -q 'EXPERIENCE_HEALTH_RULE_V1' /home/anestishkurti92/ufc-predictor-v1/ufc_email_watcher.py"
          $SSH "/home/anestishkurti92/ufc-predictor-v1/venv/bin/python -m py_compile /home/anestishkurti92/ufc-predictor-v1/ufc_email_watcher.py"
          systemctl is-active ufc-model-watcher.timer
          curl -fsSL https://appwiza.com/sports/ufc/ > /tmp/ufc-u9-live.html
          grep -q 'Available selections' /tmp/ufc-u9-live.html
          echo 'U9 watcher marker, syntax, timer, and public UFC page verified.'
      - name: Save deploy diagnostic
        shell: bash
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git checkout -B ufc-u9-deploy-output
          git add -f ufc_u9_deploy.log
          git commit -m 'UFC U9 deploy diagnostic' || true
          git push -f origin ufc-u9-deploy-output
      - name: Fail if deployment failed
        if: steps.deploy.outputs.exit_code != '0'
        run: exit 1
