name: NFL public page enhance deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nfl/nfl_public_page.py'
      - 'nfl/live_2026_current_snapshot/current_board_fresh_context.csv'
      - '.github/workflows/nfl-public-page-enhance-deploy.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install presentation enhancer and fresh board context
        shell: bash
        run: |
          set -Eeuo pipefail
          LIVE=/home/anestishkurti92/nfl-predictor-v1/research_v2
          SCANNER="$LIVE/nfl_home_opener_scanner.py"
          mkdir -p "$LIVE/page_context"
          cp nfl/nfl_public_page.py "$LIVE/nfl_public_page.py.new"
          mv "$LIVE/nfl_public_page.py.new" "$LIVE/nfl_public_page.py"
          cp nfl/live_2026_current_snapshot/current_board_fresh_context.csv "$LIVE/page_context/current_board_fresh_context.csv.new"
          mv "$LIVE/page_context/current_board_fresh_context.csv.new" "$LIVE/page_context/current_board_fresh_context.csv"
          python3 - "$SCANNER" <<'PY'
          from pathlib import Path
          p=Path(__import__('sys').argv[1]);s=p.read_text()
          if 'import nfl_public_page' not in s:
              needle='import sports_publish\n'
              if needle not in s: raise SystemExit('sports_publish import anchor missing')
              s=s.replace(needle,needle+'import nfl_public_page\n',1)
          call='sports_publish.publish_nfl(records,now,nfl_email_design)'
          enhanced=call+'\n nfl_public_page.safe_enhance(now,ledger,sports_publish)'
          if 'nfl_public_page.safe_enhance' not in s:
              if call not in s: raise SystemExit('publish call anchor missing')
              s=s.replace(call,enhanced,1)
          p.write_text(s)
          PY
          /home/anestishkurti92/nfl-predictor-v1/venv/bin/python -m py_compile "$LIVE/nfl_public_page.py" "$SCANNER"
      - name: Diagnose publisher runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '--- matching modules ---'
          find /home/anestishkurti92 /opt/appwiza-sports-imports /srv/appwiza-sports -type f \( -name sports_publish.py -o -name bet_tracker.py -o -iname '*ledger*.json' -o -iname '*email_state*.json' \) 2>/dev/null | head -80 || true
          echo '--- state summary ---'
          /home/anestishkurti92/nfl-predictor-v1/venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/srv/appwiza-sports/state/nfl.json')
          print('state_exists',p.exists(),'size',p.stat().st_size if p.exists() else None)
          if p.exists():
              d=json.loads(p.read_text())
              print('state_keys',sorted(d.keys()))
              cards=d.get('cards') or []
              print('cards',len(cards))
              for c in cards[:5]:
                  print('card_keys',sorted(c.keys()))
                  print('card_sample',{k:c.get(k) for k in ['id','selection','fixture','start','price','withdrawn','result','settlement']})
          PY
          echo '--- existing page markers ---'
          grep -o 'Overall record</span><b>[^<]*' /srv/appwiza-sports/public/nfl/index.html | head -1 || true
          grep -o 'Tracked ROI</span><b[^>]*>[^<]*' /srv/appwiza-sports/public/nfl/index.html | head -1 || true
      - name: Verify current page only
        shell: bash
        run: |
          set -Eeuo pipefail
          PAGE=/srv/appwiza-sports/public/nfl/index.html
          test -s "$PAGE"
          grep -q '/sports/nfl/research/' "$PAGE"
