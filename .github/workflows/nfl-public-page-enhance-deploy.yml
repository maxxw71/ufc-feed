name: NFL public page enhance deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nfl/nfl_public_page.py'
      - 'nfl/live_2026_current_snapshot/current_board_fresh_context.csv'
      - 'scripts/nfl_patch_public_page_deep_audit.py'
      - 'scripts/nfl_suppress_veto_available.py'
      - '.github/workflows/nfl-public-page-enhance-deploy.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install future scanner enhancer and fresh board context
        shell: bash
        run: |
          set -Eeuo pipefail
          LIVE=/home/anestishkurti92/nfl-predictor-v1/research_v2
          SCANNER="$LIVE/nfl_home_opener_scanner.py"
          mkdir -p "$LIVE/page_context"
          cp nfl/nfl_public_page.py "$LIVE/nfl_public_page.py.new"
          mv "$LIVE/nfl_public_page.py.new" "$LIVE/nfl_public_page.py"
          cp nfl/live_2026_current_snapshot/current_board_fresh_context.csv "$LIVE/page_context/current_board_fresh_context.csv.new"
          mv "$LIVE/page_context/current_board_fresh_context.csv.new" "$LIVE/page_context/current_board_fresh_context.csv"
          python3 - "$SCANNER" <<'PY'
          from pathlib import Path
          p=Path(__import__('sys').argv[1]);s=p.read_text()
          if 'import nfl_public_page' not in s:
              needle='import sports_publish\n'
              if needle not in s: raise SystemExit('sports_publish import anchor missing')
              s=s.replace(needle,needle+'import nfl_public_page\n',1)
          call='sports_publish.publish_nfl(records,now,nfl_email_design)'
          enhanced=call+'\n nfl_public_page.safe_enhance(now,ledger,sports_publish)'
          if 'nfl_public_page.safe_enhance' not in s:
              if call not in s: raise SystemExit('publish call anchor missing')
              s=s.replace(call,enhanced,1)
          p.write_text(s)
          PY
          /home/anestishkurti92/nfl-predictor-v1/venv/bin/python -m py_compile "$LIVE/nfl_public_page.py" "$SCANNER"
      - name: Patch fresh deep audit into current public page
        shell: bash
        run: |
          set -Eeuo pipefail
          export NFL_PUBLIC_PAGE=/srv/appwiza-sports/public/nfl/index.html
          export NFL_BOARD_CONTEXT="$GITHUB_WORKSPACE/nfl/live_2026_current_snapshot/current_board_fresh_context.csv"
          /home/anestishkurti92/nfl-predictor-v1/venv/bin/python scripts/nfl_patch_public_page_deep_audit.py
          /home/anestishkurti92/nfl-predictor-v1/venv/bin/python scripts/nfl_suppress_veto_available.py
      - name: Verify and publish deploy report
        shell: bash
        run: |
          set -Eeuo pipefail
          R=nfl/public_page_enhance_report.txt
          PAGE=/srv/appwiza-sports/public/nfl/index.html
          python3 - "$PAGE" <<'PY' > /tmp/nfl_available_verify.txt
          from pathlib import Path
          import sys
          s=Path(sys.argv[1]).read_text()
          a='<h2>Available selections</h2>'
          i=s.find(a)
          j=s.find('<div class="section-kicker">Tracked results</div>',i)
          if j < 0: j=s.find('<h2>Completed selections</h2>',i)
          seg=s[i:j] if i>=0 and j>=0 else ''
          print('available_saints_to_win='+str(seg.lower().count('saints to win')))
          print('available_titans_to_win='+str(seg.lower().count('titans to win')))
          print('available_ravens_to_win='+str(seg.lower().count('ravens to win')))
          PY
          {
            echo "scanner_patch=$(grep -c 'nfl_public_page.safe_enhance' /home/anestishkurti92/nfl-predictor-v1/research_v2/nfl_home_opener_scanner.py || true)"
            echo "research_link=$(grep -c '/sports/nfl/research/' "$PAGE" || true)"
            echo "overall_record=$(grep -c 'Overall record' "$PAGE" || true)"
            echo "completed_table=$(grep -c 'Completed selections' "$PAGE" || true)"
            echo "deep_audit=$(grep -c '2026 deep audit' "$PAGE" || true)"
            echo "coaching_context=$(grep -c 'Coaching + games already played' "$PAGE" || true)"
            echo "refined_veto=$(grep -c 'Refined veto' "$PAGE" || true)"
            echo "saints_no_bet=$(grep -c 'NO BET' "$PAGE" || true)"
            cat /tmp/nfl_available_verify.txt
            echo "deep_css=$(test -f /srv/appwiza-sports/public/nfl/deep-audit.css && echo yes || echo no)"
            echo "fresh_context=$(test -s /home/anestishkurti92/nfl-predictor-v1/research_v2/page_context/current_board_fresh_context.csv && echo yes || echo no)"
            stat -c 'page=%U:%G %a %s %n' "$PAGE"
          } > "$R"
          cat "$R"
          grep -q '2026 deep audit' "$PAGE"
          grep -q 'Coaching + games already played' "$PAGE"
          grep -q 'NO BET' "$PAGE"
          grep -q '^available_saints_to_win=0$' /tmp/nfl_available_verify.txt
          grep -q '^available_titans_to_win=0$' /tmp/nfl_available_verify.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add "$R"
          if ! git diff --cached --quiet; then
            git commit -m 'Record NFL dashboard enhancement deploy'
            for n in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              test "$n" -lt 3 || exit 1
              sleep $((n*2))
            done
          fi
