name: NFL public page canonical deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nfl/nfl_public_page.py'
      - 'scripts/patch_nfl_page_contract_guard.py'
      - 'nfl/live_2026_current_snapshot/current_board_fresh_context.csv'
      - '.github/workflows/nfl-public-page-enhance-deploy.yml'

concurrency:
  group: appwiza-sports-public-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Reject stale NFL page source
        id: freshness
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          THIS=$(sha256sum nfl/nfl_public_page.py | awk '{print $1}')
          LATEST=$(git show origin/main:nfl/nfl_public_page.py | sha256sum | awk '{print $1}')
          echo "this=$THIS latest=$LATEST"
          if [ "$THIS" != "$LATEST" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "STALE NFL PAGE RUN — skipping server write"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate canonical NFL source
        if: steps.freshness.outputs.deploy == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile nfl/nfl_public_page.py
          grep -q "PAGE_CONTRACT='NFL_PUBLIC_CANONICAL_V2_20260919'" nfl/nfl_public_page.py
          grep -q 'Method Key · NFL' nfl/nfl_public_page.py
          grep -q 'H-series research / shadow methods' nfl/nfl_public_page.py

      - name: Install canonical enhancer and regenerate
        if: steps.freshness.outputs.deploy == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          SSH="ssh -i $KEY -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new $HOST"
          cat nfl/nfl_public_page.py | $SSH 'cat > /home/anestishkurti92/nfl-predictor-v1/research_v2/nfl_public_page.py'
          cat nfl/live_2026_current_snapshot/current_board_fresh_context.csv | $SSH 'mkdir -p /home/anestishkurti92/nfl-predictor-v1/research_v2/page_context; cat > /home/anestishkurti92/nfl-predictor-v1/research_v2/page_context/current_board_fresh_context.csv'
          cat scripts/patch_nfl_page_contract_guard.py | $SSH 'cat > /tmp/patch_nfl_page_contract_guard.py'
          $SSH 'set -Eeuo pipefail; export HOME=/home/anestishkurti92; export PYTHONPATH=/home/anestishkurti92/nfl-predictor-v1/research_v2:/home/anestishkurti92/betting-ledger/code:/opt/sports-publisher; cd /home/anestishkurti92/nfl-predictor-v1/research_v2; /home/anestishkurti92/nfl-predictor-v1/venv/bin/python /tmp/patch_nfl_page_contract_guard.py nfl_home_opener_scanner.py; /home/anestishkurti92/nfl-predictor-v1/venv/bin/python -m py_compile nfl_public_page.py nfl_home_opener_scanner.py; grep -q NFL_PUBLIC_PAGE_CONTRACT_GUARD_V1 nfl_home_opener_scanner.py; /home/anestishkurti92/nfl-predictor-v1/venv/bin/python nfl_home_opener_scanner.py --manual'

      - name: Verify canonical NFL live page
        if: steps.freshness.outputs.deploy == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://appwiza.com/sports/nfl/ > /tmp/nfl-live.html
          grep -q 'Actionable now' /tmp/nfl-live.html
          grep -q '2026 deep audit' /tmp/nfl-live.html
          grep -q 'Method Key · NFL' /tmp/nfl-live.html
          grep -q 'H-series research / shadow methods' /tmp/nfl-live.html
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" "grep -q NFL_PUBLIC_PAGE_CONTRACT_GUARD_V1 /home/anestishkurti92/nfl-predictor-v1/research_v2/nfl_home_opener_scanner.py"
          echo 'NFL canonical page deploy and contract guard verified'
