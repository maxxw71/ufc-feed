name: NBA Depth Chart Snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nba/depthcharts/capture_depthcharts.py"
      - ".github/workflows/nba-depthchart-snapshot.yml"
  schedule:
    - cron: "29 */3 * * *"

permissions:
  contents: write

concurrency:
  group: nba-depthchart-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade requests
      - run: python nba/depthcharts/capture_depthcharts.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/depthcharts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: capture depth-chart snapshot"
          git pull --rebase origin main
          git push
