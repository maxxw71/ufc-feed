name: Odds Credential Narrow Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/odds-credential-narrow-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect credential wiring safely
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" 'bash -s' <<'EOF'
          set -Eeuo pipefail
          echo '=== UFC DIRECT FILE ==='
          grep -nEi 'the-odds|api_key|apikey|odds.*key|key.*odds' /home/anestishkurti92/ufc-predictor-v1/ufc_email_watcher.py | head -80 || true
          echo '=== NFL SNAPSHOT FILE ==='
          for p in /home/anestishkurti92/nfl-predictor-v1/scripts/nfl_snapshot_market.py /home/anestishkurti92/nfl-predictor-v1/research_v2/nfl_snapshot_market.py; do
            [ -f "$p" ] && { echo FILE=$p; grep -nEi 'the-odds|api_key|apikey|odds.*key|key.*odds' "$p" | head -80 || true; }
          done
          echo '=== ENV NAMES ONLY ==='
          p=/home/anestishkurti92/.config/ufc-watcher.env
          if [ -f "$p" ]; then
            sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' "$p"
          fi
          EOF
