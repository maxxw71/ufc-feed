name: Crypto 1D 4H fast research

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crypto-blowoff-1d4h-fast.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --quiet pandas numpy requests
      - name: Run fast 1D plus 4H study
        run: |
          python crypto/research/blowoff_rebound_1d4h.py             --symbols 120             --days 900             --out crypto/research/results_1d4h_fast
      - name: Commit outputs
        run: |
          git config user.name "appwiza-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crypto/research/results_1d4h_fast
          if ! git diff --cached --quiet; then
            git commit -m "Update fast 1D plus 4H crypto research"
            git push origin HEAD:main
          fi
