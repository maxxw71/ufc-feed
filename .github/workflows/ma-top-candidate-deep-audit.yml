name: MA top candidate deep audit

on:
  push:
    branches: [main]
    paths:
      - 'crypto/research/ma_top_candidate_deep_audit.py'
      - '.github/workflows/ma-top-candidate-deep-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ma-top-candidate-deep-audit
  cancel-in-progress: true

jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy requests
      - run: python crypto/research/ma_top_candidate_deep_audit.py --mode scan --shard-index ${{ matrix.shard }} --shard-count 4 --sleep 0.10 --out ma_top_out
      - uses: actions/upload-artifact@v4
        with:
          name: ma-top-${{ matrix.shard }}
          path: ma_top_out/
          retention-days: 2
  aggregate:
    needs: replay
    if: always() && needs.replay.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pandas numpy requests
      - uses: actions/download-artifact@v4
        with:
          pattern: ma-top-*
          path: ma_top_shards
          merge-multiple: true
      - run: python crypto/research/ma_top_candidate_deep_audit.py --mode aggregate --input-dir ma_top_shards --out crypto/research/results_ma_top_candidate_deep_audit
      - name: Commit audit
        run: |
          git config user.name "appwiza-research-bot"
          git config user.email actions@users.noreply.github.com
          git add crypto/research/results_ma_top_candidate_deep_audit
          if ! git diff --cached --quiet; then
            git commit -m "Update MA top-candidate deep audit"
            git pull --rebase -X ours origin main || true
            git push origin HEAD:main || true
          fi
