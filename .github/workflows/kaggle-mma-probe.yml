name: Kaggle MMA Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kaggle_mma_probe.py"
      - ".github/workflows/kaggle-mma-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - run: python kaggle_mma_probe.py
