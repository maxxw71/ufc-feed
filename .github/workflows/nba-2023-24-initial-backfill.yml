name: NBA 2023-24 Initial Backfill

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nba-2023-24-initial-backfill.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-2023-24-initial-backfill
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade requests
      - name: Backfill 2023-24 games, players and play-by-play
        run: |
          python nba/bootstrap_dataset.py             --slice "2023-24|Regular Season"             --slice "2023-24|Post Season"
      - name: Validate selected season structure
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          for st in ("regular_season","post_season"):
              p=pathlib.Path("nba/data/2023_24")/st/"summary.json"
              s=json.loads(p.read_text())
              assert s["team_rows"] == 2*s["games_written"], s
              if st=="regular_season":
                  assert s["games_written"] >= 1200, s
                  assert s["player_rows"] > 0 and s["playbyplay_rows"] > 0, s
              print(st,s)
          PY
      - name: Commit only 2023-24 season data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/data/2023_24
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: backfill 2023-24 season"
          git pull --rebase origin main
          git push
