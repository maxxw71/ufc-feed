name: NBA 2025-26 Schedule Overcount Diagnostic
on:
  push:
    branches: [main]
    paths:
      - "nba/diagnostics/diagnose_2025_26_overcount.py"
      - ".github/workflows/nba-2025-26-overcount-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade requests
      - run: python nba/diagnostics/diagnose_2025_26_overcount.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/diagnostics/2025_26_regular_overcount.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: record 2025-26 schedule overcount diagnostic"
          git pull --rebase origin main
          git push
