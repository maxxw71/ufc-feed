name: Boxing historical odds strict validation
on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/validate_historical_odds_snapshot.py'
      - 'boxing/research/test_historical_odds_snapshot.py'
      - '.github/workflows/boxing-historical-odds-validate.yml'
      - 'boxing/public_reports/HISTORICAL_ODDS_WAYBACK_PILOT.json'
      - 'boxing/public_reports/HISTORICAL_ODDS_WAYBACK_INDEX.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -q beautifulsoup4 lxml
      - name: Download compact boxing research database
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import io,os,urllib.request,zipfile
          url='https://appwiza.com/sports/downloads/boxing/research-database.zip'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 AppwizaHistoricalOddsValidator/1.1'})
          with urllib.request.urlopen(req,timeout=180) as r:data=r.read()
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              name=next(n for n in z.namelist() if n.endswith('.sqlite3'))
              open('/tmp/boxing_research.sqlite3','wb').write(z.read(name))
          print('database_bytes',os.path.getsize('/tmp/boxing_research.sqlite3'))
          PY
      - name: Validate archived prices on hosted network
        env:
          BOXING_DB: /tmp/boxing_research.sqlite3
        run: python boxing/research/validate_historical_odds_snapshot.py
      - name: Persist strict historical odds validation on latest main
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/historical-odds-validation
          cp boxing/public_reports/HISTORICAL_ODDS_VALIDATION_REPORT.json /tmp/historical-odds-validation/
          cp boxing/public_reports/HISTORICAL_ODDS_VALIDATED_ROWS.json /tmp/historical-odds-validation/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/historical-odds-validation/* boxing/public_reports/
          git add boxing/public_reports/HISTORICAL_ODDS_VALIDATION_REPORT.json boxing/public_reports/HISTORICAL_ODDS_VALIDATED_ROWS.json
          if git diff --cached --quiet; then
            echo 'No strict historical odds validation changes.'
          else
            git commit -m 'Publish validated historical boxing prices'
            git push origin HEAD:main
          fi
