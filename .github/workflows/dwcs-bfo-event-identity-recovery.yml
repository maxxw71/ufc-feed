name: DWCS BFO Event Identity Odds Recovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dwcs-bfo-event-identity-recovery.yml'
      - 'dwcs/research/recover_bfo_odds_via_events.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas requests beautifulsoup4 rapidfuzz
      - name: Recover missing historical odds through canonical BFO event identity
        run: python dwcs/research/recover_bfo_odds_via_events.py
      - name: Commit recovered odds
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add dwcs/research/historical_odds
          git diff --cached --quiet && exit 0
          git commit -m 'Recover DWCS historical odds through BFO event identity'
          git pull --rebase origin main
          git push
