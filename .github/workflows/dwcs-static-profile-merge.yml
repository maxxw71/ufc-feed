name: DWCS Verified Static Profile Merge
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dwcs-static-profile-merge.yml'
      - 'dwcs/research/merge_verified_ufc_static_profiles.py'
      - 'dwcs/research/ufc_com_verified/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas numpy
      - name: Merge verified static UFC.com fields
        run: python dwcs/research/merge_verified_ufc_static_profiles.py
      - name: Commit merged physicals
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add dwcs/research/static_profile_merge
          git diff --cached --quiet && exit 0
          git commit -m 'Merge verified UFC.com static fields into DWCS profiles'
          git pull --rebase origin main
          git push
