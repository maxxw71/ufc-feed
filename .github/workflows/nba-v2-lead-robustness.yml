name: NBA V2 Lead Robustness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nba/research/audit_v2_leads.py"
      - ".github/workflows/nba-v2-lead-robustness.yml"

permissions:
  contents: write

concurrency:
  group: nba-v2-lead-robustness
  cancel-in-progress: true

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nba/build_market_features.py
      - run: python nba/research/audit_v2_leads.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/research/v2/lead_robustness_report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: audit V2 lead robustness and overlap"
          git fetch origin main
          git rebase origin/main
          git push
