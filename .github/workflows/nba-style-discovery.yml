name: NBA playing style discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/build_team_style_rolling.py'
      - 'nba/research/discover_style.py'
      - '.github/workflows/nba-style-discovery.yml'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nba/build_team_style_rolling.py
      - run: python nba/research/discover_style.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/features/team_style_rolling.csv.gz nba/features/team_style_rolling_summary.json nba/research/style
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: add playing style discovery results"
          git pull --rebase origin main
          git push
