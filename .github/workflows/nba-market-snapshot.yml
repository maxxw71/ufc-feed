name: NBA Market Snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nba/market/capture_market.py"
      - ".github/workflows/nba-market-snapshot.yml"
  schedule:
    - cron: "23 */3 * * *"

permissions:
  contents: write

concurrency:
  group: nba-market-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade requests
      - name: Capture timestamped NBA market state
        run: python nba/market/capture_market.py
      - name: Commit market snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/market
          if git diff --cached --quiet; then
            echo "No market changes."
            exit 0
          fi
          git commit -m "nba: capture market snapshot"
          git pull --rebase origin main
          git push
