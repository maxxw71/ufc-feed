name: UFC Frozen Shadow Tracker

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ufc_shadow_tracker.py'
      - '.github/workflows/ufc-shadow-tracker-live.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Update UFC Feed
    types: [completed]
    branches: [main]
  schedule:
    - cron: '25 4,10,16,22 * * *'

concurrency:
  group: ufc-frozen-shadow-tracker
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install isolated prospective shadow tracker
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          SSH="ssh -i $KEY -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new $HOST"
          cat scripts/ufc_shadow_tracker.py | $SSH 'set -e; D=/home/anestishkurti92/ufc-predictor-v1; cat > "$D/ufc_shadow_tracker.py.new"; chmod 0700 "$D/ufc_shadow_tracker.py.new"; mv -f "$D/ufc_shadow_tracker.py.new" "$D/ufc_shadow_tracker.py"'
          $SSH 'bash -s' <<'EOF'
          set -Eeuo pipefail
          export HOME=/home/anestishkurti92
          ROOT=/home/anestishkurti92/ufc-predictor-v1
          cd "$ROOT"
          test -x venv/bin/python
          test -f ufc_feature_expansion.py
          test -f auto_research/state/prospective_ufc.sqlite3
          venv/bin/python -m py_compile ufc_shadow_tracker.py
          venv/bin/python ufc_shadow_tracker.py run
          echo '=== SHADOW TRACKER STATE ==='
          venv/bin/python - <<'PY'
          import json,sqlite3
          from pathlib import Path
          p=Path('auto_research/state/shadow_tracker.sqlite3')
          c=sqlite3.connect(p)
          print('rules',c.execute('select count(*) from shadow_rules').fetchone()[0])
          print('picks',c.execute('select count(*) from shadow_picks').fetchone()[0])
          print('pending',c.execute("select count(*) from shadow_picks where status='pending'").fetchone()[0])
          print('official_integration',0)
          print('pending_rows',[dict(zip([c[0] for c in c.execute("pragma table_info(shadow_picks)").fetchall()],[]))] if False else [
            dict(r) for r in (lambda db: (setattr(db,'row_factory',sqlite3.Row) or db).execute(
              "select event_date,selection,opponent,quote_american,rule_ids_json,strong_opp_sig_diff,days_since_ko_loss_diff,status from shadow_picks where status='pending' order by event_date"
            ))(sqlite3.connect(p))
          ])
          print('public_state',json.loads(Path('/srv/appwiza-sports/public/ufc/shadow/state.json').read_text())['overall_unique'])
          PY
          echo '=== SHADOW SCHEDULER ==='
          echo 'GitHub Actions schedule: 04:25, 10:25, 16:25, 22:25 UTC'
          echo '=== OFFICIAL ISOLATION CHECK ==='
          test -f /home/anestishkurti92/betting-ledger/code/bet_tracker.py
          ! grep -q 'ufc_shadow_tracker' ufc_email_watcher.py
          ! grep -q 'shadow_tracker' /home/anestishkurti92/betting-ledger/code/bet_tracker.py
          echo 'Shadow tracker installed separately from official UFC methods.'
          EOF
