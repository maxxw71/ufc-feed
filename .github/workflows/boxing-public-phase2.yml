name: Boxing public Phase 2

on:
  push:
    paths:
      - '.github/workflows/boxing-public-phase2.yml'
      - 'boxing/research/**'
      - 'boxing/supplemental_careers/**'
      - 'boxing/profile_supplements/**'
      - 'boxing/punch_supplements/**'
      - 'boxing/rankings/**'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Boxing WBC Monthly Rankings Archive
      - Boxing WBA Monthly Rankings Archive
      - Boxing WBO Historical Rankings Archive
      - Boxing WBA Profile Backfill
      - Boxing Wikidata Nationality Backfill
      - Boxing Wikipedia Lead Nationality Backfill
      - Boxing WBC Eurasia Profile Backfill
      - Boxing CompuBox Historical Summary Archive
      - Boxing Archived CompuBox Summary Archive
      - Boxing Ring CompuBox Summary Archive
      - Boxing Ready To Fight Punch Archive
      - Boxing WBC Reach Backfill
      - Boxing Cross Source Reach Backfill
      - Boxing Ranking Nationality Backfill
      - Boxing WBO Verified-PDF Repair
      - Boxing IBF Historical Rankings Archive
      - Boxing IBF Official Bout Archive
      - Boxing strict profile enrichment
      - Boxing secondary career recovery
      - Boxing priced career backfill
      - Boxing self-hosted career retry
    types: [completed]
    branches: [main]

concurrency:
  # Keep push builds separate from workflow_run callbacks. A failed/skipped
  # upstream callback is evaluated at the job level; it must never cancel a
  # valid push rebuild before that condition is evaluated.
  group: boxing-public-phase2-server-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analyze:
    if: github.repository == 'maxxw71/ufc-feed' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 40
    steps:
      - name: Prepare isolated boxing scratch space
        run: mkdir -p "${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build authoritative server release
        run: |
          python boxing/research/run_research_release.py --repo "$GITHUB_WORKSPACE" --work "${{ runner.temp }}/boxing-release-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Refresh coverage from the new release
        run: python boxing/research/build_current_dataset_status.py
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boxing-public-phase2
          path: boxing/public_phase2/
          if-no-files-found: warn
      - name: Commit compact public results
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}/boxing-phase2-results
          cp -R boxing/public_phase2/. ${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}/boxing-phase2-results/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            cp -R ${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}/boxing-phase2-results/. boxing/public_phase2/
            git add boxing/public_phase2
            if git diff --cached --quiet; then
              echo 'No research result changes.'
              exit 0
            fi
            git commit -m 'Update public boxing research'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying against latest main."
            sleep $((attempt * 2))
          done
          echo 'Failed to publish Phase 2 results after retries.'
          exit 1

# phase2-refresh: 2026-09-23T22:12-04:00 corrected-archive

# legacy-compubox-rebuild: 2026-09-27T11:05Z

# rebuild-after-legacy-22: 2026-09-27T11:23Z

# reach-rebuild-after-boxnow-2026-09-28

# reach-rebuild-after-boxnow-full-merge: 2026-09-28T10:30Z

# post-reach-integrity-cleanup-2026-09-29

# final-reach-integrity-rebuild-2026-09-29T13-00

# final-reach-integrity-rebuild-2026-09-29T21:35Z

# final-final-reach-integrity-rebuild-2026-09-29T21:40Z

      - name: Remove this run temporary boxing files
        if: always()
        run: rm -rf -- "${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}"
