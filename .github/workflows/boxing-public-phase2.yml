name: Boxing public Phase 2

on:
  push:
    paths:
      - '.github/workflows/boxing-public-phase2.yml'
      - 'boxing/research/**'
      - 'boxing/supplemental_careers/**'
      - 'boxing/profile_supplements/**'
      - 'boxing/punch_supplements/**'
      - 'boxing/rankings/**'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Boxing WBC Monthly Rankings Archive
      - Boxing WBA Monthly Rankings Archive
      - Boxing WBO Historical Rankings Archive
      - Boxing WBA Profile Backfill
      - Boxing Wikidata Nationality Backfill
      - Boxing Wikipedia Lead Nationality Backfill
      - Boxing WBC Eurasia Profile Backfill
      - Boxing CompuBox Historical Summary Archive
      - Boxing Ready To Fight Punch Archive
      - Boxing WBC Reach Backfill
      - Boxing Ranking Nationality Backfill
      - Boxing WBO Verified-PDF Repair
      - Boxing IBF Historical Rankings Archive
      - Boxing IBF Official Bout Archive
      - Boxing strict profile enrichment
      - Boxing secondary career recovery
      - Boxing priced career backfill
      - Boxing self-hosted career retry
    types: [completed]
    branches: [main]

concurrency:
  group: boxing-public-phase2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  analyze:
    if: github.repository == 'maxxw71/ufc-feed' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and unpack public boxing research database
        run: |
          python - <<'PY'
          import io,os,sqlite3,urllib.request,zipfile,json,shutil
          url='https://appwiza.com/sports/downloads/boxing/research-database.zip'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 AppwizaPublicPhase2/1.0'})
          with urllib.request.urlopen(req,timeout=180) as r:data=r.read()
          z=zipfile.ZipFile(io.BytesIO(data)); z.extractall('/tmp/boxing-public')
          dbs=[]
          for root,dirs,files in os.walk('/tmp/boxing-public'):
              for f in files:
                  if f.endswith('.sqlite3'): dbs.append(os.path.join(root,f))
          out={'archive_bytes':len(data),'sqlite_files':dbs}
          if not dbs:
              os.makedirs('boxing/public_phase2',exist_ok=True)
              open('boxing/public_phase2/status.json','w').write(json.dumps({**out,'status':'no_sqlite_database'},indent=2))
              raise SystemExit(0)
          preferred=next((p for p in dbs if os.path.basename(p) in {'boxing.sqlite3','boxing_research.sqlite3'}),dbs[0])
          os.makedirs('/tmp/boxing-research',exist_ok=True)
          shutil.copy2(preferred,'/tmp/boxing-research/boxing.sqlite3')
          con=sqlite3.connect(preferred)
          tables=[r[0] for r in con.execute("select name from sqlite_master where type='table' order by name")]
          con.close()
          out.update({'selected_database':preferred,'tables':tables,'status':'database_ready'})
          os.makedirs('boxing/public_phase2',exist_ok=True)
          open('boxing/public_phase2/database_status.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Prepare current research code and verified supplements
        run: |
          cp boxing/research/*.py /tmp/boxing-research/
          if [ -d boxing/supplemental_careers ]; then cp -R boxing/supplemental_careers /tmp/supplemental_careers; fi
          if [ -d boxing/profile_supplements ]; then cp -R boxing/profile_supplements /tmp/profile_supplements; fi
          if [ -d boxing/punch_supplements ]; then rm -rf /tmp/punch_supplements && cp -R boxing/punch_supplements /tmp/punch_supplements; fi
          if [ -d boxing/rankings ]; then cp -R boxing/rankings /tmp/boxing-research/rankings; fi
          if [ -d boxing/official_bouts ]; then rm -rf /tmp/official_bouts && cp -R boxing/official_bouts /tmp/official_bouts; fi
      - name: Build chronological master and run research passes
        run: |
          cd /tmp/boxing-research
          python - <<'PY'
          import sqlite3,json
          db=sqlite3.connect('boxing.sqlite3')
          tables={r[0] for r in db.execute("select name from sqlite_master where type='table'")}
          required={'bouts','normalized_fighters','opponent_links','priced_bout_research'}
          missing=sorted(required-tables)
          if missing:
              open('/tmp/boxing_phase2_missing.json','w').write(json.dumps({'status':'missing_required_tables','missing':missing,'tables':sorted(tables)},indent=2))
              print('Missing required tables:',missing)
              raise SystemExit(20)
          PY
          python build_punch_profiles.py --db boxing.sqlite3 --out punch_profiles
          python apply_supplemental_careers.py
          python apply_profile_supplements.py
          python - <<'PY'
          import sqlite3,subprocess,sys
          db=sqlite3.connect('boxing.sqlite3')
          has_source_rows=bool(db.execute("select 1 from sqlite_master where type='table' and name='source_rows'").fetchone())
          db.close()
          if has_source_rows:
              subprocess.run([sys.executable,'match_prices.py'],check=True)
          else:
              print('PRICE_REMATCH_SKIPPED: compact research DB omits source_rows; supplemental quote links retained.')
          PY
          python rebuild_identity_links.py
          python build_chronological_master.py
          python phase2_interaction_scan.py
          python age_form_robustness.py
          python rising_prospect_hypothesis.py
          python candidate_method_validation.py
          python phase3_physical_context_scan.py
          python phase3_robustness.py
          python phase4_dynamic_factors.py
          python audit_strict_profile_gaps.py
      - name: Collect compact results
        if: success()
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil,json
          root=Path('/tmp/boxing-research')
          run=Path((root/'LATEST_CHRONOLOGICAL_MASTER.txt').read_text().strip())
          out=Path('boxing/public_phase2');out.mkdir(exist_ok=True)
          for name in ['phase2_report.txt','phase2_target_candidates.json','phase2_interaction_research.json','coverage.json','age_form_robustness.txt','age_form_robustness.json','rising_prospect_hypothesis.txt','rising_prospect_hypothesis.json','candidate_method_validation.txt','candidate_method_validation.json','phase3_physical_context.txt','phase3_physical_context.json','phase3_robustness.txt','phase3_robustness.json','phase4_dynamic_factors.txt','phase4_dynamic_factors.json']:
              src=run/name
              if src.exists():
                  if name=='phase2_interaction_research.json':
                      data=json.loads(src.read_text())
                      compact={k:data[k] for k in ['status','price_policy','coverage','rules_tested','outer_walk_forward','target_screen','limitations'] if k in data}
                      (out/'phase2_interaction_summary.json').write_text(json.dumps(compact,indent=2))
                  elif name=='candidate_method_validation.json':
                      data=json.loads(src.read_text())
                      compact=dict(data)
                      for c in compact.get('candidates',[]): c.pop('selected_bouts',None)
                      (out/name).write_text(json.dumps(compact,indent=2))
                  else: shutil.copy2(src,out/name)
          punch=root/'punch_profiles'/'coverage.json'
          if punch.exists():shutil.copy2(punch,out/'punch_profile_coverage.json')
          for name in ['IDENTITY_LINKS_V2.json','PRICE_MATCH_COVERAGE.json','SUPPLEMENT_APPLY_REPORT.json','PROFILE_SUPPLEMENT_APPLY_REPORT.json','PROFILE_GAP_AUDIT.json']:
              src=root/name
              if src.exists():shutil.copy2(src,out/name)
          dbstat={}
          if (out/'database_status.json').exists():
              dbstat=json.loads((out/'database_status.json').read_text())
          coverage={}
          if (out/'coverage.json').exists():
              coverage=json.loads((out/'coverage.json').read_text())
          tables=set(dbstat.get('tables') or [])
          (out/'status.json').write_text(json.dumps({
              'status':'ready',
              'built_at':coverage.get('built_at'),
              'database_status':dbstat.get('status'),
              'required_phase2_tables_present':True,
              'source_rows_present':'source_rows' in tables,
              'source_rows_required_for_phase2':False,
              'price_rematch_status':'available' if 'source_rows' in tables else 'skipped_on_compact_public_db_supplemental_quote_links_retained',
              'authoritative_current_coverage':'boxing/public_phase2/CURRENT_DATASET_STATUS.json'
          },indent=2))
          PY
      - name: Record failure diagnostics
        if: failure()
        run: |
          mkdir -p boxing/public_phase2
          if [ -f /tmp/boxing_phase2_missing.json ]; then cp /tmp/boxing_phase2_missing.json boxing/public_phase2/status.json; fi
          if [ -f /tmp/boxing-research/punch_profiles/coverage.json ]; then cp /tmp/boxing-research/punch_profiles/coverage.json boxing/public_phase2/punch_profile_coverage.json; fi
          if [ -f /tmp/boxing-research/SUPPLEMENT_APPLY_REPORT.json ]; then cp /tmp/boxing-research/SUPPLEMENT_APPLY_REPORT.json boxing/public_phase2/SUPPLEMENT_APPLY_REPORT.json; fi
          if [ -f /tmp/boxing-research/PROFILE_SUPPLEMENT_APPLY_REPORT.json ]; then cp /tmp/boxing-research/PROFILE_SUPPLEMENT_APPLY_REPORT.json boxing/public_phase2/PROFILE_SUPPLEMENT_APPLY_REPORT.json; fi
          if [ -f /tmp/boxing-research/PROFILE_GAP_AUDIT.json ]; then cp /tmp/boxing-research/PROFILE_GAP_AUDIT.json boxing/public_phase2/PROFILE_GAP_AUDIT.json; fi
      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boxing-public-phase2
          path: boxing/public_phase2/
          if-no-files-found: warn
      - name: Commit compact public results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add boxing/public_phase2
          if git diff --cached --quiet; then
            echo 'No research result changes.'
          else
            git commit -m 'Update public boxing research'
            git pull --rebase origin main
            git push
          fi
