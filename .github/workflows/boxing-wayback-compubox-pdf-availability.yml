name: Boxing Wayback CompuBox PDF Availability Probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boxing-wayback-compubox-pdf-availability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pypdf
      - name: Resolve PDF through Wayback Availability API
        shell: bash
        run: |
          python - <<'PY'
          import io,json,urllib.parse,urllib.request,time
          from pypdf import PdfReader
          original='http://www.compuboxonline.com/featured_stats/V_Klitschko_KO_10_Arreola.pdf'
          out={'original':original,'queries':[],'captures':[]}
          seen=set()
          for year in range(2009,2016):
              ts=f'{year}0930'
              url='https://archive.org/wayback/available?'+urllib.parse.urlencode({'url':original,'timestamp':ts})
              item={'requested_timestamp':ts,'api':url}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 AppwizaWaybackAvailability/1.0'})
                  with urllib.request.urlopen(req,timeout=30) as r:data=json.loads(r.read().decode('utf-8','replace'))
                  item['response']=data
                  closest=(data.get('archived_snapshots') or {}).get('closest') or {}
                  snap=closest.get('url')
                  if snap and closest.get('available') and snap not in seen:
                      seen.add(snap)
                      # raw/id_ playback reduces Wayback UI wrapping.
                      raw_snap=snap.replace('/web/','/web/').replace('http://web.archive.org','https://web.archive.org')
                      if '/web/' in raw_snap and 'id_/' not in raw_snap:
                          a,b=raw_snap.split('/web/',1)
                          if '/' in b:
                              stamp,rest=b.split('/',1)
                              raw_snap=a+'/web/'+stamp+'id_/'+rest
                      cap={'snapshot':snap,'raw_snapshot':raw_snap,'timestamp':closest.get('timestamp')}
                      try:
                          req=urllib.request.Request(raw_snap,headers={'User-Agent':'Mozilla/5.0 AppwizaWaybackAvailability/1.0'})
                          with urllib.request.urlopen(req,timeout=60) as r:raw=r.read(12_000_001)
                          cap['bytes']=len(raw);cap['is_pdf']=raw.lstrip().startswith(b'%PDF')
                          if cap['is_pdf']:
                              pdf=PdfReader(io.BytesIO(raw));text='\n'.join((p.extract_text() or '') for p in pdf.pages)
                              cap['pages']=len(pdf.pages);cap['text_sample']=text[:30000]
                      except Exception as e:cap['error']=repr(e)
                      out['captures'].append(cap)
              except Exception as e:item['error']=repr(e)
              out['queries'].append(item)
              time.sleep(.4)
          print(json.dumps(out,indent=2,ensure_ascii=False))
          PY

