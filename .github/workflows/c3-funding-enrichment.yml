name: C3 funding and premium enrichment

on:
  push:
    branches: [main]
    paths:
      - 'crypto/research/c3_funding_enrichment.py'
      - '.github/workflows/c3-funding-enrichment.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy requests
      - run: python crypto/research/c3_funding_enrichment.py
      - name: Commit results
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add crypto/research/results_c3_funding_enrichment
          if ! git diff --cached --quiet; then
            git commit -m "Update C3 funding and premium enrichment"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
