name: Boxing ProBoxingOdds Fighter History Probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boxing-pbo-fighter-history-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check beautifulsoup4 lxml requests
      - name: Probe fighter history table structure
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          u='https://www.proboxingodds.com/fighters/regis-prograis-808'
          r=requests.get(u,headers={'User-Agent':'Mozilla/5.0 AppwizaBoxingResearch/1.0'},timeout=30);r.raise_for_status()
          s=BeautifulSoup(r.text,'lxml')
          print('title',s.title.get_text(' ',strip=True) if s.title else None,'bytes',len(r.content))
          for i,t in enumerate(s.find_all('table')[:10]):
              print('\nTABLE',i,'class',t.get('class'),'id',t.get('id'))
              print('HEADERS',[x.get_text(' ',strip=True) for x in t.find_all('th')[:30]])
              for tr in t.find_all('tr')[:8]:
                  print('ROW',[(x.name,x.get('class'),x.get_text(' ',strip=True),x.attrs) for x in tr.find_all(['th','td'])])
          PY
