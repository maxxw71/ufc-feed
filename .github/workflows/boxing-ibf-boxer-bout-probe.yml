name: Boxing IBF Boxer/Bout API Probe
on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/probe_ibf_boxer_bout_api.py'
      - '.github/workflows/boxing-ibf-boxer-bout-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python boxing/research/probe_ibf_boxer_bout_api.py
