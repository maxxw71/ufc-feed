name: NBA Injury 2023-26 Backfill

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nba-injury-2023-26-backfill.yml'

permissions:
  contents: write

concurrency:
  group: nba-injury-historical-2023-26
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        season: ['2023-24', '2024-25', '2025-26']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verified PDF reader
        run: python -m pip install -q pypdf
      - name: Recover official injury report snapshots
        run: python nba/backfill_official_injury_season.py --season ${{ matrix.season }} --sleep 0.12
      - name: Validate and publish without overwriting other seasons
        shell: bash
        env:
          SEASON: ${{ matrix.season }}
        run: |
          set -euo pipefail
          TARGET=${SEASON//-/_}
          SNAP="/tmp/nba_injury_${TARGET}"
          cp -a "nba/availability/historical_by_season/${TARGET}" "$SNAP"
          python - "$SNAP" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])/'coverage_summary.json'
          s=json.loads(p.read_text())
          assert s['games'] > 0, s
          assert s['unique_reports_downloaded'] <= s['unique_reports_selected'], s
          print(json.dumps(s,indent=2))
          PY
          git config user.name appwiza-nba-bot
          git config user.email actions@users.noreply.github.com
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            mkdir -p "nba/availability/historical_by_season"
            rm -rf "nba/availability/historical_by_season/${TARGET}"
            cp -a "$SNAP" "nba/availability/historical_by_season/${TARGET}"
            git add "nba/availability/historical_by_season/${TARGET}"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "nba: preserve ${SEASON} official pre-tip injury reports"
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
