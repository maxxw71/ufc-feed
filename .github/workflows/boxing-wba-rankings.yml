name: Boxing WBA Monthly Rankings Archive

on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/collect_wba_rankings.py'
      - '.github/workflows/boxing-wba-rankings.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pdfplumber beautifulsoup4 lxml
      - name: Collect official WBA rankings
        run: python boxing/research/collect_wba_rankings.py
      - name: Persist official WBA archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add boxing/rankings/wba_monthly_rankings.json boxing/rankings/wba_monthly_champions.json boxing/rankings/wba_monthly_rankings_meta.json
          if git diff --cached --quiet; then
            echo 'No WBA archive changes.'
          else
            git commit -m 'Update official WBA monthly ranking archive'
            git pull --rebase origin main
            git push
          fi
