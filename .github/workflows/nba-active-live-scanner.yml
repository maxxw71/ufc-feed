name: NBA Active Live Scanner
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/live/scan_live_methods.py'
      - 'nba/live/live_integrity.py'
      - 'nba/live/test_integrity.py'
      - '.github/workflows/nba-active-live-scanner.yml'
permissions:
  contents: read
concurrency:
  group: nba-active-live-scanner
  cancel-in-progress: true
jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen scanner input guards
        run: python -B -m unittest discover -s nba/live -p test_integrity.py
      # Actual scanning/publication: appwiza nba-live-scan.timer, every ten minutes.
