name: Corrected Method 1 economic audit

on:
  push:
    branches: [main]
    paths:
      - 'crypto/research/method1_nolookahead_economic_audit.py'
      - '.github/workflows/method1-nolookahead-economic-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy requests
      - run: python crypto/research/method1_nolookahead_economic_audit.py
      - name: Commit outputs
        run: |
          git config user.name "appwiza-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crypto/research/results_method1_nolookahead_economics
          if ! git diff --cached --quiet; then
            git commit -m "Update corrected Method 1 economic audit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
