name: NBA shot profile audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/shot_profile_audit.py'
      - '.github/workflows/nba-shot-profile-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nba/shot_profile_audit.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/research/gap_audit/shot_profile_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: add shot profile audit results"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
