name: NBA Physical Coaching Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nba/build_starter_physical.py"
      - "nba/build_coach_continuity.py"
      - "nba/research/discover_physical_coach.py"
      - "nba/research/audit_physcoach_001.py"
      - "nba/research/audit_physcoach_losses.py"
      - ".github/workflows/nba-physical-coaching-discovery.yml"

permissions:
  contents: write

concurrency:
  group: nba-physical-coaching-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nba/build_starter_physical.py
      - run: python nba/build_coach_continuity.py
      - run: python nba/build_market_features.py
      - run: python nba/research/discover_physical_coach.py
      - run: python nba/research/audit_physcoach_001.py
      - run: python nba/research/audit_physcoach_losses.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/features/starter_physical.csv.gz nba/features/starter_physical_summary.json nba/features/coach_continuity.csv.gz nba/features/coach_continuity_summary.json nba/research/physical_coach
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: add physical and coaching method discovery"
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
