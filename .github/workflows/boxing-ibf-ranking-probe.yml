name: Boxing IBF ranking archive probe

on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/probe_ibf_rankings.py'
      - '.github/workflows/boxing-ibf-ranking-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4 lxml
      - name: Probe official IBF ratings archive
        run: python boxing/research/probe_ibf_rankings.py
