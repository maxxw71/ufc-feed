name: NBA Historical Completeness Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nba/historical_completeness_audit.py"
      - ".github/workflows/nba-historical-completeness-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nba/historical_completeness_audit.py
      - if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f nba/historical_completeness_report.json ]]; then exit 0; fi
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/historical_completeness_report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: refresh historical completeness audit"
          git pull --rebase origin main
          git push
