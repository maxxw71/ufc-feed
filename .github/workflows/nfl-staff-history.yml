name: NFL coaching staff history

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/nfl_build_staff_history_pfr.py'
      - '.github/workflows/nfl-staff-history.yml'

permissions:
  contents: read

concurrency:
  group: nfl-staff-history
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'maxxw71/ufc-feed' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build 2006-2026 NFL HC OC DC history
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT=/home/anestishkurti92/nfl-predictor-v1
          CTX=/home/appwiza-runner/nfl-context-data
          test -x "$ROOT/venv/bin/python"
          mkdir -p "$CTX/raw"
          chmod 755 "$CTX" "$CTX/raw"
          NFL_SOURCE_ROOT="$ROOT" NFL_CONTEXT_ROOT="$CTX" "$ROOT/venv/bin/python" "$GITHUB_WORKSPACE/scripts/nfl_build_staff_history_pfr.py"
          chmod -R a+rX "$CTX"
          echo '=== STAFF STATUS ==='
          cat "$CTX/NFL_COACHING_STAFF_STATUS.json"
          echo '=== 2025-26 SAMPLE ==='
          grep -E '^2025,|^2026,' "$CTX/raw/coaching_staff_2006_2026.csv" | head -80 || true
