name: NFL coaching staff history

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/nfl/coordinator_history_pfr_2006_2026.csv'
      - 'scripts/nfl_import_coordinator_history.py'
      - 'scripts/nfl_patch_2026_staff.py'
      - 'scripts/nfl_build_pregame_context.py'
      - '.github/workflows/nfl-staff-history.yml'

permissions:
  contents: read

concurrency:
  group: nfl-staff-history
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'maxxw71/ufc-feed' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build audited 2006-2026 NFL HC OC DC history
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT=/home/anestishkurti92/nfl-predictor-v1
          CTX=/home/appwiza-runner/nfl-context-data
          test -x "$ROOT/venv/bin/python"
          mkdir -p "$CTX/raw" "$CTX/derived"
          if [ ! -s "$GITHUB_WORKSPACE/data/nfl/coordinator_history_pfr_2006_2026.csv" ]; then
            echo 'Hosted coordinator table not published yet; waiting for NFL hosted coordinator scrape.'
            exit 0
          fi
          export NFL_SOURCE_ROOT="$ROOT"
          export NFL_CONTEXT_ROOT="$CTX"
          "$ROOT/venv/bin/python" "$GITHUB_WORKSPACE/scripts/nfl_import_coordinator_history.py"
          "$ROOT/venv/bin/python" "$GITHUB_WORKSPACE/scripts/nfl_patch_2026_staff.py"
          "$ROOT/venv/bin/python" "$GITHUB_WORKSPACE/scripts/nfl_build_pregame_context.py"
          if [ -f "$CTX/raw/preseason_team_2006_2026.csv" ]; then
            "$ROOT/venv/bin/python" "$GITHUB_WORKSPACE/scripts/nfl_merge_preseason_context.py"
          fi
          chmod -R a+rX "$CTX"
          echo '=== STAFF STATUS ==='
          cat "$CTX/NFL_COACHING_STAFF_STATUS.json"
          echo '=== CONTEXT STATUS ==='
          cat "$CTX/NFL_PREGAME_CONTEXT_STATUS.json"
          echo '=== LAC 2024-26 ==='
          grep -E '^(2024|2025|2026),LAC,' "$CTX/raw/coaching_staff_2006_2026.csv" || true
