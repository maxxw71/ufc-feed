name: Crypto live scanner smoke test

on:
  push:
    branches: [main]
    paths:
      - 'crypto/live/live_crypto_scanner.py'
      - 'crypto/live/methods.json'
      - '.github/workflows/crypto-live-scanner-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-live-scanner-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy requests
      - run: python -m py_compile crypto/live/live_crypto_scanner.py
      - name: Run scanner once
        run: |
          python crypto/live/live_crypto_scanner.py             --methods crypto/live/methods.json             --output crypto/live/smoke_signals.json             --history crypto/live/smoke_history.json             --days 125             --recent-hours 72
      - name: Validate payload
        run: |
          python - <<'PY'
          import json
          p=json.load(open('crypto/live/smoke_signals.json'))
          assert len(p['methods'])==10
          live={m['id'] for m in p['methods'] if m.get('status')=='LIVE'}
          shadow={m['id'] for m in p['methods'] if m.get('status')=='SHADOW_ONLY'}
          assert live=={'C1','C2','C3','C3F','C4','C2D'}, live
          assert shadow=={'N02','N06','R01','R03'}, shadow
          assert 'shadow_signals' in p
          assert p['coverage']['ok']>0
          print('signals',len(p['signals']),'shadow_signals',len(p['shadow_signals']),'coverage',p['coverage'])
          PY
      - name: Commit smoke snapshot
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add crypto/live/smoke_signals.json
          if ! git diff --cached --quiet; then
            git commit -m "Update crypto live scanner smoke snapshot"
            if ! git pull --rebase -X ours origin main; then
              git rebase --abort || true
              echo 'snapshot_publish=skipped_due_to_concurrent_main_update'
              exit 0
            fi
            git push origin HEAD:main || echo 'snapshot_publish=skipped_due_to_concurrent_push'
          fi
