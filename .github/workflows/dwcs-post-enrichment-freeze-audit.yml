name: DWCS Post-Enrichment Freeze Audit
on:
  push:
    branches: [main]
    paths:
      - 'dwcs/research/ufc_com_search_enrichment/**'
      - 'dwcs/research/build_point_in_time_sos.py'
      - 'dwcs/research/retry_missing_bfo_odds.py'
      - 'dwcs/research/build_completeness_audit.py'
      - '.github/workflows/dwcs-post-enrichment-freeze-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pandas numpy duckdb requests beautifulsoup4
      - name: Download regional MMA archive
        run: |
          mkdir -p /tmp/mmadb
          python - <<'PY'
          import io,zipfile,requests
          r=requests.get('https://www.kaggle.com/api/v1/datasets/download/leandroiber/mmastats',timeout=120)
          r.raise_for_status()
          zipfile.ZipFile(io.BytesIO(r.content)).extractall('/tmp/mmadb')
          PY
      - name: Build point-in-time global Elo and SOS
        run: python dwcs/research/build_point_in_time_sos.py
      - name: Retry missing historical odds
        run: python dwcs/research/retry_missing_bfo_odds.py
      - name: Build completeness audit
        run: python dwcs/research/build_completeness_audit.py
      - name: Commit enriched coverage and audit
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add dwcs/research/point_in_time_sos dwcs/research/historical_odds dwcs/research/completeness_audit
          git diff --cached --quiet && exit 0
          git commit -m 'Advance DWCS post-enrichment completeness audit'
          git pull --rebase origin main
          git push
