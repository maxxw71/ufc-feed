name: DWCS UFC Season 6 Weigh-In Raw Probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dwcs-ufc-s6-weighin-raw-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, appwiza]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
      - run: python - <<'PY'
          import requests
          from pathlib import Path
          u='https://r.jina.ai/https://www.ufc.com/news/season-6-weigh-results-dana-whites-contender-series'
          r=requests.get(u,headers={'User-Agent':'ufc-feed/1.1','Accept':'text/plain'},timeout=60);r.raise_for_status()
          p=Path('dwcs/research/official_ufc_weighins');p.mkdir(parents=True,exist_ok=True)
          (p/'season6_raw.txt').write_text(r.text)
          print(len(r.text))
          PY
      - run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add dwcs/research/official_ufc_weighins/season6_raw.txt
          git commit -m 'Save official UFC Season 6 weigh-in source text' || exit 0
          git pull --rebase origin main
          git push
