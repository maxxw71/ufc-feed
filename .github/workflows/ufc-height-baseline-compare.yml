name: UFC Height Baseline Compare

on:
  workflow_dispatch:
  push:
    paths:
      - 'ufc_height_baseline_compare.py'
      - '.github/workflows/ufc-height-baseline-compare.yml'

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas
      - run: python ufc_height_baseline_compare.py
      - name: Commit comparison
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ufc_height_method_analysis/height_vs_market_baseline.txt
          git commit -m "Add UFC height baseline comparison" || exit 0
          git pull --rebase origin main || true
          git push
