name: NFL RS CO H consensus
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/nfl_rs_co_h_consensus.py'
      - 'scripts/nfl_rs_co_h_consensus_trigger.py'
permissions:
  contents: write
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Run consensus research
        shell: bash
        run: |
          set -Eeuo pipefail
          /home/anestishkurti92/nfl-predictor-v1/venv/bin/python "$GITHUB_WORKSPACE/scripts/nfl_rs_co_h_consensus.py"
      - name: Publish
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC=/home/appwiza-runner/nfl-context-data/rs_co_h_consensus
          DEST="$GITHUB_WORKSPACE/nfl/rs_co_h_consensus"
          mkdir -p "$DEST"
          cp "$SRC"/* "$DEST"/
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add nfl/rs_co_h_consensus
          if ! git diff --cached --quiet; then
            git commit -m 'Update RS CO H consensus results'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
