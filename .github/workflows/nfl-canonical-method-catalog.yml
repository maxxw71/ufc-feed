name: NFL canonical method catalog
on:
  push:
    branches: [main]
    paths:
      - 'scripts/nfl_canonical_method_catalog.py'
      - '.github/workflows/nfl-canonical-method-catalog.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pandas numpy
      - run: python scripts/nfl_canonical_method_catalog.py
      - shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add nfl/final_method_expansion
          if ! git diff --cached --quiet; then
            git commit -m 'Update canonical NFL method catalog'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
