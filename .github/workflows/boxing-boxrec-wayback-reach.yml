name: Boxing BoxRec Wayback Reach Probe
on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/probe_boxrec_wayback_reach.py'
      - '.github/workflows/boxing-boxrec-wayback-reach.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 30
    steps:
      - name: Prepare isolated boxing scratch space
        run: mkdir -p "${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q beautifulsoup4 lxml
      - name: Download boxing research database
        run: |
          python - <<'PY'
          import io,zipfile,urllib.request
          u='https://appwiza.com/sports/downloads/boxing/research-database.zip'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 AppwizaBoxRecWayback/1.0'})
          with urllib.request.urlopen(req,timeout=180) as r:data=r.read()
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              name=next(n for n in z.namelist() if n.endswith('.sqlite3'))
              open('${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}/boxing_research.sqlite3','wb').write(z.read(name))
          PY
      - name: Probe archived BoxRec profiles
        env:
          BOXING_DB: ${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}/boxing_research.sqlite3
        run: python boxing/research/probe_boxrec_wayback_reach.py
      - name: Persist probe
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/br-wayback
          cp boxing/profile_supplements/boxrec_wayback_reach_probe.json /tmp/br-wayback/
          cp boxing/profile_supplements/boxrec_wayback_reach_additions.jsonl /tmp/br-wayback/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/br-wayback/boxrec_wayback_reach_probe.json boxing/profile_supplements/
            cp /tmp/br-wayback/boxrec_wayback_reach_additions.jsonl boxing/profile_supplements/
            git add boxing/profile_supplements/boxrec_wayback_reach_probe.json boxing/profile_supplements/boxrec_wayback_reach_additions.jsonl
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish archived BoxRec reach probe'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Remove this run temporary boxing files
        if: always()
        run: rm -rf -- "${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}"
