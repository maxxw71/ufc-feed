name: Hyperliquid signal ranker

on:
  push:
    branches: [main]
    paths:
      - 'crypto/research/hyperliquid_signal_ranker.py'
      - '.github/workflows/hyperliquid-signal-ranker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy scikit-learn
      - run: python crypto/research/hyperliquid_signal_ranker.py
      - name: Commit outputs
        run: |
          git config user.name "appwiza-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crypto/research/results_signal_ranking
          if ! git diff --cached --quiet; then
            git commit -m "Update Hyperliquid signal ranking research"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
