name: Novel context crypto method discovery

on:
  push:
    branches: [main]
    paths:
      - 'crypto/research/novel_context_method_discovery.py'
      - '.github/workflows/novel-context-crypto-methods.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novel-context-crypto-methods
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy requests
      - name: Discover orthogonal Hyperliquid methods and freeze on Binance
        run: python crypto/research/novel_context_method_discovery.py
      - name: Commit novel discovery outputs
        run: |
          git config user.name "appwiza-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crypto/research/novel_context_discovery
          if ! git diff --cached --quiet; then
            git commit -m "Update novel context crypto method discovery"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
