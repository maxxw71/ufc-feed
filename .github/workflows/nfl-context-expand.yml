name: NFL context data expansion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/nfl_expand_context_data.py'
      - '.github/workflows/nfl-context-expand.yml'

permissions:
  contents: read

concurrency:
  group: nfl-context-data-expansion
  cancel-in-progress: true

jobs:
  expand:
    if: github.repository == 'maxxw71/ufc-feed' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download NFL player and context datasets
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT=/home/anestishkurti92/nfl-predictor-v1
          CTX=/home/appwiza-runner/nfl-context-data
          test -x "$ROOT/venv/bin/python"
          mkdir -p "$CTX/raw"
          chmod 755 "$CTX" "$CTX/raw"
          avail=$(df -Pk "$CTX" | awk 'NR==2 {print $4}')
          [ "$avail" -ge 4194304 ] || { echo 'Less than 4 GiB free; refusing large NFL expansion'; exit 3; }
          NFL_SOURCE_ROOT="$ROOT" NFL_CONTEXT_ROOT="$CTX" "$ROOT/venv/bin/python" "$GITHUB_WORKSPACE/scripts/nfl_expand_context_data.py"
          chmod -R a+rX "$CTX"
          echo '=== STATUS ==='
          cat "$CTX/NFL_CONTEXT_DATA_STATUS.json"
          echo '=== DISK ==='
          du -sh "$CTX" || true
          df -h "$CTX"
