name: Boxing Ready To Fight Punch Archive

on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/collect_ready_to_fight_punch.py'
      - 'boxing/research/test_ready_to_fight_punch.py'
      - '.github/workflows/boxing-ready-to-fight-punch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4 lxml
      - name: Test parser
        working-directory: boxing/research
        run: python -m unittest test_ready_to_fight_punch
      - name: Download current public boxing DB
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/rtf-boxing-db
          mkdir -p /tmp/rtf-boxing-db
          python - <<'PY'
          import io,zipfile,urllib.request,os,shutil
          url='https://appwiza.com/sports/downloads/boxing/research-database.zip'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 AppwizaRTFPunch/1.0'})
          with urllib.request.urlopen(req,timeout=180) as r:data=r.read()
          with zipfile.ZipFile(io.BytesIO(data)) as z:z.extractall('/tmp/rtf-boxing-db')
          db=next(os.path.join(root,f) for root,_,files in os.walk('/tmp/rtf-boxing-db') for f in files if f.endswith('.sqlite3'))
          shutil.copy2(db,'boxing/research/boxing.sqlite3')
          PY
      - name: Collect exact structured punch totals
        run: python boxing/research/collect_ready_to_fight_punch.py --sleep 0.08
      - name: Remove temporary DB
        if: always()
        run: rm -f boxing/research/boxing.sqlite3
      - name: Persist punch supplement on latest main
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/rtf-punch-out
          cp boxing/punch_supplements/ready_to_fight_punch_observations.jsonl /tmp/rtf-punch-out/
          cp boxing/punch_supplements/ready_to_fight_punch_report.json /tmp/rtf-punch-out/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p boxing/punch_supplements
          cp /tmp/rtf-punch-out/* boxing/punch_supplements/
          git add boxing/punch_supplements/ready_to_fight_punch_observations.jsonl boxing/punch_supplements/ready_to_fight_punch_report.json
          if git diff --cached --quiet; then
            echo 'No Ready To Fight punch supplement changes.'
          else
            git commit -m 'Update structured Ready To Fight punch archive'
            git push origin HEAD:main
          fi
