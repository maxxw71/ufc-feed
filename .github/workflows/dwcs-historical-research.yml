name: DWCS Historical Backfill & Research

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dwcs-historical-research.yml'
      - 'dwcs/research/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4

      - name: Install research dependencies
        run: python -m pip install --quiet pandas numpy requests beautifulsoup4

      - name: Backfill all historical Contender Series events and research
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$GITHUB_WORKSPACE/dwcs/research/results"
          mkdir -p "$OUT"
          ROOT="$GITHUB_WORKSPACE" OUT="$OUT" python "$GITHUB_WORKSPACE/dwcs/research/backfill_and_research.py"

      - name: Commit DWCS historical research
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'appwiza-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add dwcs/research/results
          git diff --cached --quiet && exit 0
          git commit -m 'Backfill and research historical DWCS events'
          git pull --rebase origin main
          git push
