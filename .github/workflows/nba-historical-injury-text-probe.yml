name: NBA Historical Injury Text Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/probe_historical_injury_text_format.py'
      - '.github/workflows/nba-historical-injury-text-probe.yml'
permissions:
  contents: write
concurrency:
  group: nba-historical-injury-text-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python nba/probe_historical_injury_text_format.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name appwiza-nba-bot
          git config user.email actions@users.noreply.github.com
          git add nba/availability/historical_by_season/2022_23/text_format_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: add historical injury text format probe"
          git pull --rebase origin main
          git push
