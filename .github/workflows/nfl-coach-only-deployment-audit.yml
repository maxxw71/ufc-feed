name: NFL coach-only deployment audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/nfl_coach_only_deployment_audit.py'
permissions:
  contents: write
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Run coach-only deployment audit
        shell: bash
        run: |
          set -Eeuo pipefail
          /home/anestishkurti92/nfl-predictor-v1/venv/bin/python "$GITHUB_WORKSPACE/scripts/nfl_coach_only_deployment_audit.py"
      - name: Publish
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC=/home/appwiza-runner/nfl-context-data/coach_only_deployment_audit
          DEST="$GITHUB_WORKSPACE/nfl/coach_only_deployment_audit"
          mkdir -p "$DEST"
          cp "$SRC"/* "$DEST"/
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add nfl/coach_only_deployment_audit
          if ! git diff --cached --quiet; then
            git commit -m 'Update NFL coach-only deployment audit'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
