name: NFL build final research registry
on:
  push:
    branches: [main]
    paths:
      - 'scripts/nfl_build_final_research_registry.py'
      - '.github/workflows/nfl-build-final-research-registry.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pandas
      - run: python scripts/nfl_build_final_research_registry.py
      - shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add nfl/final_methods
          if ! git diff --cached --quiet; then
            git commit -m 'Update NFL final research method registry'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
