name: Binance external replication

on:
  push:
    branches: [main]
    paths:
      - 'crypto/research/binance_external_replication.py'
      - '.github/workflows/binance-external-replication.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy requests
      - run: python crypto/research/binance_external_replication.py --symbols 120 --days 900
      - name: Commit outputs
        run: |
          git config user.name "appwiza-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crypto/research/results_binance_external_replication
          if ! git diff --cached --quiet; then
            git commit -m "Update Binance external replication"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
