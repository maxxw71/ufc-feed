name: NFL Week 2 Loss Postmortem

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nfl-week2-loss-postmortem.yml'
      - 'scripts/nfl_week2_loss_postmortem.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  postmortem:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Run frozen-rule postmortem against live state
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/nfl_week2_loss_postmortem.py
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 nice -n 12 timeout 35m python3 scripts/nfl_week2_loss_postmortem.py
          cat nfl/week2_loss_postmortem/report.txt

      - name: Persist postmortem
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/nflpost"
          cp nfl/week2_loss_postmortem/* "$RUNNER_TEMP/nflpost/"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p nfl/week2_loss_postmortem
          cp "$RUNNER_TEMP"/nflpost/* nfl/week2_loss_postmortem/
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add nfl/week2_loss_postmortem/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish NFL Week 2 loss postmortem'
            git push origin HEAD:main
          fi
