name: NFL Week 2 Loss Postmortem

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nfl-week2-loss-postmortem.yml'
      - 'scripts/nfl_week2_loss_postmortem.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  postmortem:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Stage read-only live NFL snapshots
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" 'cat /srv/appwiza-sports/state/nfl.json' > /tmp/nfl_postmortem_state.json
          ssh -i "$KEY" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new "$HOST" "python3 -c 'import sqlite3,json; p=\"/home/anestishkurti92/betting-ledger/assumed_bets.sqlite3\"; db=sqlite3.connect(p); db.row_factory=sqlite3.Row; rows=[dict(r) for r in db.execute(\"select * from bets where upper(sport)=? and start like ?\",(\"NFL\",\"%2026-09-20%\"))]; print(json.dumps(rows,default=str))'" > /tmp/nfl_postmortem_ledger.json
          echo "state bytes=$(wc -c </tmp/nfl_postmortem_state.json) ledger bytes=$(wc -c </tmp/nfl_postmortem_ledger.json)"

      - name: Run frozen-rule postmortem against live state
        shell: bash
        run: |
          set -Eeuo pipefail
          PY=/home/anestishkurti92/nfl-predictor-v1/venv/bin/python
          "$PY" -m py_compile scripts/nfl_week2_loss_postmortem.py
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 nice -n 12 timeout 35m "$PY" scripts/nfl_week2_loss_postmortem.py
          cat nfl/week2_loss_postmortem/report.txt

      - name: Persist postmortem
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/nflpost"
          cp nfl/week2_loss_postmortem/* "$RUNNER_TEMP/nflpost/"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p nfl/week2_loss_postmortem
          cp "$RUNNER_TEMP"/nflpost/* nfl/week2_loss_postmortem/
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add nfl/week2_loss_postmortem/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish NFL Week 2 loss postmortem'
            git push origin HEAD:main
          fi
