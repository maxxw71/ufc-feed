name: Hyperliquid-first lower-high method discovery

on:
  push:
    branches: [main]
    paths:
      - 'crypto/research/lower_high_hl_first_discovery.py'
      - '.github/workflows/lower-high-hl-first-discovery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lower-high-hl-first-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy
      - run: python crypto/research/lower_high_hl_first_discovery.py
      - name: Commit outputs
        run: |
          git config user.name "appwiza-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crypto/research/lower_high_hl_first_discovery
          if ! git diff --cached --quiet; then
            git commit -m "Update Hyperliquid-first lower-high discovery"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
