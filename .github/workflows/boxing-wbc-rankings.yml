name: Boxing WBC Monthly Rankings Archive

on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/collect_wbc_rankings.py'
      - '.github/workflows/boxing-wbc-rankings.yml'
  workflow_dispatch:

concurrency:
  group: boxing-wbc-rankings
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pypdf
      - run: python boxing/research/collect_wbc_rankings.py
      - name: Persist official ranking archive on latest main
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/wbc-rankings-out
          mkdir -p /tmp/wbc-rankings-out
          cp boxing/rankings/wbc_monthly_rankings.json /tmp/wbc-rankings-out/
          cp boxing/rankings/wbc_monthly_champions.json /tmp/wbc-rankings-out/
          cp boxing/rankings/wbc_monthly_rankings_meta.json /tmp/wbc-rankings-out/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p boxing/rankings
            cp /tmp/wbc-rankings-out/* boxing/rankings/
            git add boxing/rankings/wbc_monthly_rankings.json boxing/rankings/wbc_monthly_champions.json boxing/rankings/wbc_monthly_rankings_meta.json
            if git diff --cached --quiet; then
              echo 'No WBC ranking changes.'
              exit 0
            fi
            git commit -m 'Update official WBC monthly ranking archive'
            if git push origin HEAD:main; then exit 0; fi
            echo "WBC publish race on attempt $attempt; retrying."
          done
          echo 'Unable to publish WBC archive after retries.'
          exit 1
