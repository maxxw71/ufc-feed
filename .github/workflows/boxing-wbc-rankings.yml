name: Boxing WBC Monthly Rankings Archive

on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/collect_wbc_rankings.py'
      - '.github/workflows/boxing-wbc-rankings.yml'
  workflow_dispatch:

concurrency:
  group: boxing-wbc-rankings
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pypdf
      - run: python boxing/research/collect_wbc_rankings.py
      - name: Persist official ranking archive
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add boxing/rankings
          if git diff --cached --quiet; then
            echo 'No WBC ranking changes.'
          else
            git commit -m 'Update official WBC monthly ranking archive'
            git pull --rebase origin main
            git push
          fi
