name: Appwiza Trading Crypto fallback deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/appwiza-trading-crypto-fallback-deploy.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Appwiza-capable host
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f /home/appwiza-runner/.ssh/appwiza_vps
          test -d /srv/appwiza-sports/public
          echo APPWIZA_HOST_OK
      - name: Deploy Trading and Crypto
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY=/home/appwiza-runner/.ssh/appwiza_vps
          HOST=anestishkurti92@127.0.0.1
          SSH="ssh -i $KEY -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new $HOST"

          cat crypto/live/live_crypto_scanner.py | $SSH 'mkdir -p /home/anestishkurti92/crypto-trading; cat > /home/anestishkurti92/crypto-trading/live_crypto_scanner.py'
          cat crypto/live/methods.json | $SSH 'mkdir -p /home/anestishkurti92/crypto-trading; cat > /home/anestishkurti92/crypto-trading/methods.json'
          cat crypto/live/ensure_trading_nav.py | $SSH 'mkdir -p /home/anestishkurti92/crypto-trading; cat > /home/anestishkurti92/crypto-trading/ensure_trading_nav.py'
          cat crypto/live/trading_index.html | $SSH 'mkdir -p /srv/appwiza-sports/public/trading; cat > /srv/appwiza-sports/public/trading/index.html'
          cat crypto/live/crypto_index.html | $SSH 'mkdir -p /srv/appwiza-sports/public/trading/crypto; cat > /srv/appwiza-sports/public/trading/crypto/index.html'

          $SSH 'bash -s' <<'EOF' | tee crypto/trading_fallback_deploy_report.txt
          set -Eeuo pipefail
          PY=/home/anestishkurti92/ufc-predictor-v1/venv/bin/python
          ROOT=/home/anestishkurti92/crypto-trading
          PUB=/srv/appwiza-sports/public/trading/crypto
          chmod 0755 "$ROOT/live_crypto_scanner.py" "$ROOT/ensure_trading_nav.py"
          chmod 0644 "$ROOT/methods.json" /srv/appwiza-sports/public/trading/index.html /srv/appwiza-sports/public/trading/crypto/index.html
          "$PY" -m py_compile "$ROOT/live_crypto_scanner.py" "$ROOT/ensure_trading_nav.py"
          "$PY" "$ROOT/ensure_trading_nav.py"
          "$PY" "$ROOT/live_crypto_scanner.py" --methods "$ROOT/methods.json" --output "$PUB/signals.json" --history "$ROOT/history.json" --days 125 --recent-hours 72
          TMP=$(mktemp)
          crontab -l 2>/dev/null | grep -v '/crypto-trading/live_crypto_scanner.py' | grep -v '/crypto-trading/ensure_trading_nav.py' > "$TMP" || true
          echo 'CRON_TZ=UTC' >> "$TMP"
          echo '*/15 * * * * /home/anestishkurti92/ufc-predictor-v1/venv/bin/python /home/anestishkurti92/crypto-trading/ensure_trading_nav.py >> /home/anestishkurti92/crypto-trading/scanner.log 2>&1; /home/anestishkurti92/ufc-predictor-v1/venv/bin/python /home/anestishkurti92/crypto-trading/live_crypto_scanner.py --methods /home/anestishkurti92/crypto-trading/methods.json --output /srv/appwiza-sports/public/trading/crypto/signals.json --history /home/anestishkurti92/crypto-trading/history.json --days 125 --recent-hours 72 >> /home/anestishkurti92/crypto-trading/scanner.log 2>&1' >> "$TMP"
          crontab "$TMP"
          rm -f "$TMP"
          echo FALLBACK_DEPLOY_OK
          stat -c '%U:%G %a %s %n' /srv/appwiza-sports/public/trading/index.html /srv/appwiza-sports/public/trading/crypto/index.html "$PUB/signals.json"
          EOF

          git config user.name github-actions
          git config user.email github-actions@github.com
          git add crypto/trading_fallback_deploy_report.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record fallback Appwiza Trading deploy'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Verify live routes
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://appwiza.com/trading/ | grep -q 'Appwiza Trading'
          curl -fsSL https://appwiza.com/trading/crypto/ | grep -q 'Crypto method scanner'
          curl -fsSL https://appwiza.com/trading/crypto/signals.json | python3 -c "import json,sys;x=json.load(sys.stdin);assert len(x['methods'])==2"
          echo LIVE_VERIFY_OK
