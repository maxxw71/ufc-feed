name: NBA Totals Lead Robustness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nba/research/audit_totals_leads.py"
      - ".github/workflows/nba-totals-lead-robustness.yml"

permissions:
  contents: write

concurrency:
  group: nba-totals-lead-robustness
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nba/build_market_features.py
      - run: python nba/research/audit_totals_leads.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "appwiza-nba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nba/research/totals/totals_lead_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: audit totals lead robustness"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
