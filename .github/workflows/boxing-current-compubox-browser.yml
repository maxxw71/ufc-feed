name: Boxing Current CompuBox Browser Capture

on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/collect_current_compubox_browser.py'
      - '.github/workflows/boxing-current-compubox-browser.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 12
    steps:
      - name: Prepare isolated boxing scratch space
        run: mkdir -p "${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}"
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright openpyxl xlrd pypdf
      - run: python -m playwright install --with-deps chromium
      - run: python boxing/research/collect_current_compubox_browser.py
      - name: Publish current report capture
        shell: bash
        run: |
          set -Eeuo pipefail
          cp boxing/punch_supplements/compubox_current_round_reports_browser.json /tmp/report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/report.json boxing/punch_supplements/compubox_current_round_reports_browser.json
            git add boxing/punch_supplements/compubox_current_round_reports_browser.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Refresh current CompuBox browser round-report capture'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

      - name: Remove this run temporary boxing files
        if: always()
        run: rm -rf -- "${{ runner.temp }}/boxing-${{ github.run_id }}-${{ github.run_attempt }}"
