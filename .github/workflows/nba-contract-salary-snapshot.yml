name: NBA Contract Salary Snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nba/contracts/capture_current_contracts.py'
      - '.github/workflows/nba-contract-salary-snapshot.yml'
  schedule:
    - cron: '31 8 * * *'

permissions:
  contents: write

concurrency:
  group: nba-contract-salary-snapshot
  cancel-in-progress: true

jobs:
  capture:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests beautifulsoup4
      - run: python nba/contracts/capture_current_contracts.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name appwiza-nba-bot
          git config user.email actions@users.noreply.github.com
          git add nba/contracts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "nba: capture contract salary snapshot"
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
