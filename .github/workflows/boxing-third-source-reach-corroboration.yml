name: Boxing Third Source Reach Corroboration
on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/corroborate_third_source_reach.py'
      - 'boxing/profile_supplements/boxingundefeated_reach_probe.json'
      - '.github/workflows/boxing-third-source-reach-corroboration.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  corroborate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q beautifulsoup4 lxml
      - run: python boxing/research/corroborate_third_source_reach.py
      - name: Merge accepted reach additions
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          sup=Path('boxing/profile_supplements/verified_profiles.jsonl')
          add=Path('boxing/profile_supplements/third_source_reach_additions.jsonl')
          cur={}
          if sup.exists():
              for line in sup.read_text().splitlines():
                  if line.strip():
                      x=json.loads(line);cur[x.get('target_source_id')]=x
          added=0
          if add.exists():
              for line in add.read_text().splitlines():
                  if not line.strip():continue
                  x=json.loads(line);sid=x.get('target_source_id')
                  if not sid:continue
                  old=cur.get(sid)
                  if old is None:
                      cur[sid]=x;added+=1;continue
                  fields=dict(old.get('fields') or {})
                  if fields.get('reach_cm') not in (None,''):continue
                  fields['reach_cm']=(x.get('fields') or {}).get('reach_cm')
                  old['fields']=fields
                  ev=list(old.get('evidence') or []);ev.extend(x.get('evidence') or [])
                  old['evidence']=ev
                  q=str(old.get('quality') or '')
                  marker='public_profile_multi_source_reach_consensus_exact_identity'
                  if marker not in q:old['quality']=(q+';'+marker).strip(';')
                  old['collected_at']=x.get('collected_at') or old.get('collected_at')
                  cur[sid]=old;added+=1
          with sup.open('w') as f:
              for x in sorted(cur.values(),key=lambda z:(z.get('name',''),z.get('target_source_id',''))):
                  f.write(json.dumps(x,ensure_ascii=False)+'\n')
          print({'merged':added,'total':len(cur)})
          PY
      - name: Persist on latest main
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/reach3
          cp boxing/profile_supplements/third_source_reach_corroboration.json /tmp/reach3/
          cp boxing/profile_supplements/third_source_reach_additions.jsonl /tmp/reach3/
          cp boxing/profile_supplements/verified_profiles.jsonl /tmp/reach3/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/reach3/third_source_reach_corroboration.json boxing/profile_supplements/
          cp /tmp/reach3/third_source_reach_additions.jsonl boxing/profile_supplements/
          cp /tmp/reach3/verified_profiles.jsonl boxing/profile_supplements/
          git add boxing/profile_supplements/third_source_reach_corroboration.json boxing/profile_supplements/third_source_reach_additions.jsonl boxing/profile_supplements/verified_profiles.jsonl
          git diff --cached --quiet || (git commit -m 'Add corroborated boxing reach values' && git push origin HEAD:main)
