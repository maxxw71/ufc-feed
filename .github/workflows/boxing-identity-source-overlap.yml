name: Boxing Identity Source Overlap Audit
on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/audit_identity_source_overlap.py'
      - '.github/workflows/boxing-identity-source-overlap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python boxing/research/audit_identity_source_overlap.py
