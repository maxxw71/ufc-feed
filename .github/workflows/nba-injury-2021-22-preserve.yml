name: NBA Preserve 2021-22 Injury Reports

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nba-injury-2021-22-preserve.yml'

permissions:
  contents: write

concurrency:
  group: nba-injury-preserve-2021-22
  cancel-in-progress: true

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pypdf
      - name: Seed frozen 2021-22 mapping from successful pilot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nba/availability/historical_by_season/2021_22
          cp nba/availability/historical_pilot/coverage_games.csv.gz nba/availability/historical_by_season/2021_22/coverage_games.csv.gz
      - run: python nba/repair_official_injury_downloads.py --season 2021-22 --sleep 0.12
      - name: Publish preserved season snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name appwiza-nba-bot
          git config user.email actions@users.noreply.github.com
          SNAP=/tmp/nba_2021_22_repaired
          rm -rf "$SNAP"
          cp -a nba/availability/historical_by_season/2021_22 "$SNAP"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            rm -rf nba/availability/historical_by_season/2021_22
            mkdir -p nba/availability/historical_by_season
            cp -a "$SNAP" nba/availability/historical_by_season/2021_22
            git add nba/availability/historical_by_season/2021_22
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "nba: preserve 2021-22 official injury text"
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
