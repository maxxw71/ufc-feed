name: SMA350 support-retest crypto research

on:
  push:
    branches: [main]
    paths:
      - 'crypto/research/sma350_retest_research.py'
      - '.github/workflows/sma350-retest-research.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sma350-retest-research
  cancel-in-progress: true

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        venue: [hl,bn]
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy requests
      - run: |
          python crypto/research/sma350_retest_research.py \
            --mode scan --venue ${{ matrix.venue }} --days 600 \
            --binance-symbols 140 \
            --shard-index ${{ matrix.shard }} --shard-count 8 \
            --sleep 0.05 --out sma350_out
      - uses: actions/upload-artifact@v4
        with:
          name: sma350-${{ matrix.venue }}-${{ matrix.shard }}
          path: sma350_out/
          retention-days: 2

  aggregate:
    needs: scan
    if: always() && needs.scan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy requests
      - uses: actions/download-artifact@v4
        with:
          pattern: sma350-*
          path: sma350_shards
          merge-multiple: true
      - run: |
          python crypto/research/sma350_retest_research.py \
            --mode aggregate --input-dir sma350_shards \
            --out crypto/research/results_sma350_retest
      - name: Commit SMA350 research
        run: |
          git config user.name "appwiza-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crypto/research/results_sma350_retest
          if ! git diff --cached --quiet; then
            git commit -m "Update SMA350 support-retest research"
            git pull --rebase -X ours origin main || true
            git push origin HEAD:main || true
          fi
