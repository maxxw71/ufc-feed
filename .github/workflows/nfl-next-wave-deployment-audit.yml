name: NFL next-wave deployment audit
on:
  push:
    branches: [main]
    paths:
      - 'scripts/nfl_next_wave_deployment_audit.py'
      - '.github/workflows/nfl-next-wave-deployment-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, appwiza]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Run next-wave deployment audit
        shell: bash
        run: |
          set -Eeuo pipefail
          /home/anestishkurti92/nfl-predictor-v1/venv/bin/python "$GITHUB_WORKSPACE/scripts/nfl_next_wave_deployment_audit.py"
      - name: Publish results
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC=/home/appwiza-runner/nfl-context-data/next_wave_deployment_audit
          DEST="$GITHUB_WORKSPACE/nfl/next_wave_deployment_audit"
          mkdir -p "$DEST"
          cp "$SRC/summary.json" "$DEST/summary.json"
          cp "$SRC/report.txt" "$DEST/report.txt"
          cp "$SRC/next_wave_deployment_audit.csv" "$DEST/next_wave_deployment_audit.csv"
          cp "$SRC/next_wave_ready.csv" "$DEST/next_wave_ready.csv"
          cp "$SRC/next_wave_watch.csv" "$DEST/next_wave_watch.csv"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add nfl/next_wave_deployment_audit
          if ! git diff --cached --quiet; then
            git commit -m 'Update NFL next-wave deployment audit'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
