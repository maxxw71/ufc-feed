name: DWCS BFO Event Archive Probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dwcs-bfo-event-archive-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, appwiza]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Probe BestFightOdds archive event routes
        run: |
          python - <<'PY'
          import json,re,requests
          from pathlib import Path
          from bs4 import BeautifulSoup
          out=Path('dwcs/research/bfo_event_probe'); out.mkdir(parents=True,exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Appwiza-DWCS-BFO/1.0','Accept-Language':'en-US,en;q=0.9'})
          urls=[
            'https://www.bestfightodds.com/archive',
            'https://www.bestfightodds.com/archive?page=2',
            'https://www.bestfightodds.com/archive?search=contender',
            'https://www.bestfightodds.com/archive?query=contender',
            'https://www.bestfightodds.com/archive?q=contender'
          ]
          rows=[]
          for u in urls:
            try:
              r=s.get(u,timeout=30)
              soup=BeautifulSoup(r.text,'html.parser')
              links=[]
              for a in soup.find_all('a',href=True):
                href=a['href']; txt=' '.join(a.get_text(' ',strip=True).split())
                if '/events/' in href or 'contender' in txt.lower() or 'dwcs' in txt.lower():
                  links.append({'text':txt,'href':href})
              forms=[]
              for f in soup.find_all('form'):
                forms.append({'action':f.get('action'),'method':f.get('method'),
                              'inputs':[{'name':i.get('name'),'value':i.get('value'),'type':i.get('type')} for i in f.find_all('input')]})
              rows.append({'url':u,'status':r.status_code,'chars':len(r.text),'links':links[:100],'forms':forms[:20]})
            except Exception as e:
              rows.append({'url':u,'error':repr(e)})
          (out/'probe.json').write_text(json.dumps(rows,indent=2))
          print(json.dumps(rows,indent=2)[:20000])
          PY
      - name: Commit probe
        run: |
          git config user.name appwiza-research-bot
          git config user.email actions@users.noreply.github.com
          git add dwcs/research/bfo_event_probe
          git commit -m 'Probe BestFightOdds event archive routes' || exit 0
          git pull --rebase origin main
          git push
