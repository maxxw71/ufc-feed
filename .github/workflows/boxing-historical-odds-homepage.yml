name: Boxing historical odds homepage validation
on:
  push:
    branches: [main]
    paths:
      - 'boxing/research/validate_historical_odds_homepage.py'
      - '.github/workflows/boxing-historical-odds-homepage.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q beautifulsoup4 lxml
      - name: Download boxing research database
        run: |
          python - <<'PY'
          import io,zipfile,urllib.request,os
          u='https://appwiza.com/sports/downloads/boxing/research-database.zip'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 AppwizaHistoricalOddsHome/1.0'})
          with urllib.request.urlopen(req,timeout=180) as r:data=r.read()
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              name=next(n for n in z.namelist() if n.endswith('.sqlite3'))
              open('/tmp/boxing_research.sqlite3','wb').write(z.read(name))
          print(os.path.getsize('/tmp/boxing_research.sqlite3'))
          PY
      - name: Validate archived homepage prices
        env:
          BOXING_DB: /tmp/boxing_research.sqlite3
        run: python boxing/research/validate_historical_odds_homepage.py
      - name: Persist results on latest main
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/boxing-odds-home
          cp boxing/public_reports/HISTORICAL_ODDS_HOME_VALIDATION_REPORT.json /tmp/boxing-odds-home/
          cp boxing/public_reports/HISTORICAL_ODDS_HOME_VALIDATED_ROWS.json /tmp/boxing-odds-home/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/boxing-odds-home/* boxing/public_reports/
          git add boxing/public_reports/HISTORICAL_ODDS_HOME_VALIDATION_REPORT.json boxing/public_reports/HISTORICAL_ODDS_HOME_VALIDATED_ROWS.json
          if git diff --cached --quiet; then
            echo 'No homepage validation changes.'
          else
            git commit -m 'Publish boxing homepage odds validation'
            git push origin HEAD:main
          fi
